[package]
name = "control-catalog"
description = "The ControlCatalog sample of FerroUI: a page per control, the validation application of the port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# Unit tests live next to the code (`tests/` modules of the library), not as
# integration test targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
default = ["placeholder-branding"]
# Embeds the artwork of this project (`PlaceholderAssets/`) in place of the brand assets of the
# upstream project (see `build.rs`). On by default, for the desktop and the browser host alike;
# without it the sample shows the assets of the upstream sample unchanged.
placeholder-branding = []
# The assets other than the markup documents are not embedded in the binary: the build script
# copies them as plain files, with a list of the files each page needs, for the host to fetch and
# register (see build.rs). For the browser, where the WebAssembly module is downloaded and has a
# size budget.
separate-assets = []
# The performance counters of the framework (`ferroui_base::diagnostics::perf_counters`): the
# recycling benchmark of the tests prints them per recycled row. For measuring only.
perf-counters = ["ferroui-base/perf-counters", "ferroui-controls/perf-counters", "ferroui-markup-xaml/perf-counters"]
# Makes the global allocator of the test build of the sample one that counts allocations and
# bytes (`tests/allocations.rs`), for the recycling benchmark. Nothing but the test build of this
# crate is affected, and only with the feature. The allocation trace of the tests
# (`tests/allocation_trace.rs`) reads the blocks that are alive, and with the feature the weak
# references of the object model are marked for it (`ferroui-base/tagged-weak-references`).
count-allocations = ["ferroui-base/tagged-weak-references"]
# The documents are not compiled by the build: every document is an embedded asset, and the classes
# are populated by the run-time XAML loader, as the sample was before its markup was compiled. For
# working on the documents and the classes of the sample, where a build without the compiled markup is
# several times shorter (docs/porting/xaml.md, 9.5.22, has the measures).
runtime-markup = ["dep:ferroui-markup-xaml-loader", "ferroui-controls-color-picker/document-assets"]

[dependencies]
# The compiled markup of the crate calls the typed functions of the declared members.
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
# The colour picker library (the colour picker page and the styles of App.xaml).
ferroui-controls-color-picker = { workspace = true }
# The about dialog.
ferroui-dialogs = { workspace = true }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
# The run-time XAML loader, only with the feature `runtime-markup`: the documents of the sample are
# compiled by its build, and the crate does not link the loader.
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime"], optional = true }
# The OpenGL pages: the OpenGL control and the entry points the scene of the pages draws with.
ferroui-opengl = { workspace = true }
ferroui-themes-simple = { workspace = true }
ferroui-themes-fluent = { workspace = true }
# The Skia lease of `Pages/TabbedPage/FluidNavBar` (custom drawing on the canvas of the backend).
ferroui-skia = { workspace = true }
skia-safe = { workspace = true }
mini-mvvm = { path = "../MiniMvvm" }
# The compatibility decomposition of the search keys of the pages (`PageItem::create_search_key`).
unicode-normalization = "0.1"

[build-dependencies]
# The build script compiles the documents (`build.rs`) against the type models: the scan of the
# sources of this crate and the models of the crates it is built on. It links the compiler and no
# crate for its types.
ferroui-build = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
# The render interface, font manager and text shaper of the tests: the pages decode bitmaps and
# lay out text, which the mock services of the framework tests do not.
ferroui-skia = { workspace = true }
ferroui-harfbuzz = { workspace = true }
# The styles of the colour picker as assets too: `App.xaml` loaded with the run-time loader includes
# them, and the loader leaves such an include to run time only for a document the asset loader has.
ferroui-controls-color-picker = { workspace = true, features = ["document-assets"] }
# The run-time loader of the tests: every document is loaded with it too, and each class populated by
# its compiled markup is compared with the class the loader populates (`tests/compiled_markup.rs`);
# the reproductions of the gaps load markup text.
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime"] }
