[package]
name = "control-catalog"
description = "The ControlCatalog sample of FerroUI: a page per control, the validation application of the port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# Unit tests live next to the code (`tests/` modules of the library), not as
# integration test targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
default = ["placeholder-branding"]
# Embeds the artwork of this project (`PlaceholderAssets/`) in place of the brand assets of the
# upstream project (see `build.rs`). On by default, for the desktop and the browser host alike;
# without it the sample shows the assets of the upstream sample unchanged.
placeholder-branding = []
# The assets other than the markup documents are not embedded in the binary: the build script
# copies them as plain files, with a list of the files each page needs, for the host to fetch and
# register (see build.rs). For the browser, where the WebAssembly module is downloaded and has a
# size budget.
separate-assets = []

[dependencies]
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
# The about dialog.
ferroui-dialogs = { workspace = true }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
# The documents of the sample are loaded through the run-time XAML loader until the build-time
# compiler exists; the dependency goes away with it.
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime"] }
ferroui-themes-simple = { workspace = true }
ferroui-themes-fluent = { workspace = true }
# The Skia lease of `Pages/TabbedPage/FluidNavBar` (custom drawing on the canvas of the backend).
ferroui-skia = { workspace = true }
skia-safe = { workspace = true }
mini-mvvm = { path = "../MiniMvvm" }
# The compatibility decomposition of the search keys of the pages (`PageItem::create_search_key`).
unicode-normalization = "0.1"

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
# The render interface, font manager and text shaper of the tests: the pages decode bitmaps and
# lay out text, which the mock services of the framework tests do not.
ferroui-skia = { workspace = true }
ferroui-harfbuzz = { workspace = true }
