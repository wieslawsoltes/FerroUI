[package]
name = "livecharts-demo"
description = "Compiled-XAML gallery of the six native FerroUI LiveCharts chart families"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"
autobins = false
autotests = false

[lib]
name = "livecharts_demo"
path = "lib.rs"

[[bin]]
name = "livecharts-demo"
path = "desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "livecharts-render"
path = "render.rs"
required-features = ["render"]

[features]
default = []
desktop = ["dep:ferroui-desktop"]
render = ["dep:ferroui-headless", "dep:ferroui-vello"]

[dependencies]
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls.workspace = true
ferroui-controls-livecharts = { workspace = true, features = ["markup-functions"] }
ferroui-livecharts.workspace = true
ferroui-markup-xaml.workspace = true
ferroui-themes-simple.workspace = true
ferroui-fonts-inter.workspace = true
ferroui-desktop = { workspace = true, optional = true }
ferroui-headless = { workspace = true, optional = true }
ferroui-vello = { workspace = true, optional = true }

[build-dependencies]
ferroui-build.workspace = true

[dev-dependencies]
ferroui-base = { workspace = true, features = ["compiler-metadata", "testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "testing", "emitter"] }
