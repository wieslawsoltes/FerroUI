[package]
name = "qml-gallery"
description = "A native, interactive FerroUI window authored in QML"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "qml-gallery"
path = "main.rs"

[dependencies]
ferroui-qml.workspace = true
ferroui-qml-controls.workspace = true
ferroui-view = { workspace = true, features = ["desktop"] }
ferroui-themes-winui.workspace = true

[build-dependencies]
ferroui-qml-build.workspace = true
