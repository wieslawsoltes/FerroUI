[package]
name = "material-theme-gallery"
description = "Android Material 3 Expressive control gallery with light/dark, RTL and capture modes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"
autotests = false
autobenches = false
autoexamples = false
autobins = false

[lib]
path = "lib.rs"

[[bin]]
name = "material-theme-gallery"
path = "program.rs"

[dependencies]
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls.workspace = true
ferroui-dialogs.workspace = true
ferroui-markup.workspace = true
ferroui-markup-xaml.workspace = true
ferroui-themes-material.workspace = true
ferroui-desktop.workspace = true
sample-support = { path = "../SampleSupport" }

[build-dependencies]
sample-build = { path = "../SampleBuild" }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
sample-testing = { path = "../SampleTesting" }
