[package]
name = "seven-guis-crud-hooks"
description = "7GUIs, CRUD: written with components that run again and hooks of ferroui-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
path = "lib.rs"
# The scenario of the task runs in seven-guis-tests, with those of the other tasks.
test = false
doctest = false

[[bin]]
name = "seven-guis-crud-hooks"
path = "main.rs"
test = false

[dependencies]
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-view = { workspace = true }
seven-guis-model = { path = "../../Model" }
# The theme the window is in, constructed from the table of the units of the theme the build
# writes (`build.rs`); the runtime library of markup is named by the table.
ferroui-themes-winui = { workspace = true }
ferroui-markup-xaml = { workspace = true }

[build-dependencies]
ferroui-build = { workspace = true }
