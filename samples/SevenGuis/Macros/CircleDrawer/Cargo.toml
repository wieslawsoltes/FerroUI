[package]
name = "seven-guis-circle-drawer-macros"
description = "7GUIs, Circle Drawer: written with the rsx! macro of ferroui-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "lib.rs"
# The scenario of the task runs in seven-guis-tests, with those of the other tasks.
test = false
doctest = false

[[bin]]
name = "seven-guis-circle-drawer-macros"
path = "main.rs"
