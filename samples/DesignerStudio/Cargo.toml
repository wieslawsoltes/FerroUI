[package]
name = "designer-studio"
description = "Native FerroUI visual XAML designer workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "designer-studio"
path = "program.rs"

[features]
default = ["desktop", "mcp", "collaboration"]
desktop = ["dep:ferroui-desktop"]
headless = ["dep:ferroui-headless"]
mcp = ["ferroui-designer/mcp"]
# Sharing a document through the collaboration host; off for a browser host, whose target has no TLS
# random source for the client (the feature `collaboration-client` of `ferroui-designer`).
collaboration = ["ferroui-designer/collaboration-client"]

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-designer = { workspace = true }
ferroui-markup-xaml.workspace = true
ferroui-themes-winui = { workspace = true, features = ["designer-sources"] }
ferroui-desktop = { workspace = true, optional = true }
ferroui-headless = { workspace = true, optional = true }
sample-support = { path = "../SampleSupport" }
