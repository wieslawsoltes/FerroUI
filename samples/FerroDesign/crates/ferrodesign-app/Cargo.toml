[package]
name = "ferrodesign-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ferrodesign-app"
path = "src/main.rs"

[dependencies]
ferrodesign-core = { path = "../ferrodesign-core" }
ferroui-base = { path = "../../../../src/FerroUI.Base", features = ["markup-functions"] }
ferroui-controls = { path = "../../../../src/FerroUI.Controls" }
ferroui-markup = { path = "../../../../src/Markup/FerroUI.Markup" }
ferroui-markup-xaml = { path = "../../../../src/Markup/FerroUI.Markup.Xaml" }
ferroui-themes-fluent = { path = "../../../../src/FerroUI.Themes.Fluent" }
ferroui-fonts-inter = { path = "../../../../src/FerroUI.Fonts.Inter" }
serde_json = "1"

[target.'cfg(target_os = "emscripten")'.dependencies]
ferroui-browser = { path = "../../../../src/Browser/FerroUI.Browser", default-features = false, features = ["vello"] }
wasm-bindgen = "=0.2.129"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
ferroui-headless = { path = "../../../../src/Headless/FerroUI.Headless" }
ferroui-vello = { path = "../../../../src/Vello/FerroUI.Vello", features = ["hybrid"] }
ferroui-harfbuzz = { path = "../../../../src/HarfBuzz/FerroUI.HarfBuzz" }

[target.'cfg(target_os = "linux")'.dependencies]
ferroui-x11 = { path = "../../../../src/FerroUI.X11" }

[target.'cfg(windows)'.dependencies]
ferroui-win32 = { path = "../../../../src/Windows/FerroUI.Win32", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native = { path = "../../../../src/FerroUI.Native" }

[build-dependencies]
ferroui-build = { path = "../../../../src/FerroUI.Build.Tasks" }

[target.'cfg(not(target_os = "emscripten"))'.dev-dependencies]
# Export tests load the emitted XAML and compare its actual public API pixels.
ferroui-markup-xaml-loader = { path = "../../../../src/Markup/FerroUI.Markup.Xaml.Loader" }
