[package]
name = "hello-world"
description = "The smallest FerroUI application: one window with \"Hello, World!\" in the WinUI theme, written in XAML; the size floor of an application in that theme (docs/binary-size.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# Unit tests live next to the code (`tests/` modules of the library), not as integration test
# targets.
autotests = false
autobenches = false
autoexamples = false
autobins = false

[lib]
path = "lib.rs"

[[bin]]
name = "hello-world"
path = "program.rs"

# Only what the application uses: the framework, the compiled markup and its runtime library,
# the WinUI theme and the desktop entry point.
[dependencies]
# The compiled markup of the crate calls the typed functions of the declared members.
# Compiled markup only: the tables of types are not registered at start-up (#566, opt-in).
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-themes-winui = { workspace = true }
ferroui-desktop = { path = "../../src/FerroUI.Desktop", default-features = false }
sample-support = { path = "../SampleSupport" }

[features]
default = ["skia"]
skia = ["ferroui-desktop/skia"]
direct2d = ["ferroui-desktop/direct2d", "dep:ferroui-direct2d"]
direct2d-runtime-shaders = ["direct2d", "ferroui-direct2d/runtime-shaders"]
quartz = ["ferroui-desktop/quartz", "dep:ferroui-native"]
quartz-metal = ["quartz", "ferroui-desktop/quartz-metal", "dep:ferroui-quartz"]
quartz-runtime-shaders = ["quartz-metal", "ferroui-desktop/quartz-runtime-shaders"]

[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native = { workspace = true, optional = true }
ferroui-quartz = { workspace = true, optional = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
ferroui-direct2d = { workspace = true, optional = true }

[build-dependencies]
sample-build = { path = "../SampleBuild" }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
sample-testing = { path = "../SampleTesting" }

# The WinUI theme is constructed from the units of its compiled markup the application needs (the
# default): the window, the text block, what their themes reference, and the controls the sources
# name and the code of those controls creates (#568, steps 3 and 4 of
# docs/porting/theme-trimming.md). `[package.metadata.ferroui] theme-roots = "all"` keeps every unit,
# for comparing; a control whose name is built only at run time is named in `theme-roots`.
