# Ferro Desktop owns the panels, background and launcher.
set $mod Mod4
exec ferro-desktop-wayland --idle
input type:touchpad tap enabled
floating_modifier $mod normal
focus_follows_mouse no
focus_on_window_activation smart
default_border normal 2
default_floating_border normal 2
# Native client decorations honor their toolkit; Sway decorates eligible clients.
client.focused #56799D #305474 #FFFFFF #65BDDF #56799D
client.unfocused #3A4756 #293747 #CED7E2 #293747 #3A4756

bindsym $mod+space exec ferro-desktop-wayland --show=applications
bindsym $mod+a exec ferro-desktop-wayland --show=settings
bindsym $mod+n exec ferro-desktop-wayland --show=notifications
bindsym $mod+Tab exec ferro-desktop-wayland --show=workspaces
bindsym $mod+Return exec ferro-desktop-wayland --terminal
bindsym $mod+l exec ferro-desktop-wayland --lock
bindsym Mod1+F4 kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+space floating toggle
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+c reload
bindsym $mod+Shift+e exec swaynag -t warning -m 'End this Ferro Desktop session?' -B 'Log out' 'swaymsg exit'
