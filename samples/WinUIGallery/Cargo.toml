[package]
name = "winui-gallery"
default-run = "winui-gallery"
description = "The pinned WinUI Gallery catalog and its native FerroUI sample port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobins = false

[lib]
path = "lib.rs"

[[bin]]
name = "winui-gallery"
path = "main.rs"
required-features = ["desktop"]

[[bin]]
name = "winui-gallery-capture"
path = "capture.rs"
required-features = ["capture"]

[features]
default = []
desktop = ["dep:ferroui-desktop", "theme"]
theme = ["dep:ferroui-themes-winui"]
quartz-metal = ["desktop", "ferroui-desktop/quartz-metal", "dep:ferroui-native"]
capture = ["dep:ferroui-headless", "dep:ferroui-skia", "dep:ferroui-harfbuzz", "theme"]

[dependencies]
ferroui-media.workspace = true
ferroui-media-video.workspace = true
ferroui-media-camera.workspace = true
ferroui-media-controls.workspace = true
ferroui-media-video-controls.workspace = true
ferroui-media-camera-controls.workspace = true
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-controls-color-picker = { workspace = true, features = ["document-assets"] }
ferroui-controls-inking = { workspace = true, features = ["document-assets"] }
ferroui-controls-livecharts = { workspace = true }
ferroui-controls-repeater = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime"] }
ferroui-markup-xaml-winui = { workspace = true }
ferroui-desktop = { workspace = true, optional = true }
ferroui-themes-winui = { workspace = true, optional = true }
ferroui-headless = { workspace = true, optional = true }
ferroui-skia = { workspace = true, optional = true }
ferroui-harfbuzz = { workspace = true, optional = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }

[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native = {workspace=true,optional=true}
ferroui-media-apple = {workspace=true,features=["controls"]}
ferroui-media-video-apple.workspace = true
ferroui-media-camera-apple.workspace = true
[target.'cfg(windows)'.dependencies]
ferroui-media-windows = {workspace=true,features=["controls"]}
ferroui-media-video-windows.workspace = true
ferroui-media-camera-windows.workspace = true
ferroui-media-opengl.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
ferroui-media-linux = {workspace=true,features=["controls"]}
ferroui-media-video-linux.workspace = true
ferroui-media-camera-linux.workspace = true
ferroui-media-opengl.workspace = true
