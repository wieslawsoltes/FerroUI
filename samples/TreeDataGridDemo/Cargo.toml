[package]
name = "treedatagrid-demo"
description = "The TreeDataGrid demo of FerroUI: countries with sorting, filtering and editing, a file tree, people declared in markup, drag and drop, an article list and the pages of the core sources; its pages are shared with the ControlCatalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# Unit tests live next to the code (`tests/` modules of the library), not as integration test
# targets.
autotests = false
autobenches = false
autoexamples = false
autobins = false

[lib]
path = "lib.rs"

# The desktop entry point: `Program.cs` of the reference demo.
[[bin]]
name = "treedatagrid-demo"
path = "program.rs"
required-features = ["app"]

[features]
default = ["app", "online"]
# The application of the demo: `App.xaml` with the Fluent theme, the main window of tabs and the
# entry point. Without it the crate is the views and their view models, which the ControlCatalog
# shows in its pages (it depends on the crate without the default features, so that it links
# neither this application nor its theme; docs/binary-size.md).
app = ["dep:ferroui-themes-fluent", "dep:ferroui-desktop"]
# The article list of the Wikipedia page loads from the network.
online = ["dep:ureq"]

[dependencies]
# The compiled markup of the crate calls the typed functions of the declared members.
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-themes-fluent = { workspace = true, optional = true }
ferroui-treedatagrid-core = { workspace = true }
ferroui-controls-treedatagrid = { workspace = true }
# The entry point.
ferroui-desktop = { workspace = true, optional = true }
# The articles of the Wikipedia page (the reference uses System.Text.Json).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The view models (the reference uses ReactiveUI).
mini-mvvm = { path = "../MiniMvvm" }
sample-support = { path = "../SampleSupport" }

# The HTTP client of the Wikipedia page, with the feature `online` (the reference uses HttpClient).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2.12.1", optional = true }

[build-dependencies]
sample-build = { path = "../SampleBuild" }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
sample-testing = { path = "../SampleTesting" }
# The theme documents of the control as assets too: the run-time loader of the tests includes them.
ferroui-controls-treedatagrid = { workspace = true, features = ["document-assets"] }
