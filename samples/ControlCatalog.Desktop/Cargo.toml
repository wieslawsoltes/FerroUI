[package]
name = "control-catalog-desktop"
description = "The desktop entry point of the ControlCatalog sample of FerroUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

[[bin]]
name = "control-catalog-desktop"
path = "program.rs"

[dependencies]
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-desktop = { workspace = true }
control-catalog = { path = "../ControlCatalog" }
ferroui-vello = { workspace = true, optional = true, features = ["hybrid", "gpu"] }

[features]
# The Vello render backend beside Skia: `FERROUI_RENDERER=vello` (the default order of its modes),
# `vello-hybrid`, `vello-gpu` or `vello-cpu` then chooses it at start.
vello = ["dep:ferroui-vello"]
