[package]
name = "control-catalog-desktop"
description = "The desktop entry point of the ControlCatalog sample of FerroUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

[[bin]]
name = "control-catalog-desktop"
path = "program.rs"

[dependencies]
ferroui-mcp = { workspace = true, optional = true }
ferroui-headless = { workspace = true, optional = true }
ferroui-devtools = { workspace = true, optional = true, features = ["server"] }
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-desktop = { workspace = true }
# `--vnc`: the catalog on the headless platform, seen and driven through a VNC viewer.
ferroui-headless-vnc = { workspace = true }
control-catalog = { path = "../ControlCatalog" }
# DevTools on F12 in debug builds.
ferroui-diagnostics = { workspace = true }
ferroui-vello = { workspace = true, optional = true, features = ["hybrid", "gpu"] }

# The options of a smoke run on Windows (`FERROUI_SMOKE_RENDERING`).
[target.'cfg(windows)'.dependencies]
ferroui-win32 = { workspace = true, features = ["angle"] }

# The options of a smoke run on macOS (`FERROUI_SMOKE_RENDERING`).
[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native = { workspace = true }

# The native control demo of Linux: a window of the X server and a file chooser of GTK.
[target.'cfg(target_os = "linux")'.dependencies]
ferroui-x11 = { workspace = true }
# The Wayland backend, which the catalog uses when a compositor can be reached, with the backend
# of the platform detection as its fallback (`FERROUI_CATALOG_WAYLAND=0` leaves it out).
ferroui-wayland = { workspace = true }
ferroui-linuxframebuffer = { workspace = true }

[features]
# The Simple and Fluent themes of the original beside the WinUI theme (`FERROUI_CATALOG_THEME`, the
# settings page); off by default (docs/binary-size.md).
classic-themes = ["control-catalog/classic-themes"]
mcp = ["dep:ferroui-mcp", "dep:ferroui-headless"]
# Explicit opt-in to the local CDP endpoint; FERROUI_CDP_PORT starts it.
cdp = ["dep:ferroui-devtools"]
# The Vello render backend beside Skia: `FERROUI_RENDERER=vello` (the default order of its modes),
# `vello-hybrid`, `vello-gpu` or `vello-cpu` then chooses it at start.
vello = ["dep:ferroui-vello"]
# The Vulkan rendering mode on Windows (`FERROUI_SMOKE_RENDERING=vulkan`): the feature `vulkan` of
# the Windows backend, with which Skia is compiled from source (docs/porting/vulkan.md, section 2).
# Elsewhere it changes nothing.
vulkan = ["ferroui-win32/vulkan"]
