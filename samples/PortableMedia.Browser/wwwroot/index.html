<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FerroUI portable media</title>
<style>html,body,#out{width:100%;height:100%;margin:0}#out{position:relative}</style></head>
<body><div id="out"></div>
<nav style="position:fixed;right:12px;top:12px;display:flex;gap:8px;z-index:2" aria-label="Media sample">
<label>Open video <input id="file" type="file" accept="video/*"></label>
<button id="camera">Start camera</button><button id="photo">Capture JPEG</button><button id="clear">Close media</button>
</nav><script type="module" src="./main.js"></script></body></html>
