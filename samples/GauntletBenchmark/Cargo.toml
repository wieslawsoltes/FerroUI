[package]
name = "gauntlet-benchmark"
description = "The gauntlet, the still wall and the patchwork of the Cranpose UI benchmark in FerroUI: a heavy animated screen, a still one and one that changes in small parts, driven frame by frame for a cross-framework comparison"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

autotests = false
autobenches = false
autoexamples = false
autobins = false

# The screens and the application, shared by the program and the frame gate.
[lib]
path = "lib.rs"
test = false
doctest = false

[[bin]]
name = "perf-compare-ferroui"
path = "program.rs"
test = false

# The frame gate of the local performance gate (`scripts/perf/gate.py`): the gauntlet and the still
# wall in a headless window, timed frame by frame. Ignored by default; see `README.md`.
[[test]]
name = "frame_gate"
path = "tests/frame_gate.rs"

# Only what the benchmark uses: the framework, the Fluent theme and the desktop entry point.
[dependencies]
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-themes-fluent = { workspace = true }
ferroui-desktop = { path = "../../src/FerroUI.Desktop", default-features = false }
ferroui-vello = { workspace = true, optional = true, features = ["hybrid", "gpu"] }
url = { workspace = true }

# The frame gate: the test services of the framework (a headless window over a compositor), the
# Skia render interface and font manager and the HarfBuzz shaper, as the frame benchmarks of the
# control catalog have them.
[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-skia = { workspace = true }
ferroui-harfbuzz = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native = { workspace = true, optional = true }

[features]
default = ["skia"]
skia = ["ferroui-desktop/skia"]
quartz = ["ferroui-desktop/quartz", "dep:ferroui-native"]
quartz-metal = ["quartz", "ferroui-desktop/quartz-metal"]
# The Vello render backend beside Skia: `FERROUI_RENDERER=vello` (the default order of its modes),
# `vello-hybrid`, `vello-gpu` or `vello-cpu` then chooses it at start.
vello = ["dep:ferroui-vello"]
# The framework's work counters in the frame gate: `--features counters` prints them per frame.
counters = ["ferroui-base/perf-counters"]
