[package]
name = "gauntlet-benchmark"
description = "The gauntlet and the still wall of the Cranpose UI benchmark in FerroUI: a heavy animated screen and a still one, driven frame by frame for a cross-framework comparison"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

autotests = false
autobenches = false
autoexamples = false
autobins = false

# The screens and the application, shared by the program and the frame gate.
[lib]
path = "lib.rs"
test = false
doctest = false

[[bin]]
name = "perf-compare-ferroui"
path = "program.rs"
test = false

# The frame gate of the local performance gate (`scripts/perf/gate.py`): the gauntlet and the still
# wall in a headless window, timed frame by frame. Ignored by default; see `README.md`.
[[test]]
name = "frame_gate"
path = "tests/frame_gate.rs"

# Only what the benchmark uses: the framework, the Fluent theme and the desktop entry point.
[dependencies]
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-themes-fluent = { workspace = true }
ferroui-desktop = { path = "../../src/FerroUI.Desktop", default-features = false }
ferroui-vello = { workspace = true, optional = true, features = ["hybrid", "gpu"] }
ferroui-progpu = { workspace = true, optional = true }
url = { workspace = true }

# The frame gate: the test services of the framework (a headless window over a compositor), the
# Skia render interface and font manager and the HarfBuzz shaper, as the frame benchmarks of the
# control catalog have them.
[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-skia = { workspace = true }
ferroui-harfbuzz = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native = { workspace = true, optional = true }

# Windows alone: the Direct2D render backend (the feature `direct2d`) and what the renderer
# measurement needs (the feature `renderer-measurement`). A default build has none of them.
[target.'cfg(windows)'.dependencies]
ferroui-win32 = { workspace = true, default-features = false, optional = true }
ferroui-direct2d = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["skia"]
skia = ["ferroui-desktop/skia"]
direct2d = ["ferroui-desktop/direct2d", "dep:ferroui-direct2d"]
direct2d-runtime-shaders = ["direct2d", "ferroui-direct2d/runtime-shaders"]
# The fixed-frame renderer measurement on Windows (`measurement.rs`), which
# `scripts/compare-windows-gauntlet-renderers.ps1` drives with `PERF_MEASURE_FRAMES`. Off by
# default: without it the benchmark is what the cross-framework harness runs. On other targets the
# feature adds nothing.
renderer-measurement = ["dep:ferroui-win32", "dep:serde_json"]
quartz = ["ferroui-desktop/quartz", "dep:ferroui-native"]
quartz-metal = ["quartz", "ferroui-desktop/quartz-metal"]
# The Vello render backend beside Skia: `FERROUI_RENDERER=vello` (the default order of its modes),
# `vello-hybrid`, `vello-gpu` or `vello-cpu` then chooses it at start.
vello = ["dep:ferroui-vello"]
# The ProGPU render backend beside Skia: `FERROUI_RENDERER=progpu` then chooses it at start. It
# builds the native engine of the backend, which needs CMake and a C++ toolchain.
progpu = ["dep:ferroui-progpu"]
# The framework's work counters in the frame gate: `--features counters` prints them per frame.
counters = ["ferroui-base/perf-counters"]
