<!DOCTYPE html>

<html>

<head>
    <title>FerroUI - ControlCatalog</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./app.css" />
    <!-- Upstream's page has a preload element that the build fills with the boot resources of the
         runtime. Here: the scripts main.js imports, the WebAssembly module (fetched by the script of
         the module with credentials "same-origin", which `crossorigin` matches) and the asset bundle,
         so that the downloads start with the page instead of after its scripts. -->
    <link rel="modulepreload" href="./main.js" />
    <link rel="modulepreload" href="./control-catalog-browser.js" />
    <link rel="modulepreload" href="./ferroui.js" />
    <link rel="preload" href="./control_catalog_browser.wasm" as="fetch" type="application/wasm" crossorigin />
    <link rel="preload" href="./control-catalog.assets" as="fetch" crossorigin />
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <div class="ferroui-splash">
        <h2>
            Powered by
            <a href="https://github.com/wieslawsoltes/FerroUI" target="_blank">
                <svg width="52" height="52" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="64" height="64" rx="14" fill="currentColor"/>
                    <rect x="19" y="14" width="8" height="36" rx="2" class="mark-glyph"/>
                    <rect x="19" y="14" width="27" height="8" rx="2" class="mark-glyph"/>
                    <rect x="19" y="29" width="20" height="7" rx="2" class="mark-glyph"/>
                </svg>
                FerroUI
            </a>
        </h2>
    </div>
</div>
<script type='module' src="./main.js"></script>
</body>

</html>
