[package]
name = "control-catalog-browser"
description = "The browser entry point of the ControlCatalog sample of FerroUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

# A binary: the Emscripten target links wasm-bindgen exports only into executables. The host page
# creates the module and calls `runMain`; `scripts/build-browser.sh control-catalog-browser`
# assembles the site.
[[bin]]
name = "control-catalog-browser"
path = "program.rs"

[dependencies]
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-browser = { workspace = true }
ferroui-fonts-inter = { workspace = true }
control-catalog = { path = "../ControlCatalog" }
wasm-bindgen = { workspace = true }

# The Vello render backend beside Skia in the module, chosen with `?Renderer=Vello`
# (docs/porting/vello-backend.md, section 12). Off by default: the published module is the Skia one.
[features]
default = []
vello = ["ferroui-browser/vello"]

# The published site carries the artwork of this project instead of the upstream brand assets of the
# sample (see `samples/ControlCatalog/PlaceholderAssets`); the feature is a default of the sample and
# is named here so that the site cannot lose it. The pictures and fonts of the sample are
# plain files of the site (`assets/ControlCatalog/`, feature `separate-assets`) that the host page
# fetches next to the module, so that the module stays within its size budget.
[target.'cfg(target_os = "emscripten")'.dependencies]
control-catalog = { path = "../ControlCatalog", features = ["placeholder-branding", "separate-assets"] }
