[package]
name = "ferroboard-sample"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"
links = "ferroboard_sample_xaml"
[features]
default = ["desktop"]
desktop = ["dep:ferroui-desktop"]
[lib]
path = "lib.rs"
[[bin]]
name = "ferroboard-sample"
path = "program.rs"
required-features = ["desktop"]
[dependencies]
ferroboard-core = { path = "../../src/FerroBoard.Core" }
ferroboard-core-ferro = { path = "../../src/FerroBoard.Core.Ferro" }
ferroboard-controls = { path = "../../src/FerroBoard.Controls" }
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls.workspace = true
ferroui-markup-xaml.workspace = true
ferroui-system.workspace = true
ferroui-themes-winui.workspace = true
ferroui-reactiveui.workspace = true
ferroui-reactive.workspace = true
ferroui-desktop = { workspace = true, optional = true }
[build-dependencies]
ferroui-build.workspace = true
[dev-dependencies]
ferroui-headless.workspace = true
serde_json = "1.0"

[[example]]
name = "render_themes"
path = "examples/render_themes.rs"
required-features = ["desktop"]

[[example]]
name = "wheel_routing_probe"
path = "examples/wheel_routing_probe.rs"
required-features = ["desktop"]

[[example]]
name = "window_focus_probe"
path = "examples/window_focus_probe.rs"
required-features = ["desktop"]

[[example]]
name = "selection_write_probe"
path = "examples/selection_write_probe.rs"
required-features = ["desktop"]

[[example]]
name = "shared_engine_probe"
path = "examples/shared_engine_probe.rs"
required-features = ["desktop"]

[[example]]
name = "memory_sample"
path = "examples/memory_sample.rs"
required-features = ["desktop"]
