[package]
name = "ferroboard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
path = "lib.rs"
[dependencies]
ferroui-system.workspace = true
serde = "1.0"
serde_json = "1.0"
indexmap = "2.14.2"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
parking_lot = "=0.12.5"
uuid = { version = "=1.28.0", default-features = false, features = ["std", "v4"] }
sys-locale = "=0.3.2"
time = { version = "=0.3.55", default-features = false, features = ["std"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-platform"] }
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "=0.4.1"
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Globalization", "Win32_Foundation"] }
[build-dependencies]
pkg-config = "=0.3.34"
[dev-dependencies]
sha2 = "0.10"
