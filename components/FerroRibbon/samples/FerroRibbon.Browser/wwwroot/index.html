<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FerroRibbon Gallery</title>
    <link rel="icon" href="./favicon.ico">
    <style>
        html, body, #out { width: 100%; height: 100%; margin: 0; }
        #out { position: relative; }
        .ferroui-splash {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: grid;
            place-items: center;
            background: #f5f5f5;
        }
        .ferroui-splash img {
            width: auto;
            height: auto;
            max-width: min(90%, 620px);
            max-height: min(90%, 300px);
        }
        .ferroui-splash progress {
            position: absolute;
            inset: auto 8px 8px;
            width: calc(100% - 16px);
            height: 4px;
            accent-color: #159bff;
        }
        .ferroui-splash.splash-close { display: none; }
    </style>
    <noscript><style>.ferroui-splash { display: none; }</style></noscript>
</head>
<body>
    <main id="out" aria-label="FerroRibbon Gallery">
        <div class="ferroui-splash">
            <img src="./splash_screen.scale-200.png" alt="" width="256" height="256">
            <progress aria-label="Loading FerroRibbon Gallery"></progress>
        </div>
        <noscript>Enable JavaScript to open FerroRibbon Gallery.</noscript>
    </main>
    <script type="module" src="./main.js"></script>
</body>
</html>
