[package]
name = "xamlx"
description = "Rust port of the backend-independent part of XamlX (XAML compiler library)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["xaml", "compiler", "markup", "parser"]
categories = ["compilers", "parser-implementations"]
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
# Exposes the in-memory fake type system (`xamlx::testing`) to dependent crates.
testing = []

[dependencies]
roxmltree = { workspace = true }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "markup"
