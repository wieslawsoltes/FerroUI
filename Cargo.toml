[workspace]
resolver = "2"
members = [
    "src/FerroUI.Base",
    "src/FerroUI.Controls",
    "src/Markup/FerroUI.Markup",
    "src/Markup/FerroUI.Markup.Xaml",
    "src/Markup/FerroUI.Markup.Xaml.Loader",
    "src/FerroUI.MicroCom",
    "src/FerroUI.Native",
    "src/FerroUI.Desktop",
    "src/Browser/FerroUI.Browser",
    "src/FerroUI.Fonts.Inter",
    "src/FerroUI.Dialogs",
    "src/FerroUI.Themes.Simple",
    "src/FerroUI.Themes.Fluent",
    "src/FerroUI.OpenGL",
    "src/Skia/FerroUI.Skia",
    "src/HarfBuzz/FerroUI.HarfBuzz",
    "src/tools/MicroCom.CodeGenerator",
    "external/XamlX/src/XamlX",
    "tests/FerroUI.Markup.Xaml.UnitTests",
    "samples/MiniMvvm",
    "samples/ControlCatalog",
    "samples/ControlCatalog.Desktop",
    "samples/ControlCatalog.Browser",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/wieslawsoltes/FerroUI"

[workspace.dependencies]
ferroui-base = { path = "src/FerroUI.Base" }
ferroui-controls = { path = "src/FerroUI.Controls" }
ferroui-markup = { path = "src/Markup/FerroUI.Markup" }
ferroui-markup-xaml = { path = "src/Markup/FerroUI.Markup.Xaml" }
ferroui-markup-xaml-loader = { path = "src/Markup/FerroUI.Markup.Xaml.Loader" }
xamlx = { path = "external/XamlX/src/XamlX" }
ferroui-microcom = { path = "src/FerroUI.MicroCom" }
ferroui-native = { path = "src/FerroUI.Native" }
ferroui-desktop = { path = "src/FerroUI.Desktop" }
ferroui-browser = { path = "src/Browser/FerroUI.Browser" }
ferroui-fonts-inter = { path = "src/FerroUI.Fonts.Inter" }
ferroui-dialogs = { path = "src/FerroUI.Dialogs" }
ferroui-themes-simple = { path = "src/FerroUI.Themes.Simple" }
ferroui-themes-fluent = { path = "src/FerroUI.Themes.Fluent" }
ferroui-opengl = { path = "src/FerroUI.OpenGL" }
ferroui-skia = { path = "src/Skia/FerroUI.Skia" }
ferroui-harfbuzz = { path = "src/HarfBuzz/FerroUI.HarfBuzz" }
bitflags = "2"
paste = "1"
cc = "1"
skia-safe = { version = "0.153" }
# The version of the `wasm-bindgen` command-line tool on PATH has to be this exact version.
wasm-bindgen = "=0.2.129"
roxmltree = "0.20"
harfbuzz-sys = { version = "0.8", default-features = false, features = ["bundled"] }
rust_decimal = { version = "1.43", default-features = false }
time = { version = "0.3", default-features = false }
# The mounted volumes of the managed file chooser.
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }

# Whole-program optimisation in one code generation unit: the executables are
# 10 to 14 % smaller than with thin LTO over four units and start no slower
# (see scripts/perf-report.py); a full release build takes about twice as long
# and its link step needs about 6 GB of memory.
[profile.release]
lto = "fat"
codegen-units = 1

# The WebAssembly module of the browser (scripts/build-browser.sh): optimised for size, because the
# module is downloaded and compiled by every visitor (docs/porting/browser-platform.md, section 18).
# The crates of the run-time XAML loader stay optimised for speed: at "z" the start-up of a themed
# application took twice as long, because the theme markup is loaded through them.
# Thin LTO, one code generation unit per crate: fat LTO generates the code of the whole program
# (the compiled theme markup included) as one LLVM module, which needed about 15.5 GB of memory;
# thin LTO keeps one module per crate and needs about 8 GB, for 0.16 MB more with gzip
# (docs/porting/browser-platform.md, section 18, "Build memory").
[profile.browser]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1

[profile.browser.package.xamlx]
opt-level = 3

[profile.browser.package.ferroui-markup-xaml-loader]
opt-level = 3

[profile.browser.package.ferroui-markup-xaml]
opt-level = 3

[profile.browser.package.ferroui-markup]
opt-level = 3

[profile.browser.package.roxmltree]
opt-level = 3
