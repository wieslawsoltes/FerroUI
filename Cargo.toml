[workspace]
resolver = "2"
members = [
    "src/FerroUI.Base",
    "src/FerroUI.Controls",
    "src/FerroUI.Controls.ColorPicker",
    "src/Markup/FerroUI.Markup",
    "src/Markup/FerroUI.Markup.Xaml",
    "src/Markup/FerroUI.Markup.Xaml.Loader",
    "src/FerroUI.Build.Scan",
    "src/FerroUI.Build.Tasks",
    "src/FerroUI.MicroCom",
    "src/FerroUI.Native",
    "src/Windows/FerroUI.Win32",
    "src/FerroUI.Desktop",
    "src/FerroUI.X11",
    "src/iOS/FerroUI.iOS",
    "src/FerroUI.FreeDesktop",
    "src/Android/FerroUI.Android",
    "src/Browser/FerroUI.Browser",
    "src/Headless/FerroUI.Headless",
    "src/FerroUI.Fonts.Inter",
    "src/FerroUI.Dialogs",
    "src/FerroUI.Themes.Simple",
    "src/FerroUI.Themes.Fluent",
    "src/FerroUI.OpenGL",
    "src/FerroUI.Metal",
    "src/FerroUI.Remote.Protocol",
    "src/FerroUI.DesignerSupport",
    "src/Skia/FerroUI.Skia",
    "src/Vello/FerroUI.Vello",
    "src/HarfBuzz/FerroUI.HarfBuzz",
    "src/tools/MicroCom.CodeGenerator",
    "external/XamlX/src/XamlX",
    "tests/FerroUI.Markup.Xaml.UnitTests",
    "tests/XamlIncludeFixture/Theme",
    "tests/XamlIncludeFixture/Application",
    "tests/FerroUI.RenderBackends.Comparison",
    "tests/FerroUI.RenderTests",
    "tests/FerroUI.Benchmarks",
    "tests/FerroUI.LeakTests",
    "tests/FerroUI.IntegrationTests.Win32",
    "samples/MiniMvvm",
    "samples/ControlCatalog",
    "samples/ControlCatalog.Desktop",
    "samples/ControlCatalog.iOS",
    "samples/ControlCatalog.Browser",
    "samples/SampleBuild",
    "samples/SampleSupport",
    "samples/SampleTesting",
    "samples/SampleControls",
    "samples/RenderDemo",
    "samples/BindingDemo",
    "samples/VirtualizationDemo",
    "samples/TextTestApp",
    "samples/Sandbox",
    "samples/AppWithoutLifetime",
    "samples/IntegrationTestApp",
    "samples/ControlCatalog.Android",
]

[workspace.package]
version = "0.1.0-preview.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/wieslawsoltes/FerroUI"
homepage = "https://github.com/wieslawsoltes/FerroUI"
# What every published crate states beside its own description (docs/release.md, "Metadata"). The
# readme is the one of the repository: Cargo copies it into each package.
readme = "README.md"
keywords = ["gui", "ui", "xaml", "framework", "cross-platform"]
categories = ["gui"]

# The crates of the workspace are pinned to one another at the exact version of the workspace, so
# that the crates of a release are only ever resolved together (docs/release.md, "Version scheme").
# `scripts/release/set-version.sh <version>` writes the version above and these keys.
[workspace.dependencies]
ferroui-base = { version = "=0.1.0-preview.1", path = "src/FerroUI.Base" }
ferroui-controls = { version = "=0.1.0-preview.1", path = "src/FerroUI.Controls" }
ferroui-controls-color-picker = { version = "=0.1.0-preview.1", path = "src/FerroUI.Controls.ColorPicker" }
ferroui-markup = { version = "=0.1.0-preview.1", path = "src/Markup/FerroUI.Markup" }
ferroui-markup-xaml = { version = "=0.1.0-preview.1", path = "src/Markup/FerroUI.Markup.Xaml" }
# Without the default features: the default is the run-time back end, which links the XAML runtime library
# and the controls, and the build tool (`ferroui-build`) takes the compiler alone. Every crate that loads
# markup at run time states the `runtime` feature.
ferroui-markup-xaml-loader = { version = "=0.1.0-preview.1", path = "src/Markup/FerroUI.Markup.Xaml.Loader", default-features = false }
ferroui-build-scan = { version = "=0.1.0-preview.1", path = "src/FerroUI.Build.Scan" }
ferroui-build = { version = "=0.1.0-preview.1", path = "src/FerroUI.Build.Tasks" }
xamlx = { version = "=0.1.0-preview.1", path = "external/XamlX/src/XamlX" }
ferroui-microcom = { version = "=0.1.0-preview.1", path = "src/FerroUI.MicroCom" }
microcom-codegen = { version = "=0.1.0-preview.1", path = "src/tools/MicroCom.CodeGenerator" }
ferroui-native = { version = "=0.1.0-preview.1", path = "src/FerroUI.Native" }
ferroui-win32 = { version = "=0.1.0-preview.1", path = "src/Windows/FerroUI.Win32" }
ferroui-desktop = { version = "=0.1.0-preview.1", path = "src/FerroUI.Desktop" }
ferroui-x11 = { version = "=0.1.0-preview.1", path = "src/FerroUI.X11" }
ferroui-ios = { version = "=0.1.0-preview.1", path = "src/iOS/FerroUI.iOS" }
ferroui-freedesktop = { version = "=0.1.0-preview.1", path = "src/FerroUI.FreeDesktop" }
ferroui-android = { version = "=0.1.0-preview.1", path = "src/Android/FerroUI.Android" }
ferroui-browser = { version = "=0.1.0-preview.1", path = "src/Browser/FerroUI.Browser" }
ferroui-headless = { version = "=0.1.0-preview.1", path = "src/Headless/FerroUI.Headless" }
ferroui-fonts-inter = { version = "=0.1.0-preview.1", path = "src/FerroUI.Fonts.Inter" }
ferroui-dialogs = { version = "=0.1.0-preview.1", path = "src/FerroUI.Dialogs" }
ferroui-themes-simple = { version = "=0.1.0-preview.1", path = "src/FerroUI.Themes.Simple" }
ferroui-themes-fluent = { version = "=0.1.0-preview.1", path = "src/FerroUI.Themes.Fluent" }
ferroui-opengl = { version = "=0.1.0-preview.1", path = "src/FerroUI.OpenGL" }
ferroui-metal = { version = "=0.1.0-preview.1", path = "src/FerroUI.Metal" }
ferroui-remote-protocol = { version = "=0.1.0-preview.1", path = "src/FerroUI.Remote.Protocol" }
ferroui-designer-support = { version = "=0.1.0-preview.1", path = "src/FerroUI.DesignerSupport" }
ferroui-skia = { version = "=0.1.0-preview.1", path = "src/Skia/FerroUI.Skia" }
ferroui-vello = { version = "=0.1.0-preview.1", path = "src/Vello/FerroUI.Vello" }
ferroui-harfbuzz = { version = "=0.1.0-preview.1", path = "src/HarfBuzz/FerroUI.HarfBuzz" }
bitflags = "2"
# The bindings of the Windows API for the Windows platform backend (docs/porting/win32-platform.md,
# section 2). Without features here: the backend names the API namespaces it calls.
windows-sys = { version = "0.61.2" }
# ANGLE for the Windows platform backend (docs/porting/win32-platform.md, section 6.2): compiled
# from source by its build script, only with the feature `angle` of ferroui-win32.
mozangle = { version = "=0.7.1" }
# The X11 platform (docs/porting/x11-platform.md, section 2): Xlib and its extension libraries, loaded
# at run time, and the C library for the event loop (epoll, the wake-up pipe) and shared memory.
x11-dl = "2.21"
libc = "0.2"
# D-Bus for the FreeDesktop services (docs/porting/x11-platform.md, section 3): pure Rust, its own
# executor thread per connection (the default features), no Tokio. `futures-util` for the streams of
# signals and for waiting on one of two futures.
zbus = { version = "=5.19.0" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The Android platform (docs/porting/android-platform.md, section 2.1): the declarations of the Java
# Native Interface, which one module of the backend wraps in safe functions.
jni-sys = { version = "=0.4.1" }
paste = "1"
cc = "1"
skia-safe = { version = "0.153" }
# The Vello render backend (docs/porting/vello-backend.md, section 2): exact versions, because the
# renderers of the Vello project change their interfaces between minor releases. `vello_cpu` without
# its default features: no thread pool (a drawing context is confined to the thread that draws), no
# PNG support of its own for images (the backend decodes and encodes with `png`). Its `text`
# feature draws glyph runs (`glifo`), and its `png` feature is on for the one thing it adds to
# that: the bitmap glyphs of a colour font. `skrifa` is the version `glifo` links, for the outlines
# of glyphs; `fontique` enumerates and matches the fonts of the system.
kurbo = { version = "=0.13.1" }
peniko = { version = "=0.6.1" }
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "u8_pipeline", "text", "png"] }
linesweeper = { version = "=0.5.0" }
png = { version = "=0.18.1" }
skrifa = { version = "=0.44.0" }
glifo = { version = "=0.4.0", default-features = false, features = ["std"] }
fontique = { version = "=0.12.0" }
# The codecs of the Vello render backend beside PNG (vello-backend.md, section 1.4), one crate a
# format, each with the features it needs and no more: JPEG is decoded by `zune-jpeg` (with its
# SIMD paths, which are its default) and encoded by `jpeg-encoder`, GIF is decoded by `gif`
# (without its color quantizer, which only its encoder uses), BMP and the bitmaps of an ICO by
# `zune-bmp`; `zune-core` has the options and the readers of the two zune crates.
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std", "neon", "x86"] }
zune-bmp = { version = "=0.5.2", default-features = false, features = ["std"] }
jpeg-encoder = { version = "=0.7.1", default-features = false, features = ["std"] }
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
# The GPU modes of the Vello backend (its features `hybrid` and `gpu`): the sparse-strips renderer on
# the GPU and the compute renderer, both on `wgpu`, each without its default features. `wgpu` with the
# graphics API of the one desktop platform that is built (Metal); Vulkan and Direct3D 12 join with
# their platforms. No crate but the Vello backend names these, and only behind its features.
# `vello_gpu` has two renderers: over `wgpu` (the feature `hybrid` of the backend adds its `wgpu`
# feature) and over a WebGL2 context through `web-sys` (the feature `hybrid-webgl` adds its `webgl`
# feature: the browser, docs/porting/vello-backend.md, section 12).
vello_gpu = { version = "=0.3.0", default-features = false, features = ["std", "text"] }
vello = { version = "=0.11.0", default-features = false, features = ["wgpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal"] }
# The version of the `wasm-bindgen` command-line tool on PATH has to be this exact version.
wasm-bindgen = "=0.2.129"
# The bindings of the WebGL2 renderer of `vello_gpu`, at the versions that belong to that release
# of `wasm-bindgen`; the Vello backend names them behind its feature `hybrid-webgl`.
js-sys = "=0.3.106"
web-sys = "=0.3.106"
roxmltree = "0.20"
harfbuzz-sys = { version = "0.8", default-features = false, features = ["bundled"] }
rust_decimal = { version = "1.43", default-features = false }
time = { version = "0.3", default-features = false }
# The mounted volumes of the managed file chooser.
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }

# The default release build is the one that is built most often, so it is set up for build time:
# thin LTO over the default sixteen code generation units, which generates code on all cores.
[profile.release]
lto = "thin"

# The build that is shipped and measured (`cargo build --profile dist`, `scripts/perf-report.py
# --profile dist`): whole-program optimisation in one code generation unit. The executables are
# 10 to 14 % smaller than with thin LTO over four units and start no slower
# (docs/porting/desktop-performance.md, section 6.2); the build takes about twice as long, because
# every executable generates the code of the whole program on one core, and its link step needs
# about 6 GB of memory.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# The WebAssembly module of the browser (scripts/build-browser.sh): optimised for size, because the
# module is downloaded and compiled by every visitor (docs/porting/browser-platform.md, section 18).
# The crates of the run-time XAML loader stay optimised for speed: at "z" the start-up of a themed
# application took twice as long, because the theme markup is loaded through them.
# Thin LTO, one code generation unit per crate: fat LTO generates the code of the whole program
# (the compiled theme markup included) as one LLVM module, which needed about 15.5 GB of memory;
# thin LTO keeps one module per crate and needs about 8 GB, for 0.16 MB more with gzip
# (docs/porting/browser-platform.md, section 18, "Build memory").
[profile.browser]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1

# The property system, styling, layout and the controls run on every frame that changes the view
# (a scrolled list detaches, clears, prepares and attaches a container per row). At "z" that code is
# barely inlined; at "s" scrolling the TableView page of the catalog takes about 20 % less processor
# time, for 3.0 MB more of module (0.76 MB with gzip; docs/porting/browser-platform.md, section 18,
# "Run-time speed of the framework crates").
[profile.browser.package.ferroui-base]
opt-level = "s"

[profile.browser.package.ferroui-controls]
opt-level = "s"

[profile.browser.package.xamlx]
opt-level = 3

[profile.browser.package.ferroui-markup-xaml-loader]
opt-level = 3

[profile.browser.package.ferroui-markup-xaml]
opt-level = 3

[profile.browser.package.ferroui-markup]
opt-level = 3

[profile.browser.package.roxmltree]
opt-level = 3

# The renderers of the Vello backend (in a module built with the feature `vello` of the browser
# crate; no other module links them): flattening, strips, the fine rasterization of the CPU mode,
# glyph outlines and the conversions of the backend are inner loops over every pixel or every curve
# of a frame. At "z" a frame of the TableView page of the catalog took 330 ms in the CPU mode and
# 27 ms in the hybrid mode (docs/porting/vello-backend.md, section 12.5).
[profile.browser.package.ferroui-vello]
opt-level = 3

[profile.browser.package.vello_cpu]
opt-level = 3

[profile.browser.package.vello_common]
opt-level = 3

[profile.browser.package.vello_gpu]
opt-level = 3

[profile.browser.package.glifo]
opt-level = 3

[profile.browser.package.kurbo]
opt-level = 3

[profile.browser.package.fearless_simd]
opt-level = 3

[profile.browser.package.skrifa]
opt-level = 3

[profile.browser.package.read-fonts]
opt-level = 3
