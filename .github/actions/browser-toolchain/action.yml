name: Browser toolchain
description: >
  Installs the pinned toolchain of the browser target with scripts/browser/setup.sh (Rust with
  wasm32-unknown-emscripten, the Emscripten SDK and the wasm-bindgen command-line tool), puts it on
  the environment of the job and sets up node with the npm cache of the script module, with caches
  for all of them. The pins live in scripts/browser/setup.sh; see docs/porting/browser-platform.md,
  section 3.

inputs:
  cache-key:
    description: Key of the Rust build cache, so that jobs that build different things keep separate caches.
    required: true

runs:
  using: composite
  steps:
    - name: Pinned versions
      id: pins
      shell: bash
      run: |
        echo "emsdk=$(sed -n 's/^EMSDK_VERSION="\(.*\)"$/\1/p' scripts/browser/setup.sh)" >> "$GITHUB_OUTPUT"
        echo "rust=$(sed -n 's/^RUST_VERSION="\(.*\)"$/\1/p' scripts/browser/setup.sh)" >> "$GITHUB_OUTPUT"
        echo "wasm-bindgen=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
    - name: Cache the Emscripten SDK
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/browser-tools/emsdk
        key: emsdk-${{ runner.os }}-${{ steps.pins.outputs.emsdk }}
    - name: Cache the wasm-bindgen command-line tool
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/browser-tools/bin
        key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.pins.outputs.wasm-bindgen }}-rust-${{ steps.pins.outputs.rust }}
    - name: Install the toolchain (scripts/browser/setup.sh)
      shell: bash
      run: |
        scripts/browser/setup.sh ~/browser-tools
        # The environment of env.sh, for the following steps of the job.
        source ~/browser-tools/env.sh
        echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
        echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
        echo "EMCC_CFLAGS=$EMCC_CFLAGS" >> "$GITHUB_ENV"
        echo "$EMSDK" >> "$GITHUB_PATH"
        echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
        echo "$HOME/browser-tools/bin" >> "$GITHUB_PATH"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: ${{ inputs.cache-key }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: src/Browser/FerroUI.Browser/webapp/package-lock.json
