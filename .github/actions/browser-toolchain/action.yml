name: Browser toolchain
description: >
  Installs the pinned toolchain of the browser target (Rust with wasm32-unknown-emscripten, the
  Emscripten SDK, node with the npm cache of the script module, and optionally the wasm-bindgen
  command-line tool) with their caches. See docs/porting/browser-platform.md, section 3.

inputs:
  cache-key:
    description: Key of the Rust build cache, so that jobs that build different things keep separate caches.
    required: true
  wasm-bindgen:
    description: Whether to install the wasm-bindgen command-line tool of the version the workspace uses (needed to link).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Pinned versions
      shell: bash
      run: |
        # Pinned together: see docs/porting/browser-platform.md, section 3.
        echo "EMSDK_VERSION=6.0.10" >> "$GITHUB_ENV"
        echo "RUST_VERSION=1.90.0" >> "$GITHUB_ENV"
        # Skia's prebuilt binaries leave symbols to the linker of the application.
        echo "EMCC_CFLAGS=-s ERROR_ON_UNDEFINED_SYMBOLS=0" >> "$GITHUB_ENV"
        echo "WASM_BINDGEN_VERSION=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: wasm32-unknown-emscripten
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
    - name: Cache the Emscripten SDK
      id: emsdk-cache
      uses: actions/cache@v4
      with:
        path: ~/emsdk
        key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
    - name: Install the Emscripten SDK
      if: steps.emsdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
        ~/emsdk/emsdk install "$EMSDK_VERSION"
        ~/emsdk/emsdk activate "$EMSDK_VERSION"
    - name: Activate the Emscripten SDK
      shell: bash
      run: |
        source ~/emsdk/emsdk_env.sh
        echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
        echo "$EMSDK" >> "$GITHUB_PATH"
        echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
        emcc --version
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: src/Browser/FerroUI.Browser/webapp/package-lock.json
    - name: Cache the wasm-bindgen command-line tool
      if: inputs.wasm-bindgen == 'true'
      id: wasm-bindgen-cache
      uses: actions/cache@v4
      with:
        path: ~/.wasm-bindgen-cli
        key: wasm-bindgen-cli-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}-rust-${{ env.RUST_VERSION }}
    - name: Install the wasm-bindgen command-line tool
      if: inputs.wasm-bindgen == 'true' && steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --root ~/.wasm-bindgen-cli
    - name: Put the wasm-bindgen command-line tool on PATH
      if: inputs.wasm-bindgen == 'true'
      shell: bash
      run: |
        echo "$HOME/.wasm-bindgen-cli/bin" >> "$GITHUB_PATH"
        "$HOME/.wasm-bindgen-cli/bin/wasm-bindgen" --version
