name: QML conformance

on:
  pull_request:
    paths:
      - 'src/Markup/FerroUI.Qml*/**'
      - 'src/FerroUI.Designer.Language/**'
      - 'src/FerroUI/Cargo.toml'
      - 'src/FerroUI/lib.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'samples/QmlGallery/**'
      - 'tests/QmlCompiled/**'
      - 'tests/QmlBrowser/**'
      - 'scripts/qml/**'
      - '.github/workflows/qml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qml-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  qml:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: qml-conformance
      - name: Check formatting
        run: >-
          cargo fmt --check
          -p ferroui-qml-compiler -p ferroui-qml-build -p ferroui-qml
          -p ferroui-qml-controls -p qml-compiled-tests -p qml-gallery -p ferroui-qml-webscene
      - name: Test the compiler, runtime, compiled components and native controls
        run: >-
          cargo test --locked --no-default-features --features ferroui-qml/http
          -p ferroui-qml-compiler -p ferroui-qml-build -p ferroui-qml
          -p ferroui-qml-controls -p qml-compiled-tests -p qml-gallery -p ferroui-qml-webscene
      - name: Install shared libraries used by the headless Qt Quick oracle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libx11-6 libxkbcommon0 libfontconfig1
      - name: Compare source and compiled behavior with the Qt 6.12.0 binary distribution
        run: |
          python3 -m venv "$RUNNER_TEMP/qt-reference"
          "$RUNNER_TEMP/qt-reference/bin/pip" install --only-binary=:all: PySide6-Essentials==6.12.0
          "$RUNNER_TEMP/qt-reference/bin/python" tests/QmlCompiled/reference/qt_reference.py
          "$RUNNER_TEMP/qt-reference/bin/python" tests/QmlCompiled/tooling/qt_metadata.py
          "$RUNNER_TEMP/qt-reference/bin/python" tests/QmlCompiled/webscene/qt_reference.py
          "$RUNNER_TEMP/qt-reference/bin/python" tests/QmlCompiled/workers/qt_reference.py
          "$RUNNER_TEMP/qt-reference/bin/python" tests/QmlCompiled/network/qt_reference.py
          "$RUNNER_TEMP/qt-reference/bin/python" tests/QmlCompiled/creation/qt_reference.py
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/qt-reference/bin/python" tests/QmlCompiled/states/qt_reference.py
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/qt-reference/bin/python" tests/QmlCompiled/loader/qt_reference.py

  browser:
    name: Browser JavaScript (Chromium / Wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: qml-browser
      - name: Build and run a compiled QML application in a dedicated worker
        run: |
          cargo build --locked -p qml-browser-tests --target wasm32-unknown-unknown
          version="$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' Cargo.toml)"
          archive="wasm-bindgen-$version-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.tar.gz" \
            -o "$RUNNER_TEMP/bindgen.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/bindgen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bindgen.tar.gz" -C "$RUNNER_TEMP" "$archive/wasm-bindgen"
          mkdir -p "$RUNNER_TEMP/qml-site/pkg"
          cp tests/QmlBrowser/{index.html,owner.js,Fetched.qml,fetched.mjs} "$RUNNER_TEMP/qml-site/"
          "$RUNNER_TEMP/$archive/wasm-bindgen" --target web --no-typescript --out-dir "$RUNNER_TEMP/qml-site/pkg" \
            target/wasm32-unknown-unknown/debug/qml_browser_tests.wasm
          python3 tests/QmlBrowser/run.py --chrome google-chrome --site "$RUNNER_TEMP/qml-site"

  portability:
    name: Rust 1.89 and Emscripten
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: '1.89.0'
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: qml-rust-1.89
      - name: Check the native WebScene adapter and JavaScript compiler at the workspace MSRV
        run: >-
          cargo check --locked -p ferroui-qml-webscene -p ferroui-qml-build
          --features ferroui-qml-build/javascript
      - name: Cross-check the compiler, runtime and generated components
        run: >-
          cargo check --locked --target wasm32-unknown-emscripten
          -p ferroui-qml-build -p ferroui-qml -p qml-compiled-tests
          --features ferroui-qml-build/javascript

  webscene:
    name: WebScene V8 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: webscene-v8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned WebScene native runtime
        run: python scripts/qml/webscene-runtime.py "${{ runner.temp }}/ferroui-v8" --github-env
      - name: Build the V8 worker
        run: cargo build --locked -p ferroui-qml-webscene --bin ferroui-qml-webscene-worker
      - name: Locate the worker
        shell: python
        run: |
          import os
          from pathlib import Path
          worker = Path("target/debug/ferroui-qml-webscene-worker")
          if os.name == "nt":
              worker = worker.with_suffix(".exe")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              print(f"FERROUI_WEBSCENE_WORKER={worker.resolve(strict=True)}", file=f)
      - name: Test JavaScript parsing, module bundling and real V8 execution
        run: >-
          cargo test --locked -p ferroui-qml-compiler -p ferroui-qml-build
          -p ferroui-qml-webscene -p qml-compiled-tests
          --features ferroui-qml-compiler/javascript,ferroui-qml-build/javascript,qml-compiled-tests/webscene,qml-compiled-tests/diagnostics
      - name: Test worker deadlines, reentry and isolation against V8
        run: cargo test --locked -p ferroui-qml-webscene --test backend -- --ignored
      - name: Mount and update native controls from V8
        if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features -p qml-gallery --features webscene
      - name: Test QML editor protocol over stdio
        if: runner.os == 'Linux'
        run: cargo test --locked -p ferroui-designer-language --features qml --test qml_lsp
