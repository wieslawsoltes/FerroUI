name: LiveCharts port

on:
  pull_request:
    paths:
      - 'src/FerroUI.LiveCharts/**'
      - 'src/FerroUI.Controls.LiveCharts/**'
      - 'samples/LiveChartsDemo/**'
      - 'scripts/livecharts2/**'
      - 'docs/porting/data/livecharts2/**'
      - '.github/workflows/livecharts.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livecharts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1

jobs:
  native:
    name: Core and native host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: livecharts-${{ matrix.os }}
      - name: Source and API inventory consistency
        run: python scripts/livecharts2/inventory.py --check
      - name: Generated native declarations
        run: python scripts/livecharts2/generate_controls.py --check
      - name: Algorithms, bindings, compiled and runtime XAML, input and lifecycle
        run: cargo test --locked -p ferroui-livecharts -p ferroui-controls-livecharts -p livecharts-demo --lib --tests --no-fail-fast

  browser:
    name: Browser target compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: livecharts-browser
      # Both libraries use framework drawing contracts and have no graphics-backend
      # or C/C++ dependency. This checks the target without linking a browser host.
      - name: Compile the engines and native controls for the browser target
        run: cargo check --locked --target wasm32-unknown-emscripten -p ferroui-livecharts -p ferroui-controls-livecharts -p livecharts-demo

  render:
    name: Compiled gallery native CPU render
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: livecharts-native-render
      - name: Native font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev fonts-dejavu-core pkg-config
      - name: Render the compiled native gallery
        run: cargo run --locked -p livecharts-demo --features render --bin livecharts-render -- target/livecharts-demo.png
      - name: Render after a live-data update
        run: cargo run --locked -p livecharts-demo --features render --bin livecharts-render -- target/livecharts-demo-updated.png --mutated
      - name: Preserve native rendering evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livecharts-native-cpu-gallery
          path: |
            target/livecharts-demo.png
            target/livecharts-demo-updated.png
          if-no-files-found: error
          retention-days: 14
