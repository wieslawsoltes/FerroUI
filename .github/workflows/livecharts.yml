name: LiveCharts port

on:
  pull_request:
    paths:
      - 'src/FerroUI.LiveCharts/**'
      - 'src/FerroUI.Controls.LiveCharts/**'
      - 'samples/LiveChartsDemo/**'
      - 'scripts/livecharts2/**'
      - 'docs/porting/data/livecharts2/**'
      - '.github/workflows/livecharts.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livecharts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1

jobs:
  native:
    name: Core and native host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: livecharts-${{ matrix.os }}
      - name: Source and API inventory consistency
        run: python scripts/livecharts2/inventory.py --check
      - name: Generated native declarations
        run: python scripts/livecharts2/generate_controls.py --check
      - name: Algorithms, bindings, XAML, input and lifecycle
        run: cargo test --locked -p ferroui-livecharts -p ferroui-controls-livecharts --lib --tests --no-fail-fast

  browser:
    name: Browser target compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: livecharts-browser
      # Both libraries use framework drawing contracts and have no graphics-backend
      # or C/C++ dependency. This checks the target without linking a browser host.
      - name: Compile the engines and native controls for the browser target
        run: cargo check --locked --target wasm32-unknown-emscripten -p ferroui-livecharts -p ferroui-controls-livecharts
