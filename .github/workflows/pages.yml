name: Pages

# Publishes the ControlCatalog sample, running in the browser, to GitHub Pages.
#
# One-time setting: Settings, Pages, Build and deployment, Source "GitHub Actions". Until it is set the
# workflow reports that Pages is not enabled and ends without building or deploying, so it does not fail.
#
# The site is published only while its WebAssembly module stays within the size budget below
# (PUBLISHED_MODULE_GZIP_BUDGET_MB, with gzip): above it the size budget step of the deploy job fails and
# nothing is deployed. The raw and gzip sizes are in the summaries of both jobs.
#
# The site is the output of `scripts/build-browser.sh control-catalog-browser`, uploaded as it is: GitHub
# Pages compresses responses itself (gzip, negotiated with Accept-Encoding) and does not serve
# precompressed files, so none are written.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the jobs state what they need on top.
permissions:
  contents: read

# One deployment at a time; a newer run waits for the running one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The size budget of the published WebAssembly module, in megabytes (1,000,000 bytes) with gzip.
  PUBLISHED_MODULE_GZIP_BUDGET_MB: 12
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The Pages API (is Pages enabled?) and configure-pages read the Pages settings.
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
      wasm-raw-bytes: ${{ steps.sizes.outputs.wasm_raw_bytes }}
      wasm-gzip-bytes: ${{ steps.sizes.outputs.wasm_gzip_bytes }}
    steps:
      - name: Is GitHub Pages enabled with GitHub Actions as its source?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            message="GitHub Pages is not enabled with GitHub Actions as its source (found: ${build_type:-not enabled}). Set Settings, Pages, Build and deployment, Source to \"GitHub Actions\" once; the next push to main or a manual run of this workflow then publishes the site."
            echo "::notice title=Pages not enabled::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.pages.outputs.enabled == 'true'
      - uses: ./.github/actions/browser-toolchain
        if: steps.pages.outputs.enabled == 'true'
        with:
          # Shared with the browser job of the CI workflow, which builds the same site.
          cache-key: browser
      - name: Build the site
        if: steps.pages.outputs.enabled == 'true'
        run: scripts/build-browser.sh control-catalog-browser
      - name: Test the site before publishing it
        if: steps.pages.outputs.enabled == 'true'
        run: node scripts/browser/tests/control_catalog.test.mjs target/browser/control-catalog-browser
      - name: Sizes of the published modules
        id: sizes
        if: steps.pages.outputs.enabled == 'true'
        run: >
          node scripts/browser/module-sizes.mjs target/browser/control-catalog-browser
          --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: target/browser/control-catalog-browser

  deploy:
    name: Deploy
    needs: build
    # Only main is published: a manual run from another branch builds and tests the site but does not deploy it.
    if: github.ref == 'refs/heads/main' && needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only the deployment writes to Pages, with the OIDC token deploy-pages needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Size budget of the WebAssembly module
        env:
          RAW_BYTES: ${{ needs.build.outputs.wasm-raw-bytes }}
          GZIP_BYTES: ${{ needs.build.outputs.wasm-gzip-bytes }}
        run: |
          budget_bytes=$((PUBLISHED_MODULE_GZIP_BUDGET_MB * 1000000))
          mb() { awk -v bytes="$1" 'BEGIN { printf "%.2f MB", bytes / 1000000 }'; }
          {
            echo "| WebAssembly module | Raw | gzip -9 | gzip budget |"
            echo "|---|---:|---:|---:|"
            echo "| control-catalog-browser | $(mb "$RAW_BYTES") | $(mb "$GZIP_BYTES") | $(mb "$budget_bytes") |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$GZIP_BYTES" ] || [ "$GZIP_BYTES" -gt "$budget_bytes" ]; then
            message="The WebAssembly module is $(mb "${GZIP_BYTES:-0}") with gzip, over the budget of $(mb "$budget_bytes") (PUBLISHED_MODULE_GZIP_BUDGET_MB); the site is not deployed."
            echo "::error title=Over the size budget::$message"
            echo "**$message**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Within the gzip budget of $(mb "$budget_bytes")." >> "$GITHUB_STEP_SUMMARY"
      - id: deployment
        uses: actions/deploy-pages@v4
