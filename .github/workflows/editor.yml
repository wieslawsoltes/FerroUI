name: Editor port conformance

on:
  pull_request:
    paths:
      - 'src/FerroUI.Edit*/**'
      - 'src/FerroUI.TextMate/**'
      - 'src/FerroUI.Base/**'
      - 'samples/EditorDemo/**'
      - 'scripts/edit-port/**'
      - 'docs/porting/data/editor-*.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/editor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Source inventory and unchanged assets
        run: |
          python3 scripts/edit-port/editor_port.py --check
          python3 scripts/edit-port/test_editor_port.py
          python3 scripts/edit-port/check_assets.py
      - name: Document, native grammar, control and XAML demo tests
        run: >-
          cargo test --locked --lib --no-default-features
          -p ferroui-edit-core -p ferroui-textmate -p ferroui-edit -p editor-demo
          --features ferroui-textmate/native-onig,ferroui-textmate/bundled-grammars
      - name: Explicit portable regex fallback
        run: cargo test --locked -p ferroui-textmate --lib --features portable-regex

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: editor-wasm
      - name: Check editor control portability
        run: cargo check --locked -p ferroui-edit-core -p ferroui-edit --target wasm32-unknown-unknown
      - name: Build the real Rust/Wasm conformance harness
        run: cargo build --locked -p ferroui-textmate --example textmate_browser_conformance --target wasm32-unknown-unknown
      - name: Install matching bindings generator
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Compare every token through the browser Oniguruma engine
        run: |
          wasm-bindgen --target experimental-nodejs-module --out-dir /tmp/editor-wasm \
            target/wasm32-unknown-unknown/debug/examples/textmate_browser_conformance.wasm
          node src/FerroUI.TextMate/tests/oracle/check-wasm.mjs \
            /tmp/editor-wasm/textmate_browser_conformance.js
