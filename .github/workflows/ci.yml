name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  conventions:
    name: Source conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upstream project name stays out of the sources
        run: |
          if grep -rIli -E "avalonia|axaml|avares|\bavn" \
              src external tests samples native Cargo.toml --exclude=NOTICE.md; then
            echo "::error::the files above name the upstream project; only docs/, scripts/ and NOTICE.md may"
            exit 1
          fi

  macos:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

  browser:
    name: Check (browser, wasm32-unknown-emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Pinned together: see docs/porting/browser-platform.md, section 3.
      EMSDK_VERSION: "6.0.10"
      RUST_VERSION: "1.90.0"
      # Skia's prebuilt binaries leave symbols to the linker of the application.
      EMCC_CFLAGS: "-s ERROR_ON_UNDEFINED_SYMBOLS=0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-emscripten
      - uses: Swatinem/rust-cache@v2
        with:
          key: browser
      - name: Cache the Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
      - name: Install the Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"
      - name: Activate the Emscripten SDK
        run: |
          source ~/emsdk/emsdk_env.sh
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          emcc --version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Browser/FerroUI.Browser/webapp/package-lock.json
      - name: Script module (type check, lint, bundle, pixel test)
        working-directory: src/Browser/FerroUI.Browser/webapp
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
          npm run test:pixels
      - name: Skia features of the target
        run: |
          # An unsupported feature combination makes the Skia bindings build Skia from source.
          features="$(cargo tree --locked -p ferroui-skia -e features,normal --target wasm32-unknown-emscripten | grep -oE 'skia-bindings feature "(gl|ganesh|graphite|metal|vulkan|d3d)"' | sort -u | tr '\n' ' ')"
          echo "$features"
          test "$features" = 'skia-bindings feature "ganesh" skia-bindings feature "gl" '
      - name: Check
        run: >
          cargo check --locked --target wasm32-unknown-emscripten
          -p ferroui-base -p ferroui-controls -p ferroui-markup -p ferroui-markup-xaml -p ferroui-markup-xaml-loader
          -p ferroui-opengl -p ferroui-skia -p ferroui-harfbuzz -p ferroui-fonts-inter
          -p ferroui-themes-simple -p ferroui-themes-fluent -p mini-mvvm -p control-catalog
          -p ferroui-browser
      - name: Check the examples of the browser crate
        run: cargo check --locked --target wasm32-unknown-emscripten -p ferroui-browser --examples
      - name: Cache the wasm-bindgen command-line tool
        id: wasm-bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}
      - name: Install the wasm-bindgen command-line tool
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: |
          version="$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' Cargo.toml)"
          cargo install wasm-bindgen-cli --version "$version" --locked --root ~/wasm-bindgen
      - name: Build the themed view site
        run: |
          echo "$HOME/wasm-bindgen/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/wasm-bindgen/bin:$PATH"
          scripts/build-browser.sh themed_view
      - name: Behaviour tests in headless Chrome
        run: node scripts/browser/tests/themed_view.test.mjs
      - name: Build the storage view site
        run: scripts/build-browser.sh storage_view
      - name: Storage behaviour tests in headless Chrome
        run: node scripts/browser/tests/storage_view.test.mjs
