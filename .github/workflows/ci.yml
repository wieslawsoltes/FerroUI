name: CI

on:
  push:
    branches: [main]
    # A change of the documentation alone builds and tests nothing.
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  conventions:
    name: Source conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Upstream project name stays out of the sources
        run: |
          if grep -rIli -E "avalonia|axaml|avares|\bavn" \
              src external tests samples native Cargo.toml --exclude=NOTICE.md; then
            echo "::error::the files above name the upstream project; only docs/, scripts/ and NOTICE.md may"
            exit 1
          fi
      # The composition property blocks are written by a script: a change made to them by hand
      # is lost at the next regeneration, so it has to be made in the script.
      - name: Generated composition code is up to date
        run: python3 scripts/generate_composition.py --check

  # The crates that are published stay publishable (docs/release.md): the manifests state what
  # crates.io needs, the crates of the workspace are pinned to one another at the version of the
  # workspace, every package is assembled and is below the size limit, and the crate table of the
  # README is current. Nothing is compiled and nothing is published: about two minutes, most of it
  # the toolchain and the index.
  packaging:
    name: Packages of the published crates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Package without building
        run: scripts/release/publish.sh --dry-run --no-verify

  # Reduced for the time being (2026-10-08), to shorten the wait for a pull request while many are
  # in flight; the job took 22 minutes, 20 of them compiling. What is left out, and how to get it
  # back:
  # - It does not run for a push to main: the pull request that was merged ran it already, and the
  #   runs of main competed with the pull requests for the macOS runners. Dispatch the workflow by
  #   hand on main (workflow_dispatch) for a run of the merged state.
  # - No separate `cargo check --workspace --all-targets`: it compiled everything a second time with
  #   another profile. The examples and binaries (hello_window, themed_window, the native examples,
  #   control-catalog-desktop) are therefore not compiled here; `cargo check --workspace
  #   --all-targets --locked` on a Mac covers them.
  # - The tests are the unit and integration tests (`--lib --tests`): no documentation tests (the
  #   workspace has none that run) and no example or binary is linked.
  # - No debug information in the test build, which shortens compiling and linking; a failing test
  #   still reports its message and location, a backtrace has no line numbers.
  macos:
    name: Build and test (macOS)
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast --lib --tests

  browser:
    name: Check (browser, wasm32-unknown-emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/browser-toolchain
        with:
          # Shared with the Pages workflow, which builds the same site.
          cache-key: browser
      - name: Script module (type check, lint, bundle, pixel test)
        working-directory: src/Browser/FerroUI.Browser/webapp
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
          npm run test:pixels
      - name: Skia features of the target
        run: |
          # An unsupported feature combination makes the Skia bindings build Skia from source.
          features="$(cargo tree --locked -p ferroui-skia -e features,normal --target wasm32-unknown-emscripten | grep -oE 'skia-bindings feature "(gl|ganesh|graphite|metal|vulkan|d3d)"' | sort -u | tr '\n' ' ')"
          echo "$features"
          test "$features" = 'skia-bindings feature "ganesh" skia-bindings feature "gl" '
      - name: Check
        run: >
          cargo check --locked --target wasm32-unknown-emscripten
          -p ferroui-base -p ferroui-controls -p ferroui-markup -p ferroui-markup-xaml -p ferroui-markup-xaml-loader
          -p ferroui-opengl -p ferroui-skia -p ferroui-harfbuzz -p ferroui-fonts-inter
          -p ferroui-themes-simple -p ferroui-themes-fluent -p mini-mvvm -p control-catalog
          -p ferroui-browser -p control-catalog-browser
      - name: Check the examples of the browser crate
        run: cargo check --locked --target wasm32-unknown-emscripten -p ferroui-browser --examples
      # The Vello backend in the browser is behind a feature that no site built here turns on: without
      # this its sink for WebGL is compiled by nothing, and a change of the scene interface breaks it
      # unseen (docs/porting/vello-backend.md, section 12).
      - name: Check the browser crate and the catalog host with the Vello backend
        run: >
          cargo check --locked --target wasm32-unknown-emscripten
          -p ferroui-browser --features vello --examples
          && cargo check --locked --target wasm32-unknown-emscripten
          -p control-catalog-browser --features vello
      - name: Build the themed view site
        run: scripts/build-browser.sh themed_view
      - name: Behaviour tests in headless Chrome
        run: node scripts/browser/tests/themed_view.test.mjs
      - name: Build the storage view site
        run: scripts/build-browser.sh storage_view
      - name: Storage behaviour tests in headless Chrome
        run: node scripts/browser/tests/storage_view.test.mjs
      - name: Build the ControlCatalog site
        run: scripts/build-browser.sh control-catalog-browser
      - name: ControlCatalog tests in headless Chrome (rendering, resize, console, drawer, navigation, click, typing)
        run: node scripts/browser/tests/control_catalog.test.mjs --screenshot target/browser/screenshots/control-catalog.png
      - name: Sizes of the published modules
        run: node scripts/browser/module-sizes.mjs target/browser/control-catalog-browser >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-catalog-browser-screenshot
          path: target/browser/screenshots
          if-no-files-found: ignore
      # For the job that composes the sites with both modules.
      - name: Keep the sites built without threads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-sites
          path: |
            target/browser/themed_view
            target/browser/control-catalog-browser
          if-no-files-found: error
          retention-days: 1

  # The build with threads (docs/porting/browser-render-worker.md, "B2.8"): the UI on the thread of
  # the page, the compositor and Skia on a render thread. A job of its own, beside the one above and
  # not after it: the build with threads compiles everything a second time (another toolchain, a
  # standard library of its own, its own target directory), which as further steps of the job above
  # would about double the wait for a pull request. Run in parallel it costs the installation of the
  # toolchain a second time (from caches) and nothing else twice: the sites with both modules are
  # composed, by the job below, from the sites the two jobs built.
  browser-threads:
    name: Check (browser with threads, wasm32-unknown-emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/browser-toolchain
        with:
          # Shared with the Pages workflow, which builds the same sites.
          cache-key: browser
          threads: true
      # Each build below also type checks, lints and bundles the script module, as every build of
      # a site does.
      - name: Build the thread spawn site
        run: scripts/build-browser.sh thread_spawn --threads
      - name: A spawned thread, and the isolation of the page, in headless Chrome
        run: node scripts/browser/tests/thread_spawn.test.mjs
      - name: Build the render worker site
        run: scripts/build-browser.sh render_worker_clear --threads
      - name: Frames from a worker without the compositor, in headless Chrome
        run: node scripts/browser/tests/render_worker_clear.test.mjs
      - name: Build the themed view site with threads
        run: scripts/build-browser.sh themed_view --threads
      - name: Behaviour tests on the render thread and on one thread, in headless Chrome
        run: node scripts/browser/tests/themed_view.test.mjs target/browser-threads/themed_view
      - name: Build the storage view site with threads
        run: scripts/build-browser.sh storage_view --threads
      - name: Storage behaviour tests with threads, in headless Chrome
        run: node scripts/browser/tests/storage_view.test.mjs target/browser-threads/storage_view
      - name: Build the ControlCatalog site with threads
        run: scripts/build-browser.sh control-catalog-browser --threads
      - name: ControlCatalog tests on the render thread, in headless Chrome
        run: node scripts/browser/tests/control_catalog.test.mjs target/browser-threads/control-catalog-browser --screenshot target/browser-threads/screenshots/control-catalog.png
      - name: Sizes of the modules built with threads
        run: node scripts/browser/module-sizes.mjs target/browser-threads/control-catalog-browser >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-catalog-browser-threads-screenshot
          path: target/browser-threads/screenshots
          if-no-files-found: ignore
      - name: Keep the sites built with threads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-threads-sites
          path: |
            target/browser-threads/themed_view
            target/browser-threads/control-catalog-browser
          if-no-files-found: error
          retention-days: 1

  # The site that is published carries both modules, and its host page chooses one before it requests
  # either (scripts/browser/threads/ferroui-loader.js). Composed here from the sites of the two jobs
  # above, which also checks that the files the two builds share are identical, and tested: nothing
  # is compiled in this job.
  browser-site:
    name: Check (browser, the site with both modules)
    needs: [browser, browser-threads]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # An artifact of several paths keeps them below their common directory.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-sites
          path: target/browser
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-threads-sites
          path: target/browser-threads
      - name: Compose the sites with both modules
        run: |
          for application in themed_view control-catalog-browser; do
            node scripts/browser/combine-site.mjs "target/browser/$application" "target/browser-threads/$application" "target/browser-both/$application"
          done
      - name: The loader of the themed view site in headless Chrome (which module, isolation, fallback, requests)
        run: node scripts/browser/tests/site_loader.test.mjs target/browser-both/themed_view
      - name: The loader of the ControlCatalog site in headless Chrome
        run: node scripts/browser/tests/site_loader.test.mjs target/browser-both/control-catalog-browser
      - name: Sizes of the site with both modules
        run: node scripts/browser/module-sizes.mjs target/browser-both/control-catalog-browser >> "$GITHUB_STEP_SUMMARY"

  # The Linux desktop platform on a real X server (docs/porting/x11-platform.md, section 13). The
  # crate is developed on a Mac, where it is compiled for Linux and its tests run without a server;
  # this job is where it meets one: the crate is built and tested on Linux, and the smoke mode of its
  # example opens a window under Xvfb and asks the server what it sees (the window mapped, its size,
  # title, class, process and protocols, and pixels read back from the window with XGetImage), then
  # has the window closed by a WM_DELETE_WINDOW message; once on a bare Xvfb and once under a
  # window manager. No compositing manager and no input devices: those are not covered here.
  x11:
    name: Build and test (Linux, X11 under Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: x11
      # The X libraries are opened at run time (nothing links them); Skia links FreeType and
      # Fontconfig, and needs a font to answer for the default family.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils openbox \
            libx11-6 libxi6 libxrandr2 libxcursor1 libxfixes3 libxext6 \
            libfontconfig1-dev libfreetype6-dev fonts-dejavu-core pkg-config
      - name: Skia features of the target
        run: |
          # A Linux build renders in software until the GPU modes of the platform are ported: a GPU
          # feature here would ask for a Skia binary that may not be published, and the build would
          # fall back to compiling Skia from source.
          features="$(cargo tree --locked -p ferroui-skia -e features,normal --target x86_64-unknown-linux-gnu | grep -oE 'skia-bindings feature "(gl|ganesh|graphite|metal|vulkan|d3d)"' | sort -u | tr '\n' ' ')"
          echo "GPU features: '$features'"
          test -z "$features"
      - name: Tests of the X11 crate (no server needed)
        run: cargo test --locked -p ferroui-x11 --no-fail-fast
      - name: The desktop entry point selects X11 on Linux
        run: cargo test --locked -p ferroui-desktop --lib
      - name: Build the window example
        run: cargo build --locked -p ferroui-x11 --features example --example x11_window
      - name: A window on a real X server (Xvfb)
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            timeout 300 target/debug/examples/x11_window --smoke
      # A window manager clamps the window to a screen narrower than it: the server and the
      # framework have to agree on the size the window got.
      - name: The same under a window manager (openbox)
        run: |
          xvfb-run -a --server-args="-screen 0 600x500x24" \
            sh -c 'openbox & sleep 2; timeout 300 target/debug/examples/x11_window --smoke'
