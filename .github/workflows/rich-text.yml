name: Rich text conformance

on:
  pull_request:
    paths:
      - '.github/workflows/rich-text.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/FerroUI.Base/**'
      - 'src/FerroUI.Controls/**'
      - 'src/FerroUI.Themes.*/**'
      - 'src/Markup/**'
      - 'src/Windows/FerroUI.WinUI/**'
      - 'src/Windows/FerroUI.Win32/**'
      - 'tests/FerroUI.Markup.Xaml.UnitTests/**'
      - 'docs/porting/winui-rich-text/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rich-text-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  portable:
    name: Document, controls, themes and XAML
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rich-text-portable
      - name: Install font discovery build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev pkg-config
      - name: Native observation extractor contracts
        run: python3 scripts/porting/test_rich_text_tom_observations.py -v
      - name: Base contracts
        run: cargo test --locked -p ferroui-base --lib --no-fail-fast
      - name: Full controls suite
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-controls --lib --no-fail-fast
      - name: CoreText synchronization and Win32 bridge host tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-winui -p ferroui-win32 --lib --no-fail-fast
      - name: Actual theme templates and generated markup references
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-winui -p ferroui-themes-fluent -p ferroui-themes-simple --lib --no-fail-fast
      - name: Runtime and compiled XAML
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-markup-xaml-tests --no-fail-fast
      - name: Regenerate WinUI theme reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-winui --lib tests::compiled_xaml_tests::regenerate_compiled_xaml -- --ignored --exact
      - name: Regenerate Fluent theme reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-fluent --lib tests::compiled_xaml_tests::regenerate_compiled_xaml -- --ignored --exact
      - name: Regenerate Simple theme reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-themes-simple --lib tests::compiled_xaml_tests::regenerate_compiled_xaml -- --ignored --exact
      - name: Regenerate differential XAML reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-markup-xaml-tests --lib emitter::differential_tests::regenerate_emitter_output -- --ignored --exact
      - name: Regenerate markup Rust path reference
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-markup-xaml-tests --lib emitter::rust_paths_tests::regenerate_rust_paths_check -- --ignored --exact
      - name: Verify checked-in generated references
        if: ${{ !cancelled() }}
        run: >-
          git diff --exit-code --
          src/FerroUI.Themes.WinUI/compiled_xaml.rs
          src/FerroUI.Themes.WinUI/compiled_xaml/
          src/FerroUI.Themes.WinUI/compiled_xaml.xamlmeta
          src/FerroUI.Themes.Fluent/compiled_xaml.rs
          src/FerroUI.Themes.Fluent/compiled_xaml.xamlmeta
          src/FerroUI.Themes.Simple/compiled_xaml.rs
          src/FerroUI.Themes.Simple/compiled_xaml.xamlmeta
          tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.rs
          tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.map.json
          tests/FerroUI.Markup.Xaml.UnitTests/emitter/rust_paths_check.rs
      - name: Upload generated references for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rich-text-generated-references
          retention-days: 7
          path: |
            src/FerroUI.Themes.WinUI/compiled_xaml.rs
            src/FerroUI.Themes.WinUI/compiled_xaml/
            src/FerroUI.Themes.WinUI/compiled_xaml.xamlmeta
            src/FerroUI.Themes.Fluent/compiled_xaml.rs
            src/FerroUI.Themes.Fluent/compiled_xaml.xamlmeta
            src/FerroUI.Themes.Simple/compiled_xaml.rs
            src/FerroUI.Themes.Simple/compiled_xaml.xamlmeta
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.rs
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/generated.map.json
            tests/FerroUI.Markup.Xaml.UnitTests/emitter/rust_paths_check.rs

  windows:
    name: Native Windows input and automation contracts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rich-text-windows
      - name: Compile native CoreText adapter
        run: cargo check --locked -p ferroui-winui
      - name: Native WinUI contract tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-winui --lib --no-fail-fast
      - name: Exact native UTF-16 string contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-win32 --no-default-features --lib exact_hstring --no-fail-fast
      - name: Native IMM32 input scope contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-win32 --no-default-features --lib imm32_input_scope -- --test-threads=1
      - name: Characterize system MSFTEDIT selection navigation contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git rev-parse HEAD > system-msftedit-source-commit.txt
          git rev-parse HEAD:src/Windows/FerroUI.Win32/rich_text_tom_oracle_tests.rs > system-msftedit-probe-blob.txt
          set -o pipefail
          cargo test --locked -p ferroui-win32 --no-default-features --lib rich_text_tom_oracle -- --nocapture --test-threads=1 2>&1 | tee system-msftedit.log
      - name: Preserve native observations before the full control suite
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rich-text-system-msftedit
          retention-days: 14
          path: |
            system-msftedit.log
            system-msftedit-source-commit.txt
            system-msftedit-probe-blob.txt
      - name: Rich text control contracts on Windows
        if: ${{ !cancelled() }}
        run: cargo test --locked -p ferroui-controls --lib rich_ --no-fail-fast

  windows-arm64-native:
    name: System MSFTEDIT oracle (Windows ARM64)
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      CARGO_BUILD_TARGET: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rich-text-windows-arm64
      - name: Record and verify the native ARM64 environment
        id: native_environment
        run: |
          mkdir -p system-msftedit-arm64
          git rev-parse HEAD > system-msftedit-arm64/source-commit.txt
          git rev-parse HEAD:src/Windows/FerroUI.Win32/rich_text_tom_oracle_tests.rs > system-msftedit-arm64/probe-blob.txt
          rustc -vV | tee system-msftedit-arm64/rustc.txt
          {
            printf 'runner_label=%s\n' 'windows-11-arm'
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'image_os=%s\n' "${ImageOS:-unknown}"
            printf 'image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'cargo_build_target=%s\n' "$CARGO_BUILD_TARGET"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'job=%s\n' "$GITHUB_JOB"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'run_url=%s/%s/actions/runs/%s/attempts/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } > system-msftedit-arm64/runner.txt
          printf '%s\n' 'cargo test --locked -p ferroui-win32 --no-default-features --lib rich_text_tom_oracle -- --nocapture --test-threads=1' > system-msftedit-arm64/serial-command.txt
          printf '%s\n' 'cargo test --locked -p ferroui-win32 --no-default-features --lib rich_text_tom_oracle -- --nocapture --test-threads=4' > system-msftedit-arm64/concurrent-command.txt
          test "$RUNNER_ARCH" = ARM64
          tr -d '\r' < system-msftedit-arm64/rustc.txt | grep -Fx 'host: aarch64-pc-windows-msvc'
      - name: Characterize system MSFTEDIT with the canonical serial command
        if: ${{ !cancelled() && steps.native_environment.outcome == 'success' }}
        run: |
          set -o pipefail
          status=0
          cargo test --locked -p ferroui-win32 --no-default-features --lib rich_text_tom_oracle -- --nocapture --test-threads=1 2>&1 | tee system-msftedit-arm64/system-msftedit.log || status=$?
          printf '%s\n' "$status" > system-msftedit-arm64/serial-pipeline-exit-code.txt
          exit "$status"
      # A vertical-only filter has one test. The complete oracle filter lets vertical
      # setup overlap sibling native tests in a separate process from the serial run.
      # Its interleaved output is diagnostic, not serial extractor input.
      - name: Diagnose concurrent native oracle setup in a fresh test process
        if: ${{ !cancelled() && steps.native_environment.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          cargo test --locked -p ferroui-win32 --no-default-features --lib rich_text_tom_oracle -- --nocapture --test-threads=4 2>&1 | tee system-msftedit-arm64/concurrent-diagnostic.log || status=$?
          printf '%s\n' "$status" > system-msftedit-arm64/concurrent-pipeline-exit-code.txt
          exit "$status"
      - name: Preserve ARM64 native observations and diagnostic provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rich-text-system-msftedit-arm64
          retention-days: 14
          path: system-msftedit-arm64/
