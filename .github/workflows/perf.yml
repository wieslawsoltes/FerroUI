name: Performance

# Stripped size and warm start-up time of hello_window, themed_window and
# control-catalog-desktop on macOS (scripts/perf-report.py). Run by hand; the
# table goes to the job summary. With a baseline, both refs are built and
# measured in the same job, and the summary compares them.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to measure
        required: true
        default: main
      baseline:
        description: Branch, tag or commit to compare with (empty for none)
        required: false
        default: ""
      runs:
        description: Warm launches per application (at least 7)
        required: false
        default: "9"
      rustflags:
        description: RUSTFLAGS for the build of the ref, not of the baseline (experiments; empty for none)
        required: false
        default: ""
      samples:
        description: Measure the HelloWorld samples, hello_window, the WinUI theme gallery and the catalog on macOS with the release and the dist profile, raw and stripped, with a breakdown by crate (docs/binary-size.md, section 3.6)
        type: boolean
        required: false
        default: false
      windows:
        description: Also build the ControlCatalog and the WinUI theme gallery on Windows (x86-64) with the release and the dist profile, and report the sizes of their executables (docs/binary-size.md)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  report:
    name: Size and start-up (macOS)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      # The report script of the workflow's own commit measures both refs,
      # so that refs from before the script existed can be measured too.
      - name: Check out the report script
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: scripts/perf-report.py
          sparse-checkout-cone-mode: false
      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: measured
      - name: Check out the baseline
        if: inputs.baseline != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate the inputs
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          case "$RUNS" in
            ''|*[!0-9]*) echo "::error::runs must be a number"; exit 1 ;;
          esac
          if [ "$RUNS" -lt 7 ]; then echo "::error::runs must be at least 7"; exit 1; fi
      - name: Describe the job
        env:
          REF: ${{ inputs.ref }}
          BASELINE: ${{ inputs.baseline }}
          EXTRA_RUSTFLAGS: ${{ inputs.rustflags }}
        run: |
          {
            echo "## Size and start-up"
            echo
            echo "Measured: \`$REF\` at \`$(git -C measured rev-parse HEAD)\`"
            if [ -n "$BASELINE" ]; then
              echo "Baseline: \`$BASELINE\` at \`$(git -C baseline rev-parse HEAD)\`"
            fi
            if [ -n "$EXTRA_RUSTFLAGS" ]; then
              echo "RUSTFLAGS of the measured build: \`$EXTRA_RUSTFLAGS\`"
            fi
            echo
            echo "Sizes are of the stripped executables. Start-up is the time from process start to the"
            echo "window-opened line (\`Window opened\`, in the catalog \`App activated\`), median of warm"
            echo "launches; the first launch of each new executable is listed separately."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      # Both refs are built before anything is launched, each into its own
      # target directory, so that no launch runs on a machine that a build
      # keeps busy. RUSTFLAGS is only set
      # when given (set at all, even empty, it replaces the flags of
      # .cargo/config.toml), and only for the ref, so that a baseline of the
      # same ref measures the effect of the flags.
      - name: Build the baseline
        if: inputs.baseline != ''
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-baseline
        run: python3 tools/scripts/perf-report.py --source baseline --size-only
      - name: Build the ref
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-measured
          EXTRA_RUSTFLAGS: ${{ inputs.rustflags }}
        run: |
          if [ -n "$EXTRA_RUSTFLAGS" ]; then export RUSTFLAGS="$EXTRA_RUSTFLAGS"; fi
          python3 tools/scripts/perf-report.py --source measured --size-only
      # One measuring step for both: the launches of the baseline and of the
      # ref alternate, so that both see the same machine.
      - name: Measure
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-measured
          BASELINE_TARGET: ${{ github.workspace }}/target-baseline
          RUNS: ${{ inputs.runs }}
          HAS_BASELINE: ${{ inputs.baseline != '' }}
        run: |
          set -- --source measured --no-build --runs "$RUNS" --save measured.json --markdown "$GITHUB_STEP_SUMMARY" --title "Size and start-up"
          if [ "$HAS_BASELINE" = "true" ]; then
            # Start-up times are noisy on shared runners: a slower median is
            # reported in the comparison, not turned into a failed job.
            set -- "$@" --baseline-target "$BASELINE_TARGET" --save-baseline baseline.json --no-fail
          fi
          python3 tools/scripts/perf-report.py "$@"
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: "*.json"
          if-no-files-found: ignore

  # The sizes of the executables of the ControlCatalog and the WinUI theme gallery on Windows
  # (x86-64), with the release profile and the dist profile, of the ref and of the baseline: one job
  # per tree and profile, each builds the two executables in one cargo invocation (so that the
  # features of their common dependencies are those of every measurement) and writes their sizes
  # and their section tables to the job summary. The symbols of a Windows executable are in its
  # PDB, so the sizes are those of what is shipped (docs/binary-size.md, section 3.3).
  windows-size:
    name: Executable sizes (Windows x86-64, ${{ matrix.tree }}, ${{ matrix.profile }})
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tree: [measured, baseline]
        profile: [release, dist]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tree
        if: matrix.tree == 'measured' || inputs.baseline != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tree == 'measured' && inputs.ref || inputs.baseline }}
          path: tree
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.tree == 'measured' || inputs.baseline != ''
      - name: Build
        if: matrix.tree == 'measured' || inputs.baseline != ''
        working-directory: tree
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PROFILE: ${{ matrix.profile }}
        run: |
          start=$(date +%s)
          cargo build --locked --profile "$PROFILE" -p control-catalog-desktop -p winui-theme-gallery --bin control-catalog-desktop --bin winui-theme-gallery
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Sizes
        if: matrix.tree == 'measured' || inputs.baseline != ''
        env:
          TREE: ${{ matrix.tree }}
          REF: ${{ matrix.tree == 'measured' && inputs.ref || inputs.baseline }}
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ github.workspace }}/target
        run: |
          {
            echo "## Windows x86-64: \`$REF\` ($TREE) at \`$(git -C tree rev-parse HEAD)\`, profile \`$PROFILE\`"
            echo
            echo "Built in $BUILD_SECONDS s."
            echo
            echo '```'
            python - "$TARGET/$PROFILE/control-catalog-desktop.exe" "$TARGET/$PROFILE/winui-theme-gallery.exe" <<'PY'
          import struct, sys
          for path in sys.argv[1:]:
              data = open(path, 'rb').read()
              pe = struct.unpack_from('<I', data, 0x3C)[0]
              sections = struct.unpack_from('<H', data, pe + 6)[0]
              table = pe + 24 + struct.unpack_from('<H', data, pe + 20)[0]
              print(f"{path.replace(chr(92), '/').rsplit('/', 1)[-1]}: {len(data)} bytes ({len(data) / 1e6:.2f} MB)")
              for i in range(sections):
                  name, virtual, _, raw = struct.unpack_from('<8sIII', data, table + 40 * i)
                  print(f"  {name.rstrip(bytes(1)).decode():8s} {raw / 1e6:8.2f} MB on disk, {virtual / 1e6:8.2f} MB in memory")
          PY
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The HelloWorld samples (docs/binary-size.md, section 3.6) and the theme-less hello_window
      # of ferroui-desktop, each built by itself as an application is, with the same profile.
      - name: Sizes of the HelloWorld samples
        if: matrix.tree == 'measured'
        working-directory: tree
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PROFILE: ${{ matrix.profile }}
        run: |
          {
            echo "## Windows x86-64: the HelloWorld samples, profile \`$PROFILE\`"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for sample in hello-world hello-world-component-host hello-world-builders hello-world-macros hello-world-hooks hello_window; do
            if [ "$sample" = hello_window ]; then
              cargo build --locked --profile "$PROFILE" -p ferroui-desktop --example hello_window
              file="$CARGO_TARGET_DIR/$PROFILE/examples/hello_window.exe"
            else
              cargo build --locked --profile "$PROFILE" -p "$sample" --bin "$sample"
              file="$CARGO_TARGET_DIR/$PROFILE/$sample.exe"
            fi
            echo "$sample: $(stat -c %s "$file") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
      # What the executable of the catalog is made of, by library: the measured tree with the
      # release profile is linked once more with a map of the linker (`/MAP`), and the code and
      # data of each symbol (the distance to the next one) are summed by the library or the object
      # that defines it. With LTO the Rust code of every crate is in the objects of the final crate.
      - name: Attribution by library (the catalog, measured tree, release profile)
        if: matrix.tree == 'measured' && matrix.profile == 'release'
        working-directory: tree
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          MAP: ${{ github.workspace }}/control-catalog-desktop.map
        run: |
          cargo rustc --locked --release -p control-catalog-desktop --bin control-catalog-desktop -- -C "link-arg=/MAP:$MAP"
          {
            echo "## Windows x86-64: the release executable of the catalog by library (MB)"
            echo
            echo '```'
            python - "$MAP" <<'PY'
          import collections, re, sys
          rows = []
          publics = False
          for line in open(sys.argv[1], errors='replace'):
              if 'Publics by Value' in line:
                  publics = True
                  continue
              if not publics:
                  continue
              m = re.match(r'\s*([0-9a-fA-F]{4}):([0-9a-fA-F]{8})\s+(\S+)\s+([0-9a-fA-F]{16})\s+(?:f\s+)?(?:i\s+)?(\S+)\s*$', line)
              if m:
                  rows.append((int(m.group(4), 16), m.group(1), m.group(5)))
          rows.sort()
          sizes = collections.Counter()
          for (address, section, origin), following in zip(rows, rows[1:] + [None]):
              if following is None or following[1] != section:
                  continue
              size = following[0] - address
              if 0 < size < 64_000_000:
                  library = origin.split(':')[0] if ':' in origin else origin
                  library = re.sub(r'-[0-9a-f]{16}', '', library.replace('\\', '/').rsplit('/', 1)[-1])
                  # The objects of a crate after thin LTO: `<binary>.<crate>.<crate>.<hash>-cgu.<n>.rcgu.o`.
                  crate = re.match(r'[a-z0-9_]+\.([a-z0-9_]+)\.\1\.[0-9a-f]+-cgu\.[0-9]+\.rcgu', library)
                  library = f'{crate.group(1)} (Rust)' if crate else re.sub(r'\.[0-9a-z_]+-cgu\.[0-9]+\.rcgu.*$|\.lib$', '', library)
                  sizes[library] += size
          total = sum(sizes.values())
          print(f'{total / 1e6:8.2f} attributed')
          for library, size in sizes.most_common(30):
              print(f'{size / 1e6:8.2f}  {100 * size / total:5.1f} %  {library}')
          PY
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The HelloWorld samples (docs/binary-size.md, section 3.6), hello_window, the WinUI theme gallery
  # and the catalog on macOS, each built by itself as an application is, with the release and the
  # dist profile: the size of the executable as cargo writes it and stripped, and for the release
  # profile the breakdown by crate of the symbol table (`scripts/symsize.py`).
  macos-samples:
    name: Executable sizes (macOS, ${{ matrix.profile }})
    if: inputs.samples
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: [release, dist]
    steps:
      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and measure
        env:
          PROFILE: ${{ matrix.profile }}
          REF: ${{ inputs.ref }}
        run: |
          {
            echo "## macOS: \`$REF\` at \`$(git rev-parse HEAD)\`, profile \`$PROFILE\` (MB: as written, stripped)"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p measured
          for app in hello_window hello-world hello-world-component-host hello-world-builders hello-world-macros hello-world-hooks winui-theme-gallery control-catalog-desktop; do
            case "$app" in
              hello_window) cargo build --locked --profile "$PROFILE" -p ferroui-desktop --example hello_window; file="target/$PROFILE/examples/hello_window" ;;
              *) cargo build --locked --profile "$PROFILE" -p "$app" --bin "$app"; file="target/$PROFILE/$app" ;;
            esac
            cp "$file" "measured/$app"
            strip -o "measured/$app.stripped" "measured/$app"
            raw=$(stat -f %z "measured/$app"); stripped=$(stat -f %z "measured/$app.stripped")
            printf '%-28s %8.2f %8.2f\n' "$app" "$(echo "$raw / 1000000" | bc -l)" "$(echo "$stripped / 1000000" | bc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Breakdown by crate
        if: matrix.profile == 'release'
        run: |
          for app in hello_window hello-world hello-world-builders control-catalog-desktop; do
            {
              echo "### $app, release, by crate"
              echo
              echo '```'
              python3 scripts/symsize.py "measured/$app" -n 0 --crates 20 | sed -n '/by crate/,/top/p' | grep -v '^# top'
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done

