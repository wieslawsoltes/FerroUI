name: Performance

# Stripped size and warm start-up time of hello_window, themed_window and
# control-catalog-desktop on macOS (scripts/perf-report.py). Run by hand; the
# table goes to the job summary. With a baseline, both refs are built and
# measured in the same job, and the summary compares them.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to measure
        required: true
        default: main
      baseline:
        description: Branch, tag or commit to compare with (empty for none)
        required: false
        default: ""
      runs:
        description: Warm launches per application (at least 7)
        required: false
        default: "9"
      rustflags:
        description: RUSTFLAGS for the build of the ref, not of the baseline (experiments; empty for none)
        required: false
        default: ""
      samples:
        description: Measure the HelloWorld samples, hello_window, the WinUI theme gallery and the catalog on macOS with the release and the dist profile, raw and stripped, with a breakdown by crate (docs/binary-size.md, section 3.6)
        type: boolean
        required: false
        default: false
      capi:
        description: Measure the C samples of the C ABI (hello_world.c, gauge.c) on macOS, full and by use, static with dead stripping and dynamic, with the release and the dist profile, by crate, against the baseline (docs/binary-size.md, section 3.7)
        type: boolean
        required: false
        default: false
      windows:
        description: Also build the ControlCatalog and the WinUI theme gallery on Windows (x86-64) with the release and the dist profile, and report the sizes of their executables (docs/binary-size.md)
        type: boolean
        required: false
        default: false
      folding:
        description: Identical code folding at link time (#1001) - Linux (x86-64, dist) with and without lld's --icf=safe and --icf=all, and, with samples and windows, macOS dist without ld64's deduplication and Windows without /OPT:ICF, plus the link line rustc passes and whether the linker folds a HarfBuzz callback with its default
        type: boolean
        required: false
        default: false
      symbols:
        description: With samples, the generic families of the builders hello world and the catalog from their symbols, in release and dist (dist linked again with its symbols), and on macOS the link line and what the linker deduplicates (#1001)
        type: boolean
        required: false
        default: false
      platforms:
        description: Identical code folding elsewhere (#1001) - Android arm64 dist with --icf=safe and --icf=all, the link lines of iOS and macOS, and the wasm-opt passes of the browser catalog
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  report:
    name: Size and start-up (macOS)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      # The report script of the workflow's own commit measures both refs,
      # so that refs from before the script existed can be measured too.
      - name: Check out the report script
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: scripts/perf-report.py
          sparse-checkout-cone-mode: false
      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: measured
      - name: Check out the baseline
        if: inputs.baseline != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline }}
          path: baseline
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate the inputs
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          case "$RUNS" in
            ''|*[!0-9]*) echo "::error::runs must be a number"; exit 1 ;;
          esac
          if [ "$RUNS" -lt 7 ]; then echo "::error::runs must be at least 7"; exit 1; fi
      - name: Describe the job
        env:
          REF: ${{ inputs.ref }}
          BASELINE: ${{ inputs.baseline }}
          EXTRA_RUSTFLAGS: ${{ inputs.rustflags }}
        run: |
          {
            echo "## Size and start-up"
            echo
            echo "Measured: \`$REF\` at \`$(git -C measured rev-parse HEAD)\`"
            if [ -n "$BASELINE" ]; then
              echo "Baseline: \`$BASELINE\` at \`$(git -C baseline rev-parse HEAD)\`"
            fi
            if [ -n "$EXTRA_RUSTFLAGS" ]; then
              echo "RUSTFLAGS of the measured build: \`$EXTRA_RUSTFLAGS\`"
            fi
            echo
            echo "Sizes are of the stripped executables. Start-up is the time from process start to the"
            echo "window-opened line (\`Window opened\`, in the catalog \`App activated\`), median of warm"
            echo "launches; the first launch of each new executable is listed separately."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      # Both refs are built before anything is launched, each into its own
      # target directory, so that no launch runs on a machine that a build
      # keeps busy. RUSTFLAGS is only set
      # when given (set at all, even empty, it replaces the flags of
      # .cargo/config.toml), and only for the ref, so that a baseline of the
      # same ref measures the effect of the flags.
      - name: Build the baseline
        if: inputs.baseline != ''
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-baseline
        run: python3 tools/scripts/perf-report.py --source baseline --size-only
      - name: Build the ref
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-measured
          EXTRA_RUSTFLAGS: ${{ inputs.rustflags }}
        run: |
          if [ -n "$EXTRA_RUSTFLAGS" ]; then export RUSTFLAGS="$EXTRA_RUSTFLAGS"; fi
          python3 tools/scripts/perf-report.py --source measured --size-only
      # One measuring step for both: the launches of the baseline and of the
      # ref alternate, so that both see the same machine.
      - name: Measure
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-measured
          BASELINE_TARGET: ${{ github.workspace }}/target-baseline
          RUNS: ${{ inputs.runs }}
          HAS_BASELINE: ${{ inputs.baseline != '' }}
        run: |
          set -- --source measured --no-build --runs "$RUNS" --save measured.json --markdown "$GITHUB_STEP_SUMMARY" --title "Size and start-up"
          if [ "$HAS_BASELINE" = "true" ]; then
            # Start-up times are noisy on shared runners: a slower median is
            # reported in the comparison, not turned into a failed job.
            set -- "$@" --baseline-target "$BASELINE_TARGET" --save-baseline baseline.json --no-fail
          fi
          python3 tools/scripts/perf-report.py "$@"
      - name: Keep the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: "*.json"
          if-no-files-found: ignore

  # The sizes of the executables of the ControlCatalog and the WinUI theme gallery on Windows
  # (x86-64), with the release profile and the dist profile, of the ref and of the baseline: one job
  # per tree and profile, each builds the two executables in one cargo invocation (so that the
  # features of their common dependencies are those of every measurement) and writes their sizes
  # and their section tables to the job summary. The symbols of a Windows executable are in its
  # PDB, so the sizes are those of what is shipped (docs/binary-size.md, section 3.3).
  windows-size:
    name: Executable sizes (Windows x86-64, ${{ matrix.tree }}, ${{ matrix.profile }})
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        tree: [measured, baseline]
        profile: [release, dist]
    env:
      # The MSVC standard library of the Windows image (14.52) refuses the libclang of the image
      # in the build script of the ANGLE binding ("STL1000: Unexpected compiler version"), as in
      # the Windows job of ci.yml, which passes the check the same way.
      BINDGEN_EXTRA_CLANG_ARGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tree
        if: matrix.tree == 'measured' || inputs.baseline != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tree == 'measured' && inputs.ref || inputs.baseline }}
          path: tree
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.tree == 'measured' || inputs.baseline != ''
      - name: Build
        if: matrix.tree == 'measured' || inputs.baseline != ''
        working-directory: tree
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PROFILE: ${{ matrix.profile }}
        run: |
          start=$(date +%s)
          cargo build --locked --profile "$PROFILE" -p control-catalog-desktop -p winui-theme-gallery --bin control-catalog-desktop --bin winui-theme-gallery
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Sizes
        if: matrix.tree == 'measured' || inputs.baseline != ''
        env:
          TREE: ${{ matrix.tree }}
          REF: ${{ matrix.tree == 'measured' && inputs.ref || inputs.baseline }}
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ github.workspace }}/target
        run: |
          {
            echo "## Windows x86-64: \`$REF\` ($TREE) at \`$(git -C tree rev-parse HEAD)\`, profile \`$PROFILE\`"
            echo
            echo "Built in $BUILD_SECONDS s."
            echo
            echo '```'
            python - "$TARGET/$PROFILE/control-catalog-desktop.exe" "$TARGET/$PROFILE/winui-theme-gallery.exe" <<'PY'
          import struct, sys
          for path in sys.argv[1:]:
              data = open(path, 'rb').read()
              pe = struct.unpack_from('<I', data, 0x3C)[0]
              sections = struct.unpack_from('<H', data, pe + 6)[0]
              table = pe + 24 + struct.unpack_from('<H', data, pe + 20)[0]
              print(f"{path.replace(chr(92), '/').rsplit('/', 1)[-1]}: {len(data)} bytes ({len(data) / 1e6:.2f} MB)")
              for i in range(sections):
                  name, virtual, _, raw = struct.unpack_from('<8sIII', data, table + 40 * i)
                  print(f"  {name.rstrip(bytes(1)).decode():8s} {raw / 1e6:8.2f} MB on disk, {virtual / 1e6:8.2f} MB in memory")
          PY
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The HelloWorld samples (docs/binary-size.md, section 3.6) and the theme-less hello_window
      # of ferroui-desktop, each built by itself as an application is, with the same profile.
      - name: Sizes of the HelloWorld samples
        if: matrix.tree == 'measured'
        working-directory: tree
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PROFILE: ${{ matrix.profile }}
        run: |
          {
            echo "## Windows x86-64: the HelloWorld samples, profile \`$PROFILE\`"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for sample in hello-world hello-world-component-host hello-world-builders hello-world-macros hello-world-hooks hello_window; do
            if [ "$sample" = hello_window ]; then
              cargo build --locked --profile "$PROFILE" -p ferroui-desktop --example hello_window
              file="$CARGO_TARGET_DIR/$PROFILE/examples/hello_window.exe"
            else
              cargo build --locked --profile "$PROFILE" -p "$sample" --bin "$sample"
              file="$CARGO_TARGET_DIR/$PROFILE/$sample.exe"
            fi
            echo "$sample: $(stat -c %s "$file") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
      # Identical code folding and HarfBuzz (#1001): `hb_font_t::has_func_set` compares callback
      # addresses with the defaults, so a callback folded with the default of its slot changes the
      # shaping path. The executables are linked again as shipped, with the list of what the
      # linker folded (`/VERBOSE:ICF`, shown by the lints of the linker's output) and its map.
      - name: Check out the folding report
        if: inputs.folding && matrix.tree == 'measured'
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: scripts/perf/icf_harfbuzz.py
          sparse-checkout-cone-mode: false
      - name: What the linker folds of the HarfBuzz callbacks
        if: inputs.folding && matrix.tree == 'measured'
        working-directory: tree
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          CARGO_TERM_COLOR: never
          # The options of link.exe start with a slash: the shell must not take them for paths.
          MSYS_NO_PATHCONV: "1"
          PROFILE: ${{ matrix.profile }}
        run: |
          out="$GITHUB_WORKSPACE/icf-windows-$PROFILE"
          mkdir -p "$out"
          for app in hello-world control-catalog-desktop; do
            if ! cargo rustc --locked --profile "$PROFILE" -p "$app" --bin "$app" -- \
              -C link-arg=/VERBOSE:ICF -C "link-arg=/MAP:$out/$app.map" -W linker-messages -W linker-info \
              > "$out/$app.log" 2>&1; then
              tail -n 40 "$out/$app.log"
              exit 1
            fi
            python "$GITHUB_WORKSPACE/tools/scripts/perf/icf_harfbuzz.py" --format msvc \
              --label "Windows x86-64, $PROFILE, $app" --log "$out/$app.log" --map "$out/$app.map" \
              --json "$out/$app.json" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -m 5 -i -E 'selected symbol|replaced symbol' "$out/$app.log" || echo "no folding lines in the log of $app"
          done
      - name: Keep what the linker folded
        if: always() && inputs.folding && matrix.tree == 'measured'
        uses: actions/upload-artifact@v4
        with:
          name: icf-windows-${{ matrix.profile }}
          path: icf-windows-${{ matrix.profile }}
          retention-days: 7
      # Identical code folding (#1001): the link line rustc passes for the profile (does it ask for
      # /OPT:ICF?), then the catalog and hello world linked again with /OPT:NOICF, in a target
      # folder of their own, for what folding gives.
      - name: Identical code folding (link line, /OPT:NOICF)
        if: inputs.folding && matrix.tree == 'measured'
        working-directory: tree
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-noicf"
          # One build for both: the link line shows the options of rustc, then /OPT:NOICF last.
          export RUSTFLAGS="-C link-arg=/OPT:NOICF"
          {
            echo "## Windows x86-64: identical code folding, profile \`$PROFILE\`"
            echo
            echo "The options of the link line of hello-world (those of rustc, then the /OPT:NOICF of this step):"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cargo rustc --locked --profile "$PROFILE" -p hello-world --bin hello-world -- --print=link-args 2>/dev/null \
            | tr ' ' '\n' | grep -i -E '^"?/(OPT|DEBUG|INCREMENTAL|LTCG)' | sort -u | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          cargo build --locked --profile "$PROFILE" -p control-catalog-desktop --bin control-catalog-desktop
          cargo build --locked --profile "$PROFILE" -p hello-world --bin hello-world
          {
            echo
            echo "Linked with /OPT:NOICF:"
            echo
            echo '```'
            for app in control-catalog-desktop hello-world; do
              echo "$app: $(stat -c %s "$CARGO_TARGET_DIR/$PROFILE/$app.exe") bytes"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # What the executable of the catalog is made of, by library: the measured tree with the
      # release profile is linked once more with a map of the linker (`/MAP`), and the code and
      # data of each symbol (the distance to the next one) are summed by the library or the object
      # that defines it. With LTO the Rust code of every crate is in the objects of the final crate.
      - name: Attribution by library (the catalog, measured tree, release profile)
        if: matrix.tree == 'measured' && matrix.profile == 'release'
        working-directory: tree
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          MAP: ${{ github.workspace }}/control-catalog-desktop.map
        run: |
          cargo rustc --locked --release -p control-catalog-desktop --bin control-catalog-desktop -- -C "link-arg=/MAP:$MAP"
          {
            echo "## Windows x86-64: the release executable of the catalog by library (MB)"
            echo
            echo '```'
            python - "$MAP" <<'PY'
          import collections, re, sys
          rows = []
          publics = False
          for line in open(sys.argv[1], errors='replace'):
              if 'Publics by Value' in line:
                  publics = True
                  continue
              if not publics:
                  continue
              m = re.match(r'\s*([0-9a-fA-F]{4}):([0-9a-fA-F]{8})\s+(\S+)\s+([0-9a-fA-F]{16})\s+(?:f\s+)?(?:i\s+)?(\S+)\s*$', line)
              if m:
                  rows.append((int(m.group(4), 16), m.group(1), m.group(5)))
          rows.sort()
          sizes = collections.Counter()
          for (address, section, origin), following in zip(rows, rows[1:] + [None]):
              if following is None or following[1] != section:
                  continue
              size = following[0] - address
              if 0 < size < 64_000_000:
                  library = origin.split(':')[0] if ':' in origin else origin
                  library = re.sub(r'-[0-9a-f]{16}', '', library.replace('\\', '/').rsplit('/', 1)[-1])
                  # The objects of a crate after thin LTO: `<binary>.<crate>.<crate>.<hash>-cgu.<n>.rcgu.o`.
                  crate = re.match(r'[a-z0-9_]+\.([a-z0-9_]+)\.\1\.[0-9a-f]+-cgu\.[0-9]+\.rcgu', library)
                  library = f'{crate.group(1)} (Rust)' if crate else re.sub(r'\.[0-9a-z_]+-cgu\.[0-9]+\.rcgu.*$|\.lib$', '', library)
                  sizes[library] += size
          total = sum(sizes.values())
          print(f'{total / 1e6:8.2f} attributed')
          for library, size in sizes.most_common(30):
              print(f'{size / 1e6:8.2f}  {100 * size / total:5.1f} %  {library}')
          PY
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The HelloWorld samples (docs/binary-size.md, section 3.6), hello_window, the declarative TodoMVC,
  # the WinUI theme gallery and the catalog on macOS, each built by itself as an application is, with
  # the release and the dist profile: the size of the executable as cargo writes it, stripped, and
  # its machine code (`__TEXT,__text`), and for the release profile the breakdown by crate of the
  # symbol table (`scripts/symsize.py`) and the unstripped executables of the hello worlds and of
  # TodoMVC as an artifact (for `scripts/symsize.py` and `nm` on another machine). With a
  # baseline, the baseline is measured the same way in a job of its own: sizes do not depend on
  # the machine.
  macos-samples:
    name: Executable sizes (macOS, ${{ matrix.profile }}, ${{ matrix.side }})
    if: inputs.samples
    runs-on: macos-15
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        profile: [release, dist]
        side: [ref, baseline]
    env:
      MEASURE: ${{ matrix.side == 'ref' || inputs.baseline != '' }}
      SIDE_REF: ${{ matrix.side == 'ref' && inputs.ref || inputs.baseline }}
    steps:
      - name: Check out the ref
        if: env.MEASURE == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SIDE_REF }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.MEASURE == 'true'
      - name: Build and measure
        if: env.MEASURE == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
          SIDE: ${{ matrix.side }}
        run: |
          {
            echo "## macOS, $SIDE: \`$SIDE_REF\` at \`$(git rev-parse HEAD)\`, profile \`$PROFILE\` (MB: as written, stripped, \`__TEXT,__text\`)"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p measured
          for app in hello_window hello-world hello-world-component-host hello-world-builders hello-world-macros hello-world-hooks todo-mvc winui-theme-gallery winui-gallery control-catalog-desktop; do
            case "$app" in
              winui-gallery) cargo build --locked --profile "$PROFILE" -p winui-gallery --features winui-gallery/desktop --bin winui-gallery; file="target/$PROFILE/winui-gallery" ;;
              hello_window) cargo build --locked --profile "$PROFILE" -p ferroui-desktop --example hello_window; file="target/$PROFILE/examples/hello_window" ;;
              *) cargo build --locked --profile "$PROFILE" -p "$app" --bin "$app"; file="target/$PROFILE/$app" ;;
            esac
            cp "$file" "measured/$app"
            strip -o "measured/$app.stripped" "measured/$app"
            raw=$(stat -f %z "measured/$app"); stripped=$(stat -f %z "measured/$app.stripped")
            text=$(size -m "measured/$app" | awk '/Section __text:/ { print $3; exit }')
            printf '%-28s %8.2f %8.2f %8.2f\n' "$app" "$(echo "$raw / 1000000" | bc -l)" "$(echo "$stripped / 1000000" | bc -l)" \
              "$(echo "${text:-0} / 1000000" | bc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
      # The generic families from the symbols (#1001): the release executables have them; the dist
      # executables are linked again without stripping, with the link line and the list of what
      # ld64 deduplicates, so that the option is shown to reach the linker.
      - name: Check out the report of the generic families
        if: inputs.symbols && env.MEASURE == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tools
          sparse-checkout: |
            scripts/generic_instances.py
            scripts/symsize.py
            scripts/perf/export_trie.py
          sparse-checkout-cone-mode: false
      - name: Generic instances and the deduplication of the linker
        if: inputs.symbols && env.MEASURE == 'true'
        env:
          CARGO_TERM_COLOR: never
          PROFILE: ${{ matrix.profile }}
          SIDE: ${{ matrix.side }}
        run: |
          out="symbols-$PROFILE-$SIDE"
          mkdir -p "$out"
          ld -v > "$out/ld-version.txt" 2>&1 || true
          verbose=(-C "link-arg=-Wl,-verbose_deduplicate")
          if ld -verbose_deduplicate 2>&1 | grep -q 'unknown option'; then verbose=(); fi
          for app in hello-world hello-world-builders control-catalog-desktop; do
            binary="measured/$app"
            if [ "$PROFILE" = dist ]; then
              if ! cargo rustc --locked --profile dist -p "$app" --bin "$app" -- -C strip=none "${verbose[@]}" \
                -C "link-arg=-Wl,-map,$RUNNER_TEMP/$app.map" --print=link-args -W linker-messages -W linker-info > "$out/$app.log" 2>&1; then
                tail -n 40 "$out/$app.log"
                exit 1
              fi
              binary="target/dist/$app"
            fi
            python3 -I tools/scripts/generic_instances.py "$binary" --top 60 --json "$out/$app.json" > "$out/$app.txt"
            {
              echo "### $app, $PROFILE, $SIDE: generic families"
              echo
              echo '```'
              head -n 2 "$out/$app.txt"
              sed -n '/instances .*family/,$p' "$out/$app.txt" | head -n 26 | cut -c1-120
              if [ "$PROFILE" = dist ]; then
                echo "the link line names -verbose_deduplicate: $(grep -c -- '-verbose_deduplicate' "$out/$app.log")"
                # What ld64 says it deduplicated, without the link line itself.
                grep -v -- '-verbose_deduplicate' "$out/$app.log" | grep -i -E 'dedup|merged|saving' > "$out/$app.dedup" || true
                echo "lines of the linker about deduplication: $(wc -l < "$out/$app.dedup" | tr -d ' ')"
                head -n 4 "$out/$app.dedup" | cut -c1-140
                tail -n 3 "$out/$app.dedup" | cut -c1-140
              fi
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
      # What the export trie of each application holds (#1049), attributed with the link maps of
      # the dist links above.
      - name: The export trie
        if: inputs.symbols && env.MEASURE == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
          SIDE: ${{ matrix.side }}
        run: |
          {
            echo "### The export trie, $PROFILE, $SIDE (bytes)"
            echo
            echo '```'
            for file in measured/*; do
              case "$file" in *.stripped) ;; *) python3 -I tools/scripts/perf/export_trie.py "$file" ;; esac
            done
            if [ "$PROFILE" = dist ]; then
              for app in hello-world hello-world-builders control-catalog-desktop; do
                python3 -I tools/scripts/perf/export_trie.py "target/dist/$app" --map "$RUNNER_TEMP/$app.map"
              done
              # A library keeps its exports: the names of the C ABI, and the factory of the native
              # backend, which a library loaded through ferro_native_library_path has to export.
              cargo build --locked --profile dist -p ferroui-capi --lib > /dev/null 2>&1
              python3 -I tools/scripts/perf/export_trie.py target/dist/libferroui_capi.dylib
              archive="$(find target/dist/build -path '*/ferroui-native-*/out/libferro_native_osx.a' | head -n 1)"
              echo "native archive: $(nm -gU "$archive" 2>/dev/null | grep -c ' [A-TV-Z] ') external symbols"
              nm -m "$archive" 2>/dev/null | grep '_CreateFerroNative$' | sed -E 's/^[0-9a-f]+ //' | head -n 2
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the generic families
        if: always() && inputs.symbols && env.MEASURE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.profile }}-${{ matrix.side }}
          path: symbols-${{ matrix.profile }}-${{ matrix.side }}
          retention-days: 7
      # Identical code folding (#1001): ld64 folds some duplicates by default; the dist build of
      # the ref linked again without it (-no_deduplicate), in a target folder of its own.
      - name: Without the deduplication of the linker
        if: inputs.folding && matrix.side == 'ref' && matrix.profile == 'dist'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          export CARGO_TARGET_DIR="$PWD/target-nodedup"
          export RUSTFLAGS="-C link-arg=-Wl,-no_deduplicate"
          {
            echo "## macOS, ref, profile \`$PROFILE\`, linked with -no_deduplicate (MB: as written, stripped, \`__TEXT,__text\`)"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p nodedup
          for app in hello-world hello-world-builders winui-theme-gallery control-catalog-desktop; do
            cargo build --locked --profile "$PROFILE" -p "$app" --bin "$app"
            cp "$CARGO_TARGET_DIR/$PROFILE/$app" "nodedup/$app"
            strip -o "nodedup/$app.stripped" "nodedup/$app"
            raw=$(stat -f %z "nodedup/$app"); stripped=$(stat -f %z "nodedup/$app.stripped")
            text=$(size -m "nodedup/$app" | awk '/Section __text:/ { print $3; exit }')
            printf '%-28s %8.2f %8.2f %8.2f\n' "$app" "$(echo "$raw / 1000000" | bc -l)" "$(echo "$stripped / 1000000" | bc -l)" \
              "$(echo "${text:-0} / 1000000" | bc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Breakdown by crate
        if: env.MEASURE == 'true' && matrix.profile == 'release'
        run: |
          for app in hello_window hello-world hello-world-builders todo-mvc control-catalog-desktop; do
            {
              echo "### $app, release, by crate"
              echo
              echo '```'
              python3 scripts/symsize.py "measured/$app" -n 0 --crates 20 | sed -n '/by crate/,/top/p' | grep -v '^# top'
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Keep the executables
        if: env.MEASURE == 'true' && matrix.profile == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: executables-release-${{ matrix.side }}
          path: |
            measured/hello-world
            measured/hello-world-builders
            measured/todo-mvc
          retention-days: 7
          if-no-files-found: ignore

  # The C samples of the C ABI (docs/binary-size.md, section 3.7; #978): `hello_world.c` and
  # `gauge.c` linked against `ferroui-capi` in the full mode and, where the tree has it, by use
  # (docs/c-abi.md, section 16), statically with dead stripping and dynamically, with the release
  # and the dist profile, of the ref and of the baseline: one job per tree and profile
  # (`scripts/capi/size_report.py` of the workflow's own commit, so that a tree from before the
  # script is measured too), then one table of the ref against the baseline.
  capi-size:
    name: C samples (macOS, ${{ matrix.tree }}, ${{ matrix.profile }})
    if: inputs.capi
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        tree: [measured, baseline]
        profile: [release, dist]
    steps:
      - name: Check out the report scripts
        if: matrix.tree == 'measured' || inputs.baseline != ''
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: |
            scripts/capi/size_report.py
            scripts/capi/size_by_crate.py
          sparse-checkout-cone-mode: false
      - name: Check out the tree
        if: matrix.tree == 'measured' || inputs.baseline != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tree == 'measured' && inputs.ref || inputs.baseline }}
          path: tree
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.tree == 'measured' || inputs.baseline != ''
      - name: Build and measure
        if: matrix.tree == 'measured' || inputs.baseline != ''
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          TREE: ${{ matrix.tree }}
          PROFILE: ${{ matrix.profile }}
          REF: ${{ matrix.tree == 'measured' && inputs.ref || inputs.baseline }}
        run: |
          python3 tools/scripts/capi/size_report.py --source tree --profile "$PROFILE" --label "$REF" \
            --work capi-size --json "capi-size-$TREE-$PROFILE.json" --markdown "$GITHUB_STEP_SUMMARY"
      - name: Keep the numbers
        if: matrix.tree == 'measured' || inputs.baseline != ''
        uses: actions/upload-artifact@v4
        with:
          name: capi-size-${{ matrix.tree }}-${{ matrix.profile }}
          path: capi-size-*.json
          if-no-files-found: ignore

  capi-size-compare:
    name: C samples against the baseline
    if: inputs.capi && inputs.baseline != ''
    needs: capi-size
    runs-on: ubuntu-latest
    steps:
      - name: Check out the report scripts
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: |
            scripts/capi/size_report.py
            scripts/capi/size_by_crate.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: capi-size-*
          merge-multiple: true
      - name: Compare
        run: |
          for profile in release dist; do
            if [ -f "capi-size-measured-$profile.json" ] && [ -f "capi-size-baseline-$profile.json" ]; then
              python3 tools/scripts/capi/size_report.py --compare "capi-size-measured-$profile.json" \
                "capi-size-baseline-$profile.json" --markdown "$GITHUB_STEP_SUMMARY"
            fi
          done

  # The export trie of the iOS executables (#1049), simulator, dist.
  ios-exports:
    name: The export trie on iOS (simulator, dist, ${{ matrix.side }})
    if: inputs.symbols
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        side: [ref, baseline]
    env:
      MEASURE: ${{ matrix.side == 'ref' || inputs.baseline != '' }}
      SIDE_REF: ${{ matrix.side == 'ref' && inputs.ref || inputs.baseline }}
    steps:
      - name: Check out the ref
        if: env.MEASURE == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SIDE_REF }}
      - name: Check out the report of the export trie
        if: env.MEASURE == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tools
          sparse-checkout: scripts/perf/export_trie.py
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        if: env.MEASURE == 'true'
        with:
          targets: aarch64-apple-ios-sim
      - name: Build and read
        if: env.MEASURE == 'true'
        env:
          SIDE: ${{ matrix.side }}
          CARGO_TERM_COLOR: never
        run: |
          target=aarch64-apple-ios-sim
          cargo build --locked --profile dist -p ferroui-ios --features example --example ios_view --target "$target"
          cargo build --locked --profile dist -p control-catalog-ios --bin control-catalog-ios --target "$target"
          {
            echo "### The export trie on iOS, simulator, dist, $SIDE: \`$SIDE_REF\` at \`$(git rev-parse HEAD)\` (bytes)"
            echo
            echo '```'
            for file in "target/$target/dist/examples/ios_view" "target/$target/dist/control-catalog-ios"; do
              python3 -I tools/scripts/perf/export_trie.py "$file" --list | awk 'NR == 1 || !/^    _/'
              python3 -I tools/scripts/perf/export_trie.py "$file" --list | awk 'NR > 1' | grep -c . || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Identical code folding on Android (#1001): the catalog's library for arm64 in dist, linked again
  # with lld's --icf=safe and --icf=all. Only the final crate is linked again.
  android-folding:
    name: Identical code folding (Android arm64, dist)
    if: inputs.platforms
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the link report
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tools
          sparse-checkout: scripts/perf/link_flags.py
          sparse-checkout-cone-mode: false
      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: tree
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: The NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358" > /dev/null
      - name: Build, link and measure
        working-directory: tree
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          CARGO_TERM_COLOR: never
        run: |
          . scripts/android/env.sh
          target=aarch64-linux-android
          file="target/$target/dist/libcontrol_catalog_android.so"
          link() {
            cargo rustc --locked --profile dist -p control-catalog-android --lib --target "$target" -- "$@"
          }
          link --print=link-args > "$RUNNER_TEMP/android-link.txt"
          {
            echo "## Android arm64, \`$REF\` at \`$(git rev-parse HEAD)\`, dist, \`control-catalog-android\`"
            echo
            echo "The options of the link line:"
            echo
            echo '```'
            python3 -I ../tools/scripts/perf/link_flags.py "$RUNNER_TEMP/android-link.txt"
            echo '```'
            echo
            echo '```'
            printf '%-10s %12s %12s\n' folding 'bytes' '.text'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          measure() {
            printf '%-10s %12s %12s\n' "$1" "$(stat -c %s "$file")" \
              "$("$FERROUI_ANDROID_TOOLCHAIN/llvm-size" -A "$file" | awk '$1 == ".text" { print $2 }')" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          measure none
          link -C link-arg=-Wl,--icf=safe > /dev/null
          measure safe
          link -C link-arg=-Wl,--icf=all > /dev/null
          measure all
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

  # How iOS is linked against macOS (#1001), dist: the options of the two link lines.
  ios-link-line:
    name: The link lines of iOS and macOS (dist)
    if: inputs.platforms
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Check out the link report
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tools
          sparse-checkout: scripts/perf/link_flags.py
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - name: The two link lines
        env:
          REF: ${{ inputs.ref }}
          CARGO_TERM_COLOR: never
        run: |
          cargo rustc --locked --profile dist -p ferroui-desktop --example hello_window -- --print=link-args \
            > "$RUNNER_TEMP/macos.txt"
          cargo rustc --locked --profile dist -p ferroui-ios --features example --example ios_view \
            --target aarch64-apple-ios-sim -- --print=link-args > "$RUNNER_TEMP/ios.txt"
          {
            echo "## The link lines of macOS (hello_window) and iOS (ios_view, simulator), \`$REF\` at \`$(git rev-parse HEAD)\`, dist"
            echo
            echo '```'
            ld -v 2>&1 | head -n 2
            (cd "$RUNNER_TEMP" && python3 -I "$GITHUB_WORKSPACE/tools/scripts/perf/link_flags.py" macos.txt ios.txt)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Which passes wasm-opt runs on the browser catalog (#1001). Duplicate function elimination is
  # measured only if the link does not already run it.
  browser-wasm-passes:
    name: The wasm-opt passes of the browser catalog
    if: inputs.platforms
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/browser-toolchain
        with:
          cache-key: browser
      - name: Link with the passes logged
        env:
          REF: ${{ inputs.ref }}
          CARGO_TERM_COLOR: never
        run: |
          log="$RUNNER_TEMP/emcc.log"
          real="$(command -v em++)"
          mkdir -p "$RUNNER_TEMP/linker"
          cat > "$RUNNER_TEMP/linker/em++" <<EOF
          #!/bin/bash
          EMCC_VERBOSE=1 BINARYEN_PASS_DEBUG=1 "$real" "\$@" >> "$log" 2>&1
          EOF
          chmod +x "$RUNNER_TEMP/linker/em++"
          export CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_LINKER="$RUNNER_TEMP/linker/em++"
          if ! cargo build --locked --profile browser --target wasm32-unknown-emscripten \
            -p control-catalog-browser --bin control-catalog-browser; then
            tail -n 40 "$log"
            exit 1
          fi
          wasm=target/wasm32-unknown-emscripten/browser/control_catalog_browser.wasm
          sizes() {
            node -e 'const z = require("zlib"), b = require("fs").readFileSync(process.argv[1]);
              console.log(process.argv[2].padEnd(30), "raw", b.length, "gzip -9", z.gzipSync(b, { level: 9 }).length,
                "brotli 11", z.brotliCompressSync(b).length);' "$1" "$2"
          }
          {
            echo "## The browser catalog, \`$REF\` at \`$(git rev-parse HEAD)\`, profile \`browser\`"
            echo
            echo '```'
            echo "wasm-opt commands of the link: $(grep -c -E '/wasm-opt( |")' "$log")"
            grep -E '/wasm-opt( |")' "$log" | sed -E 's#[^ ]*/##g' | cut -c1-220 | head -n 6
            echo "duplicate-function-elimination runs: $(grep -c 'running pass: duplicate-function-elimination' "$log")"
            echo "passes run: $(grep -o 'running pass: [a-z0-9-]*' "$log" | wc -l)"
            sizes "$wasm" "as linked"
            if ! grep -q 'running pass: duplicate-function-elimination' "$log"; then
              "$EMSDK/upstream/bin/wasm-opt" --all-features --duplicate-function-elimination "$wasm" -o "$RUNNER_TEMP/dfe.wasm"
              sizes "$RUNNER_TEMP/dfe.wasm" "with the pass"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Identical code folding at link time on Linux (#1001): the HelloWorld samples, the WinUI theme
  # gallery and the catalog of the ref with the dist profile, linked as rustc links them, with
  # lld's --icf=safe (functions whose address is taken are kept) and with --icf=all (for
  # reference), each in a job of its own. The sizes are those of the executable as written,
  # stripped, and of its machine code (.text).
  linux-folding:
    name: Identical code folding (Linux x86-64, dist, ${{ matrix.folding }})
    if: inputs.folding
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        folding: [none, safe, all]
    steps:
      - name: Check out the folding report
        uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: scripts/perf/icf_harfbuzz.py
          sparse-checkout-cone-mode: false
      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: tree
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxfixes-dev libxext-dev libxtst-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libicu-dev pkg-config \
            libglib2.0-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libvulkan-dev clang lld \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev libgles-dev
      - name: Build and measure
        working-directory: tree
        env:
          FOLDING: ${{ matrix.folding }}
          REF: ${{ inputs.ref }}
        run: |
          case "$FOLDING" in
            none) export RUSTFLAGS="-C link-arg=-fuse-ld=lld" ;;
            *) export RUSTFLAGS="-C link-arg=-fuse-ld=lld -C link-arg=-Wl,--icf=$FOLDING" ;;
          esac
          {
            echo "## Linux x86-64, \`$REF\` at \`$(git rev-parse HEAD)\`, dist, folding \`$FOLDING\` (RUSTFLAGS \`$RUSTFLAGS\`)"
            echo
            echo "The options of the link line of hello-world:"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cargo rustc --locked --profile dist -p hello-world --bin hello-world -- --print=link-args 2>/dev/null \
            | tr ' ' '\n' | grep -E '^"?-(Wl|fuse-ld|B)' | sort -u | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo
            echo "MB: as written, stripped, .text"
            echo
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p measured
          for app in hello-world hello-world-builders winui-theme-gallery control-catalog-desktop; do
            cargo build --locked --profile dist -p "$app" --bin "$app"
            cp "target/dist/$app" "measured/$app"
            strip -o "measured/$app.stripped" "measured/$app"
            raw=$(stat -c %s "measured/$app"); stripped=$(stat -c %s "measured/$app.stripped")
            text=$(size -A "measured/$app" | awk '$1 == ".text" { print $2; exit }')
            printf '%-28s %8.2f %8.2f %8.2f\n' "$app" "$(echo "$raw / 1000000" | bc -l)" "$(echo "$stripped / 1000000" | bc -l)" \
              "$(echo "${text:-0} / 1000000" | bc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          # What the linker folds of the HarfBuzz callbacks (`hb_font_t::has_func_set` compares
          # their addresses): the two executables linked again with the list of folded sections.
          if [ "$FOLDING" != none ]; then
            out="$GITHUB_WORKSPACE/icf-linux-$FOLDING"
            mkdir -p "$out"
            for app in hello-world control-catalog-desktop; do
              if ! CARGO_TERM_COLOR=never cargo rustc --locked --profile dist -p "$app" --bin "$app" -- \
                -C link-arg=-Wl,--print-icf-sections "-Clink-arg=-Wl,-Map=$out/$app.map" \
                -W linker-messages -W linker-info > "$out/$app.log" 2>&1; then
                tail -n 40 "$out/$app.log"
                exit 1
              fi
              python3 -I "$GITHUB_WORKSPACE/tools/scripts/perf/icf_harfbuzz.py" --format lld \
                --label "Linux x86-64, dist, --icf=$FOLDING, $app" --log "$out/$app.log" \
                --map "$out/$app.map" --json "$out/$app.json" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          fi
      - name: Keep what the linker folded
        if: always() && matrix.folding != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: icf-linux-${{ matrix.folding }}
          path: icf-linux-${{ matrix.folding }}
          retention-days: 7
