name: Inking compatibility

on:
  pull_request:
    # The tests of the crate also run in the workspace run of ci.yml; this workflow follows the
    # inking sources and runs them on every operating system and architecture the port targets,
    # with what ci.yml does not run: the port ledger, the builders of ferroui-view with the
    # feature `inking`, the WebAssembly build and the native Windows ink services with the
    # clipboard exchange.
    paths:
      - '.github/workflows/inking.yml'
      - 'src/FerroUI.Controls.Inking/**'
      - 'src/FerroUI.View/generated/inking.rs'
      - 'src/FerroUI.View/tests/inking_tests.rs'
      - 'samples/ControlCatalog/Pages/*Inking*'
      - 'samples/ControlCatalog/Pages/inking_page.rs'
      - 'scripts/inking/**'
      - 'scripts/winui-inking/**'
      - 'docs/porting/data/winui-inking/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inking-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  portable:
    name: Portable ink, markup and WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Pinned source, member and test accounting
        run: python3 scripts/inking/check_port.py --require-control-complete
      - name: Declarative Rust builders and runtime XAML of the inking controls
        run: cargo test --locked -p ferroui-view --features inking --lib inking_tests
      - name: WebAssembly control compilation
        run: cargo check --locked -p ferroui-controls-inking --target wasm32-unknown-unknown

  tests:
    name: Tests of the crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # Every test of the crate: the portable engine, input, rendering, the toolbar and its
      # theme, and on Windows the native ISF, GIF, conversion and failure-atomicity fixtures of
      # the ink services (`windows_ink_services::`).
      - name: The tests of ferroui-controls-inking
        run: cargo test --locked -p ferroui-controls-inking --lib
      - name: Native clipboard exchange on the isolated Windows runner
        if: runner.os == 'Windows'
        run: cargo test --locked -p ferroui-controls-inking --lib windows_ink_services::tests::native_clipboard_round_trip -- --ignored --exact --test-threads=1 --nocapture
