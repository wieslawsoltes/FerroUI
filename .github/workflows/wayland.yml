name: Wayland

# The Wayland backend under headless sway.
# Split from ci.yml so that a pull request that does not touch this area shows no check for it
# (a skipped job is still a check). It runs every night on main and by hand:
# gh workflow run wayland.yml --ref <branch>

on:
  pull_request:
    paths:
      - 'src/FerroUI.Wayland/**'
      - 'scripts/wayland/**'
      - '.github/workflows/wayland.yml'
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:

concurrency:
  group: wayland-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The Wayland platform (docs/porting/wayland-platform.md, section 11): the tests of the crate, and
  # a window on a compositor. The compositor is sway on the headless backend of wlroots with its
  # software renderer (scripts/wayland/sway-run.sh). The example asks the compositor what it knows
  # of the window and of the outputs (its IPC), and is its own test client on a second connection:
  # it reads the composed output (screen copy) and synthesizes pointer and keyboard input (the
  # virtual pointer and virtual keyboard protocols). Rendered through wl_shm buffers and through
  # EGL (Mesa's software rasterizer), on an output of scale 1 and of scale 2. Not covered: a
  # desktop compositor (Mutter, KWin), a hardware GPU, touch, a compositor restart.
  wayland:
    name: Build and test (Linux, Wayland under headless sway)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: wayland
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # libwayland-client, libwayland-egl, libEGL and libxkbcommon are opened at run time (nothing
      # links them); Skia links FreeType and Fontconfig, and needs a font to answer for the default
      # family. xkb-data has the keymap the virtual keyboard of the example gives the compositor;
      # wl-clipboard has wl-copy and wl-paste, the other clients of the clipboard phase.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            sway wl-clipboard libwayland-client0 libwayland-egl1 libxkbcommon0 xkb-data \
            libegl1 libegl-mesa0 libgl1 libgles2 libgl1-mesa-dri \
            libfontconfig1-dev libfreetype6-dev fonts-dejavu-core pkg-config
          sway --version
      - name: Tests of the Wayland crate (no compositor needed)
        run: cargo test --locked -p ferroui-wayland --no-fail-fast
      - name: Build the window example
        if: ${{ !cancelled() }}
        run: cargo build --locked -p ferroui-wayland --features example --example wayland_window
      - name: A window on a compositor, rendered through wl_shm buffers
        run: |
          scripts/wayland/sway-run.sh -- \
            timeout 300 target/debug/examples/wayland_window --smoke
      - name: The same rendered through EGL
        if: ${{ !cancelled() }}
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          scripts/wayland/sway-run.sh -- \
            timeout 300 target/debug/examples/wayland_window --smoke --mode=egl
      - name: On an output of scale 2, through wl_shm buffers
        if: ${{ !cancelled() }}
        run: |
          scripts/wayland/sway-run.sh --scale 2 -- \
            timeout 300 target/debug/examples/wayland_window --smoke --expect-scale=2
      - name: On an output of scale 2, through EGL
        if: ${{ !cancelled() }}
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          scripts/wayland/sway-run.sh --scale 2 -- \
            timeout 300 target/debug/examples/wayland_window --smoke --mode=egl --expect-scale=2
      # Fractional scaling: the compositor announces the scale through wp_fractional_scale_v1 and
      # the buffer is mapped to the logical size through wp_viewport. The mode of the output is one
      # that 1.5 divides; the resize phase, whose mode it does not divide, is left out.
      - name: On an output of scale 1.5, through wl_shm buffers
        if: ${{ !cancelled() }}
        run: |
          scripts/wayland/sway-run.sh --size 1200x720 --scale 1.5 -- \
            timeout 300 target/debug/examples/wayland_window --smoke --expect-scale=1.5 --skip=resize
      - name: On an output of scale 1.5, through EGL
        if: ${{ !cancelled() }}
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          scripts/wayland/sway-run.sh --size 1200x720 --scale 1.5 -- \
            timeout 300 target/debug/examples/wayland_window --smoke --mode=egl --expect-scale=1.5 --skip=resize
      # The dmabuf swapchain (use_dmabuf_swapchain, stage 3): the backend allocates its buffers with
      # GBM on the render node of the compositor's main device and hands them over through
      # zwp_linux_dmabuf_v1. sway on its software renderer has no DRM device and announces no
      # zwp_linux_dmabuf_v1, so the backend falls back to a wl_egl_window, as the original does: the
      # step checks that the run says so and that everything renders through the fallback.
      - name: The dmabuf swapchain asked for, under the software renderer (the fallback)
        if: ${{ !cancelled() }}
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -o pipefail
          scripts/wayland/sway-run.sh -- \
            timeout 300 target/debug/examples/wayland_window --smoke --mode=dmabuf 2>&1 | tee "$RUNNER_TEMP/dmabuf-fallback.log"
          grep -q "the backend fell back to a wl_egl_window" "$RUNNER_TEMP/dmabuf-fallback.log"
          grep -q "zwp_linux_dmabuf_v1 (version 4 or later): rendering through a wl_egl_window" "$RUNNER_TEMP/dmabuf-fallback.log"
      # Where the runner has a DRM render node (or gets one from the module vgem of the extra modules
      # of its kernel), the compositor is tried on OpenGL ES over it, which is the only way it
      # announces zwp_linux_dmabuf_v1; then the smoke mode has to render through the swapchain.
      # Informational: whether Mesa has a driver for the node of the runner is measured here, not
      # assumed (docs/porting/wayland-platform.md, section 11).
      - name: The dmabuf swapchain on a render node, where the runner has one
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          echo "kernel $(uname -r)"
          ls -l /dev/dri 2>/dev/null || echo "no /dev/dri"
          if ! ls /dev/dri/renderD* >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends kmod "linux-modules-extra-$(uname -r)" \
              || echo "::notice::no linux-modules-extra package for the kernel of the runner"
            sudo modprobe vgem || echo "::notice::the module vgem could not be loaded"
            ls -l /dev/dri 2>/dev/null || true
          fi
          node="$(ls /dev/dri/renderD* 2>/dev/null | head -n 1)"
          if [ -z "$node" ]; then
            echo "::notice::no DRM render node on this runner: the dmabuf swapchain was exercised through its fallback only"
            exit 0
          fi
          sudo chmod a+rw "$node"
          set +e
          scripts/wayland/sway-run.sh --renderer gles2 --render-node "$node" -- \
            timeout 300 target/debug/examples/wayland_window --smoke --mode=dmabuf > "$RUNNER_TEMP/dmabuf-node.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/dmabuf-node.log"
          if grep -q "the compositor did not start" "$RUNNER_TEMP/dmabuf-node.log"; then
            echo "::notice::sway cannot render with OpenGL ES on $node (no driver of Mesa for it): the dmabuf swapchain was exercised through its fallback only"
            exit 0
          fi
          grep "Dmabuf swapchain:" "$RUNNER_TEMP/dmabuf-node.log" | sed 's/^/::notice::/'
          exit $status
      # The ControlCatalog on the Wayland backend with a combo box and a menu open: the catalog
      # says where the compositor put each popup, and the step fails when that is not at the
      # control the popup belongs to. The pictures the compositor took are an artifact.
      - name: Build the ControlCatalog
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y --no-install-recommends grim
          cargo build --locked -p control-catalog-desktop
      - name: The popups of the ControlCatalog are at their controls
        if: ${{ !cancelled() }}
        run: |
          result=0
          for popup in combobox menu; do
            case "$popup" in combobox) page=ComboBox ;; menu) page=Menu ;; esac
            for scale in 1 1.5 2; do
              FERROUI_SMOKE_SCREENSHOT_PAGES="$page" CATALOG_POPUP="$popup" \
                scripts/wayland/sway-run.sh --size 1920x1200 --scale "$scale" -- \
                sh scripts/wayland/catalog-pictures.sh target/debug/control-catalog-desktop "catalog-pictures/scale-$scale" software 4000 || result=1
            done
          done
          exit $result
      # The TextBox page of the catalog with the test client of the example as the input method of
      # the seat: the first text box takes the focus, the input method commits a text and leaves a
      # preedit, and the step fails unless the catalog says the text box has the text.
      - name: An input method types into a text box of the ControlCatalog
        if: ${{ !cancelled() }}
        run: |
          result=0
          for scale in 1 1.5; do
            FERROUI_SMOKE_SCREENSHOT_PAGES=TextBox CATALOG_POPUP=textbox \
              CATALOG_INPUT_METHOD=target/debug/examples/wayland_window \
              CATALOG_INPUT_TEXT="typed by an input method: Zażółć gęślą jaźń" CATALOG_INPUT_PREEDIT="ni hao" \
              scripts/wayland/sway-run.sh --size 1920x1200 --scale "$scale" -- \
              sh scripts/wayland/catalog-pictures.sh target/debug/control-catalog-desktop "catalog-pictures/scale-$scale" software 10000 || result=1
          done
          exit $result
      # The catalog asks for no backend: like the original it uses Wayland when a compositor can be
      # reached (and here nothing else can be: there is no X server).
      - name: The ControlCatalog uses the Wayland backend without being asked
        if: ${{ !cancelled() }}
        run: |
          scripts/wayland/sway-run.sh --size 1280x800 -- sh -c '
            FERROUI_SMOKE_EXIT_MS=8000 target/debug/control-catalog-desktop & pid=$!
            sleep 5
            views="$(swaymsg -t get_tree | grep -c "control-catalog-desktop")"
            echo "lines of the tree of the compositor that name the catalog: $views"
            wait $pid; status=$?
            echo "the catalog ended with $status"
            test "$views" -ge 1 && test $status -eq 0'
      - name: Upload the pictures of the catalog
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wayland-catalog-pictures
          path: catalog-pictures
          if-no-files-found: ignore
      # Without a compositor the backend does not start, and says why.
      - name: Without a compositor the probe fails with a message
        if: ${{ !cancelled() }}
        run: |
          set +e
          out="$(env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET XDG_RUNTIME_DIR=/nonexistent timeout 60 target/debug/examples/wayland_window 2>&1)"
          status=$?
          echo "$out"
          test $status -ne 0
          echo "$out" | grep -q "Unable to connect to Wayland display"
