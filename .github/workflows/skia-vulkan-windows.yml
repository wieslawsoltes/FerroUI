name: Skia with Vulkan on Windows

# The feature `vulkan` of the Windows backend (ferroui-win32) turns on the Vulkan GPU of the Skia
# backend, and no published binary of Skia for Windows has Vulkan beside OpenGL: the Skia bindings
# then compile Skia from source (docs/porting/vulkan.md, section 2; docs/porting/win32-platform.md,
# section 6.1). That build takes an hour and more, so it does not run on every pull request: it is
# run by hand and once a week, and its result is recorded in vulkan.md, section 8.
#
# What the build script of skia-bindings needs for a source build on Windows: LLVM (found through
# LLVM_HOME), Python 3 (`python` on the path), git and the network (`skia/tools/git-sync-deps`
# fetches the third-party repositories of Skia), ninja on the path, and the MSVC tools.

on:
  workflow_dispatch:
  schedule:
    # Sundays at 03:17 UTC.
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: skia-vulkan-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Windows backend with the feature vulkan (Skia from source)
    runs-on: windows-latest
    timeout-minutes: 300
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
      # skia-bindings looks for LLVM there; ANGLE (the default feature of the backend) needs its
      # libclang too.
      LLVM_HOME: C:\Program Files\LLVM
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      # The sources of Skia's third-party repositories have paths longer than the limit of the
      # system without this.
      - name: Long paths for git
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Ninja and the tools of the image
        run: |
          python -m pip install --upgrade ninja
          ninja --version
          python --version
          git --version
          clang --version
          rustc -vV
      # The build asks the release of the bindings for the binary of its key first
      # (ganesh-gl-jpegd-jpege-pdf-vulkan, not published for Windows) and then compiles Skia from
      # source.
      - name: Build the backend and its example with the feature vulkan
        run: |
          start=$(date +%s)
          cargo build --locked -p ferroui-win32 --features vulkan --examples
          echo "::notice::the build with the feature vulkan took $(( $(date +%s) - start )) s"
      - name: The tests of the backend with the feature vulkan
        run: cargo test --locked -p ferroui-win32 --features vulkan --no-fail-fast
      # The smoke run of a window with the Vulkan probe (win32-platform.md, section 6.1): the mode
      # is initialised as the platform would, and on a machine without a Vulkan driver (the hosted
      # runners have none) it is reported as not available, not failed.
      - name: Smoke run with the Vulkan probe
        timeout-minutes: 5
        run: cargo run --locked -p ferroui-win32 --features vulkan --example win32_window -- --smoke --vulkan-probe
