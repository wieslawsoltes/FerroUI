ferroui-markup-xaml-loader = { version = "=0.3.0", features = ["emitter"] }
ferroui-themes-simple.workspace = true
ferroui-themes-fluent.workspace = true
ferrodock-model-reactiveui-services = { path = "../../../src/Dock/FerroDock.Model.ReactiveUI.Services" }
ferroui-reactive.workspace = true
ferroui-reactiveui.workspace = true
ferroui-headless = { workspace = true, features = ["testing"] }

[lints]
workspace = true
