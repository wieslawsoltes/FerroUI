ferrodock-model.workspace = true
ferroui-system.workspace = true

[build-dependencies]
serde_json.workspace = true
ferrodock-serializer-system-text-json-generators = { path = "../../../src/Dock/FerroDock.Serializer.SystemTextJson.Generators", version = "0.1.0" }
