version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"
[lib]
path = "lib.rs"
[dependencies]
ferrodock-model.workspace = true
ferrodock-model-reactiveui = { path="../../../src/Dock/FerroDock.Model.ReactiveUI" }
