[package]
name = "ferroui-frame-benchmarks-android"
description = "The Android entry point of FerroUI's frame benchmarks: a scene in the main view of an activity, for the window suite of the performance gate in an emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

# A shared library: the application class of the Java layer of the Android backend loads it.
# `scripts/android/apk.sh package --package ferroui-frame-benchmarks-android` builds it for the
# Android target and packages it; on another system the library is empty.
[lib]
name = "ferroui_frame_benchmarks_android"
path = "application.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-android = { workspace = true }
ferroui-frame-benchmarks = { path = "../FerroUI.FrameBenchmarks", default-features = false }
