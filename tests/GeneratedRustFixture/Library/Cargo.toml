[package]
name = "generated-rust-fixture-library"
description = "Test fixture of the XAML compiler: a library whose classes the compiled documents of another crate construct (#849)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"
# The build script hands the path of the `.xamlmeta` of the crate to the build scripts of the crates
# that depend on this one (`DEP_GENERATED_RUST_FIXTURE_LIBRARY_XAML_XAMLMETA`).
links = "generated_rust_fixture_library_xaml"
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[dependencies]
# The compiled markup of the crate calls the typed functions of the declared members.
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup-xaml = { workspace = true }

[build-dependencies]
# The build script compiles the documents of the classes of the crate against the type models.
ferroui-build = { workspace = true }
