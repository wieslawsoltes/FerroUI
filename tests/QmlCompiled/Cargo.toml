[package]
name = "qml-compiled-tests"
description = "Rust integration tests for ahead-of-time compiled QML components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "lib.rs"

[features]
webscene = ["dep:ferroui-qml-webscene", "ferroui-qml-build/javascript"]

[dependencies]
ferroui-qml-webscene = { workspace = true, optional = true }
ferroui-qml.workspace = true

[dev-dependencies]
ferroui-qml-build.workspace = true

[build-dependencies]
ferroui-qml.workspace = true
ferroui-qml-build.workspace = true
