[package]
name = "ferroui-treedatagrid-benchmarks"
description = "The benchmarks of FerroUI's TreeDataGrid: column geometry and layout, element and cell recycling, sources and presentations, first layout and virtualized scrolling, measured with the harness of ferroui-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
default = ["layout-benchmarks"]
layout-benchmarks = ["dep:ferroui-benchmarks"]
# The counting allocator of the harness (ferroui-benchmarks, harness.rs): the table of a run has
# what an operation allocated. Off by default: counting costs time.
count-allocations = ["layout-benchmarks", "ferroui-benchmarks/count-allocations"]
# Real Windows GPU rendering, in addition to the original mock-layout suite.
renderer-benchmarks = ["dep:ferroui-skia", "dep:ferroui-harfbuzz", "dep:ferroui-direct2d", "dep:ferroui-win32", "dep:ferroui-opengl", "dep:serde_json"]

[dependencies]
# The harness: the registry, the runner, the smoke helpers and the allocation counts.
ferroui-benchmarks = { path = "../FerroUI.Benchmarks", optional = true }
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
# Linked as the framework's benchmarks link it; the scenarios of the reference load no theme, so
# no benchmark applies it.
ferroui-treedatagrid-core = { workspace = true }
ferroui-controls-treedatagrid = { workspace = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
ferroui-skia = { workspace = true, optional = true }
ferroui-harfbuzz = { workspace = true, optional = true }
ferroui-direct2d = { workspace = true, optional = true }
ferroui-opengl = { workspace = true, optional = true }
ferroui-win32 = { workspace = true, default-features = false, features = ["angle"], optional = true }

[build-dependencies]
cc.workspace = true
