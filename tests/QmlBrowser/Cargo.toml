[package]
name = "qml-browser-tests"
description = "Browser execution fixture for the FerroUI QML script host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ferroui-qml.workspace = true
ferroui-qml-webscene.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "0.4"

[build-dependencies]
ferroui-qml-build = { workspace = true, features = ["javascript"] }
