[package]
name = "ferroui-render-backends-comparison"
description = "Test crate: renders the same scenes with the Skia and the Vello render backend and compares the pixels and the geometry queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "lib.rs"

# The one crate that links both render backends: an application has one.
[dependencies]
ferroui-base.workspace = true
ferroui-skia.workspace = true
# With every rendering mode: the harness compares them (modes.rs).
ferroui-vello = { workspace = true, features = ["hybrid", "gpu"] }
# The text scenes: the shaper both backends are used with, and Skia itself
# for the one thing the contracts have no member for, an instance of a
# variable font.
ferroui-harfbuzz.workspace = true
skia-safe.workspace = true

# The application on each backend (`application_tests.rs`): the headless
# platform, the controls and the Fluent theme.
[dev-dependencies]
ferroui-controls.workspace = true
ferroui-headless.workspace = true
ferroui-themes-fluent.workspace = true
# The codec tests write the GIF files they give to both backends.
gif.workspace = true
