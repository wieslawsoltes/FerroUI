[package]
name = "ferroui-markup-xaml-tests"
description = "The unit tests of the FerroUI XAML stack: documents loaded at run time through the run-time XAML loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "emitter", "testing"] }
xamlx = { workspace = true }

[dev-dependencies]
# The measurement of the theme documents (`emitter::repository_documents`, an ignored test)
# compiles each theme's documents as a group, which names the types of the theme crates.
ferroui-themes-simple = { workspace = true }
ferroui-themes-fluent = { workspace = true }
