[package]
name = "xaml-include-fixture-theme"
description = "Test fixture of the XAML compiler: a library whose compiled documents another crate includes (the assembly Tests)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"
# The build script hands the path of the `.xamlmeta` of the crate to the build scripts of the crates
# that depend on this one (`DEP_XAML_INCLUDE_FIXTURE_THEME_XAML_XAMLMETA`; docs/porting/xaml.md, 9.6.3).
links = "xaml_include_fixture_theme_xaml"
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[dependencies]
# The compiled markup of the crate calls the typed functions of the declared members.
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup-xaml = { workspace = true }

[build-dependencies]
# The build script compiles the documents of the crate (`build.rs`) against the type models: the scan
# of the sources of this crate and the models the framework crates export. It links the compiler and
# no crate for its types.
ferroui-build = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
# The emitter, run against the run-time type system, checks the output of the build script
# (`tests/compiled_xaml_tests.rs`).
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "testing", "emitter"] }
