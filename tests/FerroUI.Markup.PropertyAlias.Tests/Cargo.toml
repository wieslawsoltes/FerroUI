[package]
name = "ferroui-markup-property-alias-tests"
description = "Compiled and run-time markup tests of property aliases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-markup-xaml.workspace = true
ferroui-markup-property-alias-library = { path = "../FerroUI.Markup.PropertyAlias.Library" }

[build-dependencies]
ferroui-build.workspace = true

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime"] }
