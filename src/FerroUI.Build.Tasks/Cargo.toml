[package]
name = "ferroui-build"
description = "Build-script support of FerroUI: compiles the markup documents of a crate to Rust source and embeds its assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "xaml", "build", "codegen"]
categories = ["gui", "development-tools::build-utils"]
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
# The run-time host of `Build` (`TypeSystem::Runtime`, with `Build::assembly`): the documents are compiled
# against the types the build script registered in its process. It links the XAML runtime library and,
# through it, the controls, which a build script then builds for the host. No crate of the repository
# enables it: every build compiles against the type models (`TypeSystem::Model`).
runtime-host = ["dep:ferroui-markup-xaml", "ferroui-markup-xaml-loader/emitter"]

[dependencies]
# `MarkupAssembly`, and the attributes of the type model the build-time type system projects.
ferroui-base = { workspace = true }
# The configuration of the run-time loader and the registration of the runtime library: the run-time host
# only.
ferroui-markup-xaml = { workspace = true, optional = true }
# The compiler: the transform and the emitter of Rust source against the type system the host states
# (the `compiler` feature, which links neither the XAML runtime library nor the controls).
ferroui-markup-xaml-loader = { workspace = true, features = ["compiler"] }
# The type-system contracts of the compiler (`IXamlType`, `IXamlTypeSystem`), which the build-time type
# system over the type model implements (docs/porting/xaml.md, 9.5.5). The loader links it already.
xamlx = { workspace = true }
# The type model, the source scanner and the export of a model (docs/porting/xaml.md, 9.5.1 and
# 9.5.13): the crate the framework crates scan themselves with. Its modules are exported from this
# crate under the names they had here.
ferroui-build-scan = { workspace = true }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "markup"
