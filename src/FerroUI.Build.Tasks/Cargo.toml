[package]
name = "ferroui-build"
description = "Build-script support of FerroUI: compiles the markup documents of a crate to Rust source and embeds its assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[dependencies]
# `MarkupAssembly`, the asset registry.
ferroui-base = { workspace = true }
# The configuration of the loader and the registration of the runtime library.
ferroui-markup-xaml = { workspace = true }
# The compiler: the transform (against the run-time type system, which is why the build script that
# calls this crate links the crates of the types its documents name) and the emitter of Rust source.
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "emitter"] }
# The type-system contracts of the compiler (`IXamlType`, `IXamlTypeSystem`), which the build-time type
# system over the type model implements (docs/porting/xaml.md, 9.5.5). The loader links it already.
xamlx = { workspace = true }
# The source scanner (docs/porting/xaml.md, 9.5.1): `syn` reads a source file into items, the
# bodies of the declaration macros are read from their tokens. `span-locations` gives the tokens
# the lines the diagnostics of the scanner name; `quote` prints the types of function signatures.
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit"] }
