[package]
name = "ferroui-markup-xaml"
description = "The FerroUI XAML runtime library: markup extensions, templates, includes, converters and the runtime helpers of compiled XAML"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The build script exports the type model of the crate (`build.rs`); Cargo hands the path of the file
# to the build scripts of the crates that depend on this one (`DEP_FERROUI_MARKUP_XAML_XAML_XAMLMETA`;
# docs/porting/xaml.md, 9.5.13 and 9.6.3).
build = "build.rs"
links = "ferroui_markup_xaml_xaml"

# Unit tests live next to the code (`*_tests.rs`, `mod tests`), not as
# integration test targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
# The performance counters of the base crate, which the counting site of this crate (dynamic
# resource expressions) counts into.
perf-counters = ["ferroui-base/perf-counters", "ferroui-controls/perf-counters"]

[dependencies]
# The runtime helpers of compiled XAML call the typed functions of the declared members, as
# generated code does (`xaml_il::runtime::compiled::add_setter`).
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }

[build-dependencies]
# The source scanner and the export of the type model: the standard library and `syn`, nothing of the
# framework.
ferroui-build-scan = { workspace = true }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "markup"
