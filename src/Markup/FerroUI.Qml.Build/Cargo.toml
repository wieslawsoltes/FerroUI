[package]
name = "ferroui-qml-build"
description = "Ahead-of-time QML compilation for Cargo build scripts and the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[features]
diagnostics = ["dep:ferroui-qml", "ferroui-qml/diagnostics"]
javascript = ["ferroui-qml-compiler/javascript"]

[dependencies]
ferroui-qml = { workspace = true, optional = true }
percent-encoding = "2"
ferroui-qml-compiler.workspace = true
proc-macro2 = "1"
quote = "1"
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }

[[bin]]
name = "ferroui-qmlc"
path = "main.rs"

[[bin]]
name = "ferroui-qml-debug"
path = "debug_main.rs"
required-features = ["diagnostics"]

[package.metadata.release]
group = "markup"

[[bench]]
name = "compiler"
harness = false
