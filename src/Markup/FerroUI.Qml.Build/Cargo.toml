[package]
name = "ferroui-qml-build"
description = "Ahead-of-time QML compilation for Cargo build scripts and the command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[features]
javascript = [
    "ferroui-qml-compiler/javascript",
    "dep:percent-encoding",
    "dep:swc_common",
    "dep:swc_ecma_ast",
    "dep:swc_ecma_parser",
    "dep:swc_ecma_transforms_base",
    "dep:swc_ecma_transforms_module",
    "dep:swc_ecma_codegen",
]

[dependencies]
percent-encoding = { version = "2", optional = true }
swc_common = { version = "27", optional = true }
swc_ecma_ast = { version = "30", optional = true }
swc_ecma_parser = { version = "47", default-features = false, optional = true }
swc_ecma_transforms_base = { version = "51", optional = true }
swc_ecma_transforms_module = { version = "58", optional = true }
swc_ecma_codegen = { version = "33", optional = true }
ferroui-qml-compiler.workspace = true
proc-macro2 = "1"
quote = "1"
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }

[[bin]]
name = "ferroui-qmlc"
path = "main.rs"

[package.metadata.release]
group = "markup"
