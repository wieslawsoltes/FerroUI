[package]
name = "ferroui-qml-compiler"
description = "Clean-room QML language frontend and component compiler for FerroUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
autotests = false

[lib]
path = "lib.rs"

[features]
javascript = ["dep:swc_common", "dep:swc_ecma_ast", "dep:swc_ecma_parser", "dep:swc_ecma_visit"]

[dependencies]
swc_common = { version = "27", optional = true }
swc_ecma_ast = { version = "30", optional = true }
swc_ecma_parser = { version = "47", default-features = false, optional = true }
swc_ecma_visit = { version = "30", optional = true }
serde = { workspace = true, features = ["derive"] }

[package.metadata.release]
group = "markup"
