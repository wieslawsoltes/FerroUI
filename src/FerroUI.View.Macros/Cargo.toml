[package]
name = "ferroui-view-macros"
description = "The rsx! and #[component] macros of ferroui-view, the declarative Rust API of FerroUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "controls"
