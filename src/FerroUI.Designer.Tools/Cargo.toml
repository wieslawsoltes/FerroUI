[package]
name = "ferroui-designer-tools"
description = "Portable panel layout adapters, property metadata, selection geometry and manipulation plans for FerroUI designers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# The designer crates are published from 0.5 (owner decision D6 of #345).
publish = false

[lib]
path = "lib.rs"

[[bench]]
name = "snapping"
harness = false

[dependencies]
ferroui-designer-core = { workspace = true }
serde = { version = "1", features = ["derive"] }

[package.metadata.release]
group = "tools"
