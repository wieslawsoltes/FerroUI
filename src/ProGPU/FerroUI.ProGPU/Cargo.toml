[package]
name = "ferroui-progpu"
description = "The ProGPU render backend: the render contracts of the base library on the native engine of ProGPU (WebGPU, its WGSL shaders and its text stack)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Until the bindings are published (wieslawsoltes/ProGPU#436).
publish = false

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
progpu-native-sys.workspace = true

# The Metal device and the Metal surfaces of the platform, which the engine draws windows into.
[target.'cfg(target_os = "macos")'.dependencies]
ferroui-metal.workspace = true

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
# The reference shaper the shaper of the engine is checked against.
ferroui-harfbuzz.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The offscreen Metal surface of the tests of the window target.
ferroui-metal = { workspace = true, features = ["offscreen"] }
# The example of a window (examples/progpu_window.rs) runs on the macOS platform.
ferroui-native.workspace = true
# The Metal device, queue and texture of a host, for the tests of the Metal interop.
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLCommandQueue", "MTLTexture", "MTLResource", "MTLPixelFormat", "MTLTypes", "MTLAllocation"] }
