[package]
name = "ferroui-designer-project"
description = "Portable FerroUI solution discovery, document buffers, resource URIs and cancellable build tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ferroui-build-scan = { workspace = true }
ferroui-designer-core = { workspace = true }
ferroui-reload-protocol.workspace = true
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "visit"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.release]
group = "tools"
