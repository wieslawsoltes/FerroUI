[package]
name = "ferroui-designer-project"
description = "Portable FerroUI solution discovery, document buffers, resource URIs and cancellable build tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ferroui-designer-core = { version = "=0.4.0", path = "../FerroUI.Designer.Core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.release]
group = "tools"
