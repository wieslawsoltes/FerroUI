[package]
name = "ferroui-ios"
description = "The iOS platform of FerroUI: a UIKit view, touch input and Metal and OpenGL ES graphics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
# The Metal contracts the platform implements.
ferroui-metal.workspace = true
# The OpenGL contracts the platform implements (OpenGL ES over EAGL).
ferroui-opengl.workspace = true
bitflags.workspace = true

# What the example shows its content with. Optional, behind the feature the example requires.
ferroui-themes-simple = { workspace = true, optional = true }

# The platform selects its renderer and its text shaper, as the original does (`use_ios`). Not in
# the documentation build of docs.rs, which sets the `ferroui_docsrs` configuration (`rustc-args`
# for Cargo and the compiler, `rustdoc-args` for the sources): on its Linux host neither HarfBuzz
# nor Skia builds for an iOS target, and the documentation needs neither (docs/release.md, section 7).
[target.'cfg(not(ferroui_docsrs))'.dependencies]
ferroui-harfbuzz.workspace = true
ferroui-skia.workspace = true

# The run loop of the main thread and the main dispatch queue (Core Foundation and libdispatch,
# declared in `interop.rs`) exist on every Apple system, which is what lets the dispatcher be
# tested on the development machine; `pthread_main_np` comes from the C library.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

# UIKit, Core Animation and Metal (docs/porting/ios-platform.md, section 2): the versions the
# lock file already had for the `wgpu` renderer of the Vello backend, with UIKit added.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "=0.6.5" }
block2 = { version = "=0.6.2" }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileCoordinator",
    "NSFileManager",
    "NSPathUtilities",
    "NSDate",
    "NSGeometry",
    "NSLocale",
    "NSNotification",
    "NSObjCRuntime",
    "NSObject",
    "NSOperation",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSThread",
    "NSURL",
    "NSUserActivity",
    "NSUUID",
    "NSValue",
    "NSZone",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-metal",
    "CADisplayLink",
    "CAFrameRateRange",
    "CALayer",
    "CAMetalLayer",
    "CATransaction",
] }
objc2-metal = { version = "=0.3.2", default-features = false, features = [
    "std",
    "MTLBlitCommandEncoder",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
# OpenGL ES over EAGL (docs/porting/ios-platform.md, section 7): the context, its share group, the
# drawable protocol of the layer and the storage and presentation of its renderbuffer.
objc2-open-gl-es = { version = "=0.3.2", default-features = false, features = [
    "std",
    "EAGL",
    "EAGLDrawable",
] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSText",
    "UIAccessibility",
    "UIAccessibilityConstants",
    "UIAccessibilityElement",
    "UIApplication",
    "UIColor",
    "UICommand",
    "UIConfigurationColorTransformer",
    "UIDevice",
    "UIDocument",
    "UIDocumentInteractionController",
    "UIDocumentPickerViewController",
    "UIEvent",
    "UIFeedbackGenerator",
    "UIGeometry",
    "UIGestureRecognizer",
    "UIGraphics",
    "UIGraphicsImageRenderer",
    "UIGraphicsRenderer",
    "UIImage",
    "UIImagePickerController",
    "UIImpactFeedbackGenerator",
    "UIInterface",
    "UIKey",
    "UIKeyConstants",
    "UILayoutGuide",
    "UINavigationController",
    "UIOpenURLContext",
    "UIOrientation",
    "UIPanGestureRecognizer",
    "UIPasteboard",
    "UIPresentationController",
    "UIPress",
    "UIPressesEvent",
    "UIResponder",
    "UIScene",
    "UISceneConfiguration",
    "UISceneDefinitions",
    "UISceneOptions",
    "UISceneSession",
    "UIScreen",
    "UIScrollView",
    "UITextInput",
    "UITextInputTraits",
    "UITextInteraction",
    "UITextView",
    "UITouch",
    "UITraitCollection",
    "UIUserActivity",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }

[features]
# Builds `examples/ios_view.rs`: a view with the Simple theme and the smoke mode.
example = ["dep:ferroui-themes-simple"]

[[example]]
name = "ios_view"
path = "examples/ios_view.rs"
required-features = ["example"]

# Runs the run loop of the main thread, which only the main thread can.
[[test]]
name = "dispatcher_main_loop"
path = "tests/dispatcher_main_loop.rs"
harness = false

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "platforms"

# The crate has its content on iOS only, so its documentation is the one of that target. The
# configuration `ferroui_docsrs` leaves out the renderer and the text shaper (see above).
[package.metadata.docs.rs]
default-target = "aarch64-apple-ios"
targets = ["aarch64-apple-ios", "aarch64-apple-ios-sim"]
rustc-args = ["--cfg", "ferroui_docsrs"]
rustdoc-args = ["--cfg", "ferroui_docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ferroui_docsrs)"] }
