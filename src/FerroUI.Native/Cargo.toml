[package]
name = "ferroui-native"
description = "The macOS platform of FerroUI: windows, input, clipboard, drag and drop, menus and Metal graphics over a native library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
# The about dialog of the application menu.
ferroui-dialogs.workspace = true
ferroui-microcom.workspace = true
# The Metal contracts the platform implements; which backend draws with them is the application's
# choice.
ferroui-metal.workspace = true

[dev-dependencies]
ferroui-harfbuzz.workspace = true
# The example of a window and the accessibility test draw with the Skia backend.
ferroui-skia.workspace = true

[build-dependencies]
cc.workspace = true
microcom-codegen.workspace = true

[[example]]
name = "raw_window"
path = "examples/raw_window.rs"

[[example]]
name = "platform_window"
path = "examples/platform_window.rs"

# Creates a window, which AppKit only allows on the main thread.
[[test]]
name = "accessibility_tree"
path = "tests/accessibility_tree.rs"
harness = false

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "platforms"

# The crate is empty on every target but macOS, so its documentation is the one of that target.
[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
