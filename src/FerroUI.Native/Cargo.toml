[package]
name = "ferroui-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
# The about dialog of the application menu.
ferroui-dialogs.workspace = true
ferroui-microcom.workspace = true
ferroui-skia.workspace = true

[dev-dependencies]
ferroui-harfbuzz.workspace = true

[build-dependencies]
cc.workspace = true
microcom-codegen = { path = "../tools/MicroCom.CodeGenerator" }

[[example]]
name = "raw_window"
path = "examples/raw_window.rs"

[[example]]
name = "platform_window"
path = "examples/platform_window.rs"

# Creates a window, which AppKit only allows on the main thread.
[[test]]
name = "accessibility_tree"
path = "tests/accessibility_tree.rs"
harness = false
