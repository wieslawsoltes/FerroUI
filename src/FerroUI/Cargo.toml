[package]
name = "ferroui"
description = "FerroUI in one dependency: the facade crate that re-exports the common crates under short names, with a prelude and features that choose the platform, the theme and the backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

# What each feature brings is the table of docs/release.md, section 2.1. The facade has no code of
# its own: every module of the crate is a re-export of one crate of the workspace, under the name of
# that crate without the `ferroui-` prefix.
[features]
default = ["desktop", "fluent"]
# The desktop entry point (`use_platform_detect`): the platform of the operating system (macOS,
# Windows or X11 on Linux), Skia for rendering and HarfBuzz for text shaping.
desktop = ["dep:ferroui-desktop", "dep:ferroui-skia", "dep:ferroui-harfbuzz", "dep:ferroui-native", "dep:ferroui-win32", "dep:ferroui-x11"]
# The themes.
fluent = ["dep:ferroui-themes-fluent"]
simple = ["dep:ferroui-themes-simple"]
winui-theme = ["dep:ferroui-themes-winui"]
# The XAML run-time library and the run-time loader of markup.
xaml = ["dep:ferroui-markup-xaml", "dep:ferroui-markup-xaml-loader"]
# The libraries of controls beside the control set.
color-picker = ["dep:ferroui-controls-color-picker"]
charts = ["dep:ferroui-controls-charts"]
inking = ["dep:ferroui-controls-inking"]
treedatagrid = ["dep:ferroui-controls-treedatagrid", "dep:ferroui-treedatagrid-core"]
dialogs = ["dep:ferroui-dialogs"]
# The developer tools (F12 on a window or an application in debug builds).
diagnostics = ["dep:ferroui-diagnostics"]
# Localhost CDP inspection and automation; no listener starts until explicitly requested.
# The endpoint on native targets, the JavaScript bridge in the browser (each feature is gated to
# its target inside the crate).
devtools = ["dep:ferroui-devtools", "ferroui-devtools/browser"]
# The reactive foundation (docs/mvvm.md): Rx, DynamicData, and ReactiveUI with its integration
# with the controls and Splat.
reactive = ["dep:ferroui-system", "dep:ferroui-reactive"]
dynamic-data = ["reactive", "dep:ferroui-dynamic-data"]
reactiveui = ["reactive", "dep:ferroui-splat", "dep:ferroui-reactiveui", "dep:ferroui-reactiveui-controls"]
# The browser platform (wasm32-unknown-emscripten), with Skia and HarfBuzz as on the desktop.
browser = ["dep:ferroui-browser", "dep:ferroui-skia", "dep:ferroui-harfbuzz"]
# The Vello render backend: its CPU mode, and its two GPU modes.
vello = ["dep:ferroui-vello"]
vello-hybrid = ["vello", "ferroui-vello/hybrid"]
vello-gpu = ["vello", "ferroui-vello/gpu"]
# The headless platform, for tests.
headless = ["dep:ferroui-headless"]
# The platform graphics contracts, for a control that draws with the graphics API itself.
opengl = ["dep:ferroui-opengl"]
metal = ["dep:ferroui-metal"]
vulkan = ["dep:ferroui-vulkan"]

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-markup.workspace = true
ferroui-desktop = { workspace = true, optional = true }
ferroui-skia = { workspace = true, optional = true }
ferroui-harfbuzz = { workspace = true, optional = true }
ferroui-themes-fluent = { workspace = true, optional = true }
ferroui-themes-simple = { workspace = true, optional = true }
ferroui-themes-winui = { workspace = true, optional = true }
ferroui-markup-xaml = { workspace = true, optional = true }
ferroui-markup-xaml-loader = { workspace = true, optional = true, features = ["runtime"] }
ferroui-controls-color-picker = { workspace = true, optional = true }
ferroui-controls-charts = { workspace = true, optional = true }
ferroui-controls-inking = { workspace = true, optional = true }
ferroui-controls-treedatagrid = { workspace = true, optional = true }
ferroui-treedatagrid-core = { workspace = true, optional = true }
ferroui-dialogs = { workspace = true, optional = true }
ferroui-diagnostics = { workspace = true, optional = true }
ferroui-devtools = { workspace = true, optional = true, features = ["server"] }
ferroui-system = { workspace = true, optional = true }
ferroui-reactive = { workspace = true, optional = true }
ferroui-dynamic-data = { workspace = true, optional = true }
ferroui-splat = { workspace = true, optional = true }
ferroui-reactiveui = { workspace = true, optional = true }
ferroui-reactiveui-controls = { workspace = true, optional = true }
ferroui-browser = { workspace = true, optional = true }
ferroui-vello = { workspace = true, optional = true }
ferroui-headless = { workspace = true, optional = true }
ferroui-opengl = { workspace = true, optional = true }
ferroui-metal = { workspace = true, optional = true }
ferroui-vulkan = { workspace = true, optional = true }

# The platforms `desktop` selects among, each on its operating system (as `ferroui-desktop` has them).
[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
ferroui-win32 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ferroui-x11 = { workspace = true, optional = true }

[[example]]
name = "hello"
path = "examples/hello.rs"
required-features = ["desktop", "fluent"]

# docs.rs documents the default features with the libraries that need no more than the host
# (docs/release.md, section 7).
[package.metadata.docs.rs]
features = ["simple", "winui-theme", "xaml", "color-picker", "charts", "inking", "treedatagrid", "dialogs", "diagnostics", "reactive", "dynamic-data", "reactiveui", "headless", "opengl", "metal", "vulkan"]

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "core"
