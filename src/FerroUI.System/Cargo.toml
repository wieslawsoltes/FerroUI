[package]
name = "ferroui-system"
description = "The parts of the .NET base class library that FerroUI and its reusable libraries share: thread-local variables for every target, events, property and collection change notification, cancellation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Unit tests live in `tests/` as a module tree of the library (`mod tests;`), not as integration test
# targets.
autotests = false

[lib]
path = "lib.rs"

[dependencies]
smallvec = { workspace = true }
# The value types of other crates that properties of FerroUI hold: `StyledValue` is stated for them
# here, where the trait is (`styled_value.rs`). `ferroui-base` enables both.
icu_locale_core = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[features]
# `StyledValue` for `icu_locale_core::Locale`.
locale = ["dep:icu_locale_core"]
# `StyledValue` for `url::Url`.
url = ["dep:url"]

# `--cfg ferro_tls_table` makes every `ferro_thread_local!` of a build use the table of the Android
# targets on a Linux or macOS host, so that test suites run against it (`ferro_thread_local.rs`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ferro_tls_table)"] }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "core"
