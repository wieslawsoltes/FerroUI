[package]
name = "ferroui-winui"
description = "FerroUI content inside a WinUI 3 (Windows App SDK) application: a swap chain panel with pointer, keyboard and text input, cursors, drag and drop and automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The build script generates the bindings of the interfaces of the Windows Runtime from the
# interface definition file of the crate (`build.rs`).
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
# The swap chain surface and the top-level of a host, the cursors, the key tables and the string
# handles of the Windows Runtime. The rendering mode (ANGLE, the default feature of the backend) is
# the application's choice: this crate compiles against the backend without it.
ferroui-win32.workspace = true
# The COM runtime of the bindings the build script generates.
ferroui-microcom.workspace = true

# The functions of the system the integration calls: declarations only, linked through
# `windows-link`, so the crate is checked for a Windows target on any host.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The tests of the CoreText host install a RichEditBox, a client of the exact-edit input
# connection, on the windowing platform of the unit tests of the controls.
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }

[build-dependencies]
# The port's MicroCom generator: the standard library alone.
microcom-codegen.workspace = true

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "platforms"
