[package]
name = "ferroui-browser"
description = "The browser platform of FerroUI: a top-level in an element of a web page, rendered with WebGL or to a 2D canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-opengl.workspace = true
ferroui-skia.workspace = true
ferroui-harfbuzz.workspace = true
wasm-bindgen.workspace = true
# The second render backend (feature `vello`): its CPU mode, and its hybrid mode over the WebGL2
# context of a canvas.
ferroui-vello = { workspace = true, optional = true, features = ["hybrid-webgl"] }

# The Vello render backend beside Skia, chosen at start with `BrowserPlatformOptions::renderer`
# (docs/porting/vello-backend.md, section 12). Off by default: it adds the renderers of the Vello
# project to the module.
[features]
default = []
vello = ["dep:ferroui-vello"]

[dev-dependencies]
# The example shows a themed view with the embedded default font.
ferroui-themes-fluent.workspace = true
ferroui-fonts-inter.workspace = true

[[example]]
name = "themed_view"
path = "examples/themed_view/main.rs"

[[example]]
name = "storage_view"
path = "examples/storage_view/main.rs"

# A page of the threaded build (scripts/build-browser.sh render_worker_clear --threads).
[[example]]
name = "render_worker_clear"
path = "examples/render_worker_clear/main.rs"

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "platforms"
