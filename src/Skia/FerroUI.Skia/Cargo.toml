[package]
name = "ferroui-skia"
description = "The Skia render backend of FerroUI: Graphite on Metal, Ganesh on WebGL and raster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
# The fonts and images of the tests (about 32 MB; crates.io accepts 10 MB) stay out of the package.
# Nothing but the tests reads them.
exclude = ["test_assets/"]

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-opengl.workspace = true
ferroui-metal.workspace = true
ferroui-vulkan.workspace = true
skia-safe.workspace = true

[dev-dependencies]
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-fonts-inter.workspace = true
ferroui-harfbuzz.workspace = true

# Compiles emscripten/emscripten_sjlj.cpp for the browser target (see build.rs).
[build-dependencies]
cc.workspace = true

# The GPU back end of Skia is chosen per target, because the published Skia
# binaries carry one of them: Graphite on Metal for Apple platforms, Ganesh on
# WebGL for the browser, Ganesh on OpenGL ES (ANGLE) for Windows, Ganesh on
# OpenGL (GLX or EGL) for Linux, Ganesh on OpenGL ES (EGL) for Android. Raster
# is always present. `build.rs` mirrors the tables with Ganesh on OpenGL as the
# `ferro_skia_ganesh_gl` configuration.
[target.'cfg(all(target_vendor = "apple", not(ferro_skia_apple_ganesh)))'.dependencies]
skia-safe = { workspace = true, features = ["graphite", "metal"] }

# Apple targets with OpenGL: the rendering mode OpenGL of the macOS backend (CGL) and of the iOS
# backend (EAGL) needs Ganesh on OpenGL, and no published binary of Skia has Ganesh on OpenGL next
# to Graphite (docs/porting/apple-opengl.md, section 2). The configuration
# `ferro_skia_apple_ganesh`, given with `RUSTFLAGS="--cfg ferro_skia_apple_ganesh"`, builds the
# backend with Ganesh on OpenGL and on Metal instead: the binary `ganesh-gl-jpegd-jpege-metal-pdf`
# is published for both macOS targets and for the iOS targets. Cargo evaluates the configuration
# of a target table with the flags of the compiler, so the flag picks the table.
[target.'cfg(all(target_vendor = "apple", ferro_skia_apple_ganesh))'.dependencies]
skia-safe = { workspace = true, features = ["gl", "metal"] }

[target.'cfg(target_os = "emscripten")'.dependencies]
skia-safe = { workspace = true, features = ["gl"] }

# Windows: the bindings have no Direct3D back end of Graphite, and the rendering mode the Windows
# backend offers first is OpenGL ES through ANGLE (docs/porting/win32-platform.md, section 6.2).
# A binary of Skia with this feature set is published for the target (the Windows job of CI asks).
[target.'cfg(windows)'.dependencies]
skia-safe = { workspace = true, features = ["gl"] }

# Linux: the rendering modes of the X11 backend are GLX, EGL and Vulkan (docs/porting/x11-platform.md,
# section 4; docs/porting/vulkan.md, section 2). `gl` and `vulkan`, not the features `x11`, `egl`
# and `wayland` of the bindings: those add the window system libraries Skia would create its own
# interface with, and the backend gives Skia the entry points of the context or device the
# platform created. A binary of Skia with this feature set is published for x86-64 and for ARM64
# (the job `x11` of CI asks). `build.rs` mirrors `vulkan` as the `ferro_skia_vulkan` configuration.
# Graphite and Ganesh have separate upstream binary distributions on Linux.
[target.'cfg(all(target_os = "linux", ferro_skia_graphite_vulkan))'.dependencies]
skia-safe = { workspace = true, features = ["graphite", "vulkan"] }

[target.'cfg(all(target_os = "linux", not(ferro_skia_graphite_vulkan)))'.dependencies]
skia-safe = { workspace = true, features = ["gl", "vulkan"] }

# Android: the rendering mode the Android backend offers first is OpenGL ES through the EGL of the
# system (docs/porting/android-platform.md, section 6). A binary of Skia with this feature set is
# published for the target.
[target.'cfg(target_os = "android")'.dependencies]
skia-safe = { workspace = true, features = ["gl"] }

# The Vulkan GPU on a headless surface of the Vulkan implementation of the machine. An empty test
# without the `ferro_skia_vulkan` configuration.
[[test]]
name = "vulkan_frames"
path = "gpu/vulkan/frames_test.rs"

[features]
# The Vulkan GPU of the backend (`gpu/vulkan`) on a target whose table above does not have it: Skia
# with Ganesh on Vulkan. Off by default. On Linux the GPU is always built and the feature changes
# nothing. A binary of Skia with the resulting feature set is published for Android; on Windows
# and on Apple targets there is none, and the bindings then compile Skia from source
# (docs/porting/vulkan.md, section 2).
vulkan = ["skia-safe/vulkan", "skia-safe/ganesh"]

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "rendering"
