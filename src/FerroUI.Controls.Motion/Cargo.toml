[package]
name = "ferroui-controls-motion"
description = "The motion controls of FerroUI: ParallaxView of WinUI, on the composition API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The build script exports the type model of the crate; Cargo hands it to the build scripts of
# the crates that depend on this one (docs/porting/xaml.md).
links = "ferroui_controls_motion_xaml"

[lib]
path = "lib.rs"

[dependencies]
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }

[build-dependencies]
ferroui-build-scan = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "controls"
