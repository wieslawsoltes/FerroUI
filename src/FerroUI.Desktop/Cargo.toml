[package]
name = "ferroui-desktop"
description = "The desktop entry point of FerroUI: platform detection with the default render and text shaping backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[features]
default = ["skia"]
skia = ["dep:ferroui-skia", "dep:ferroui-harfbuzz", "ferroui-win32/angle"]
direct2d = ["dep:ferroui-direct2d", "ferroui-win32/native-d3d11"]
# Experimental macOS 13+ system text and drawing backend.
quartz = ["dep:ferroui-quartz"]
quartz-metal = ["quartz", "ferroui-quartz/metal"]
quartz-runtime-shaders = ["quartz-metal", "ferroui-quartz/runtime-shaders"]

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-skia = { workspace = true, optional = true }
ferroui-harfbuzz = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native.workspace = true
ferroui-quartz = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
ferroui-win32 = { workspace = true, default-features = false }
ferroui-direct2d = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ferroui-x11.workspace = true

[dev-dependencies]
# The example opens a window before the compositing renderer exists and
# says so; see examples/hello_window.rs.
ferroui-controls = { workspace = true, features = ["testing"] }

[[example]]
name = "hello_window"
path = "examples/hello_window.rs"

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "platforms"
