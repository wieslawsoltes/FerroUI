[package]
name = "ferroui-textmate"
description = "TextMate grammars, incremental tokenization, themes and language resources for FerroUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[lib]
path = "lib.rs"

[features]
default = ["native-onig", "bundled-grammars"]
native-onig = ["dep:onig"]
# Select the explicitly named Rust backend on native hosts for differential tests.
portable-regex = []
bundled-grammars = []

[dependencies]
ferroui-system.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "=0.19.2"
roxmltree.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
onig = { version = "=6.5.3", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
wasm-bindgen-futures = "=0.4.79"

[package.metadata.release]
group = "controls"

[[example]]
name = "textmate_browser_conformance"
path = "examples/browser_conformance.rs"
crate-type = ["cdylib"]
