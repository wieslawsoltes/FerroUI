[package]
name = "ferroui-controls-webview"
description = "The WebView2 control of FerroUI: a native web engine of each platform as a child of the window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
links = "ferroui_controls_webview_xaml"
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[dependencies]
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls.workspace = true
ferroui-system.workspace = true

# WebKit itself is loaded at run time, with the first web view.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true
objc2 = { version = "=0.6.5" }
block2 = { version = "=0.6.2" }

# The WebView2 runtime is reached through its loader library, found at run time.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# The Java class is added by `packaging.gradle`; without it the control reports `Unavailable`.
[target.'cfg(target_os = "android")'.dependencies]
ferroui-android.workspace = true

# WebKitGTK and GTK are opened at run time, with the first web view.
[target.'cfg(target_os = "linux")'.dependencies]
ferroui-x11.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ferroui-browser.workspace = true
wasm-bindgen.workspace = true

[build-dependencies]
ferroui-build-scan.workspace = true

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime"] }

# A real engine in a run loop; see the file for how to run it.
[[test]]
name = "engine"
path = "engine_apple_test.rs"
harness = false

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "controls"
