[package]
name = "ferroui-static-view-locator-build"
description = "The generator of ferroui-static-view-locator: the build-script part that maps the view models of a crate to its views and writes the locators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "mvvm", "view-locator", "build", "codegen"]
categories = ["gui", "development-tools::build-utils"]

# Unit tests live next to the code (the `tests/` module of the library), not as integration test
# targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

# A build dependency of the crates that declare locators: the scanner of the framework (the views,
# their base classes and constructors, the paths of the crate) and the crates the items of the
# sources are read with. Nothing of the framework is linked.
[dependencies]
ferroui-build-scan = { workspace = true }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "markup"
