[package]
name = "ferroui-render3d"
description = "The renderer of FerroUI's 3D scenes: the CPU reference rasterizer, the shader and the wgpu executor, the shared uniform layouts and the output cache of Viewport3D"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# With the feature `msl`: the shader in the Metal Shading Language, translated by naga at build
# time (`build.rs`); without it the script does nothing.
build = "build.rs"

# Unit tests live next to the code (`#[path = "..._tests.rs"]` modules of the library), not as
# integration test targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[dependencies]
# The base library: the compiled form of a scene (`rendering::scene3d`), the numerics, the
# brushes of the material layers and the logger.
ferroui-base.workspace = true
# The executor of the GPU modes of the Vello backend (feature `wgpu`, step D4).
wgpu = { workspace = true, optional = true }

[features]
default = []
# The wgpu executor (`wgpu_executor`): `ferroui-vello` turns it on with its GPU modes and `media3d`.
wgpu = ["dep:wgpu"]
# The shader in the Metal Shading Language (`shader::msl`, step D5), for the Metal executor of
# `ferroui-metal` (feature `scene3d`) that the Skia backend draws with on Graphite. naga runs in the
# build script only: nothing of it is linked.
msl = ["dep:naga"]

[build-dependencies]
naga = { workspace = true, features = ["wgsl-in", "msl-out"], optional = true }

[dev-dependencies]
# The validation of `shaders/scene3d.wgsl` and its translation to GLSL ES 3.00 for WebGL2.
naga = { workspace = true, features = ["wgsl-in", "glsl-out"] }
# The mock platform of the base library: the geometry of the drawing brushes of the tests.
ferroui-base = { workspace = true, features = ["testing"] }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "rendering"
