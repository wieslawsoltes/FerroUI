[package]
name = "ferroui-themes-simple"
description = "The FerroUI Simple theme: control themes and resources for the control set, in light and dark variants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

# Unit tests live next to the code (`tests/` modules of the library), not as
# integration test targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
# Leaves the documents the compiled markup of the theme is generated from out of the embedded
# assets, as upstream's compiler removes compiled resources from the assembly (see build.rs). A
# document of the theme can then not be loaded by URI with the run-time loader; the class of the
# theme is still created by its compiled markup. For the browser, where the WebAssembly module is
# downloaded and has a size budget.
remove-compiled-documents = []

[dependencies]
# The compiled markup of the theme (`compiled_xaml.rs`) calls the typed functions of the declared
# members, which exist with this feature (docs/porting/xaml-compiler/HANDOVER.md, section 7, "Cost";
# `compiler-metadata`, what only the emitter reads, is a feature of the tests alone).
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
# The managed dialogs, whose control themes are part of the theme (as the upstream project reference).
ferroui-dialogs = { workspace = true }
ferroui-markup-xaml = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
# The theme is loaded from its compiled markup (`compiled_xaml.rs`); the run-time XAML loader and
# its emitter generate that file and check it (`tests/compiled_xaml_tests.rs`), and the tests load
# documents at run time.
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "testing", "emitter"] }
# The example starts a desktop application with a theme (the role of a sample application,
# which references the desktop package and the themes; no library references another).
ferroui-desktop = { workspace = true }
ferroui-themes-fluent = { workspace = true }

[[example]]
name = "themed_window"
path = "examples/themed_window.rs"
