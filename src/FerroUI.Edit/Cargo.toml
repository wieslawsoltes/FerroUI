[package]
name = "ferroui-edit"
description = "FerroUI code editor control with virtualized text layout, document services and TextMate highlighting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "ferroui_edit_xaml"

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-edit-core.workspace = true
ferroui-textmate.workspace = true

[build-dependencies]
ferroui-build-scan.workspace = true

[dev-dependencies]
ferroui-markup-xaml.workspace = true
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "testing"] }

[package.metadata.release]
group = "controls"
