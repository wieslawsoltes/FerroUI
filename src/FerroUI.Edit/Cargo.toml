[package]
name = "ferroui-edit"
description = "FerroUI code editor control with virtualized text layout, document services and TextMate highlighting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
links = "ferroui_edit_xaml"

[lib]
path = "lib.rs"

[dependencies]
# Exchanges the editor's selection markers with browsers through the platform clipboard.
ferroui-base = { workspace = true, features = ["chromium-clipboard-map"] }
ferroui-controls.workspace = true
ferroui-edit-core.workspace = true
ferroui-textmate.workspace = true
tokio = { version = "1", default-features = false, features = ["sync"] }
url.workspace = true

# VoiceOver reads and selects the editor's text through the text ranges of the macOS backend,
# which only applications that link the editor compile (docs/binary-size.md, section 4.33).
[target.'cfg(target_os = "macos")'.dependencies]
ferroui-native = { workspace = true, features = ["text-editor"] }

[build-dependencies]
ferroui-build-scan.workspace = true

[dev-dependencies]
ferroui-markup-xaml.workspace = true
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "testing"] }

[package.metadata.release]
group = "controls"
