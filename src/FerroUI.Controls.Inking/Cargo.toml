[package]
name = "ferroui-controls-inking"
description = "The inking controls of FerroUI, a port of WinUI's: InkCanvas, the InkPresenter services, stencils, custom drying, InkToolbar with its WinUI theme, the portable ink format and the clipboard, and the ink services of Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
# The build script compiles the theme documents of the crate and exports its type model with them;
# Cargo hands the path of the file to the build scripts of the crates that depend on this one
# (docs/porting/xaml.md, 9.5.13 and 9.6.3): an application whose documents name the types of the
# library and include its styles.
links = "ferroui_controls_inking_xaml"
# Unit tests live next to the code, not as integration test targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
# The theme documents are also embedded as assets of the assembly, next to their compiled markup,
# for an application that loads its own markup at run time and includes the styles of the library.
document-assets = []

[dependencies]
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
# The runtime library of the compiled theme documents.
ferroui-markup-xaml = { workspace = true }
# The theme documents key their high-contrast dictionaries by the variant of the WinUI theme.
ferroui-themes-winui = { workspace = true }
bitflags = { workspace = true }
# The COM runtime of the bindings of the ink services of Windows the build script generates
# (`windows_ink_interop.rs`), which compile, and are tested, on every host.
ferroui-microcom = { workspace = true }

# The ink services of Windows (`windows_ink_services.rs`): WinRT activation and the apartment of the
# UI thread through the Windows backend, and the COM allocator.
[target.'cfg(windows)'.dependencies]
ferroui-win32 = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_System_Com"] }

[build-dependencies]
ferroui-build = { workspace = true }
# The port's MicroCom generator: the standard library alone.
microcom-codegen = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "testing"] }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "controls"
