[package]
name = "ferroui-controls"
description = "The controls of FerroUI: the application model, top levels, the control set and automation peers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The build script exports the type model of the crate (`build.rs`); Cargo hands the path of the file
# to the build scripts of the crates that depend on this one (`DEP_FERROUI_CONTROLS_XAML_XAMLMETA`;
# docs/porting/xaml.md, 9.5.13 and 9.6.3).
build = "build.rs"
links = "ferroui_controls_xaml"

[lib]
path = "lib.rs"

[[test]]
name = "winui_navigation"
path = "tests/winui_navigation.rs"
required-features = ["testing"]

[[test]]
name = "winui_navigation_view"
path = "tests/winui_navigation_view.rs"
required-features = ["testing"]

[[test]]
name = "winui_navigation_items"
path = "tests/winui_navigation_items.rs"
required-features = ["testing"]

[[test]]
name = "winui_number_box"
path = "tests/winui_number_box.rs"
required-features = ["testing"]

[dependencies]
# The hasher of identity-keyed maps on hot paths (the anchor candidates of a scroll presenter).
rustc-hash = { workspace = true }
ferroui-base.workspace = true
# The `ObservableCollection` of the base class library subset, which an items control reads
# (`items_source.rs`).
ferroui-system = { workspace = true }
# The messages and the connections of remote rendering (`remote`).
ferroui-remote-protocol.workspace = true
bitflags.workspace = true

[features]
# Test doubles (mock windowing platform, unit-test application) for the tests
# of this crate and of the crates built on it.
testing = ["ferroui-base/testing"]
# The performance counters of the base crate, which the counting sites of this crate (container
# recycling, the child of a content presenter) count into.
perf-counters = ["ferroui-base/perf-counters"]

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }

[build-dependencies]
# The source scanner and the export of the type model: the standard library and `syn`, nothing of the
# framework.
ferroui-build-scan = { workspace = true }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "controls"

[[test]]
name = "winui_icons"
path = "tests/winui_icons.rs"
required-features = ["testing"]

[[test]]
name = "winui_radio_buttons"
path = "tests/winui_radio_buttons.rs"
required-features = ["testing"]

[[test]]
name = "winui_icon_sources"
path = "tests/winui_icon_sources.rs"
required-features = ["testing"]

[[test]]
name = "winui_info_bar"
path = "tests/winui_info_bar.rs"
required-features = ["testing"]

[[test]]
name = "winui_auto_suggest_box"
path = "tests/winui_auto_suggest_box.rs"
required-features = ["testing"]

[[test]]
name = "winui_progress_ring"
path = "tests/winui_progress_ring.rs"
required-features = ["testing"]

[[test]]
name = "winui_info_badge"
path = "tests/winui_info_badge.rs"
required-features = ["testing"]

[[test]]
name = "winui_rating_control"
path = "tests/winui_rating_control.rs"
required-features = ["testing"]
