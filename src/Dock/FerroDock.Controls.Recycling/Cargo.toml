[package]
name = "ferrodock-controls-recycling"
description = "Native content control recycling for FerroDock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"
links = "ferrodock_controls_recycling_metadata"

[lib]
path = "lib.rs"

[dependencies]
ferrodock-controls-recycling-model-ferro.workspace = true
ferrodock-runtime.workspace = true
ferrodock-controls-recycling-model.workspace = true
ferroui-system.workspace = true
ferroui-base.workspace = true
ferroui-controls.workspace = true

[build-dependencies]
ferroui-build-scan.workspace = true

[dev-dependencies]
ferroui-headless = { workspace = true, features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
