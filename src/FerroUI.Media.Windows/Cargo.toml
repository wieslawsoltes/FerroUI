[package]
name = "ferroui-media-windows"
description = "Media Foundation DXGI storage and compatible ANGLE device interop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
[lib]
path = "lib.rs"
[dependencies]
ferroui-base.workspace = true
ferroui-media.workspace = true
ferroui-media-opengl.workspace = true
ferroui-opengl.workspace = true
[build-dependencies]
cc.workspace = true
[target.'cfg(windows)'.dev-dependencies]
ferroui-win32 = { workspace = true, features = ["angle"] }
[features]
controls = ["ferroui-media-opengl/controls"]
native-frame-tests = []
[package.metadata.release]
group = "platforms"
