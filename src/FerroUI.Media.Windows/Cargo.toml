[package]
name = "ferroui-media-windows"
description = "Media Foundation DXGI storage and compatible ANGLE device interop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
[lib]
path = "lib.rs"
[dependencies]
ferroui-base.workspace = true
ferroui-media.workspace = true
ferroui-media-opengl.workspace = true
ferroui-opengl.workspace = true
ferroui-direct2d = { workspace = true, optional = true }
ferroui-win32 = { workspace = true, features = ["angle"], optional = true }
[build-dependencies]
cc.workspace = true
[features]
controls = ["ferroui-media-opengl/controls"]
direct2d = ["dep:ferroui-direct2d"]
native-frame-tests = ["dep:ferroui-win32"]
synthetic-camera = []
[package.metadata.release]
group = "platforms"
