[package]
name = "ferroui-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The build script exports the type model of the crate (`build.rs`); Cargo hands the path of the file
# to the build scripts of the crates that depend on this one (`DEP_FERROUI_BASE_XAML_XAMLMETA`;
# docs/porting/xaml.md, 9.5.13 and 9.6.3).
build = "build.rs"
links = "ferroui_base_xaml"

# Unit tests live in `tests/` as a module tree of the library (`mod tests;`),
# not as integration test targets.
autotests = false

[lib]
path = "lib.rs"

[features]
# Exposes the render test doubles in `rendering::testing` to other crates.
testing = []
# The typed functions of declared members (`__markup_*`, written by the declaration macros),
# which code generated by the markup compiler calls: a crate that compiles generated code
# enables this feature, nothing more.
markup-functions = []
# What only the emitter of Rust source of the markup compiler reads: the names of the typed
# functions in the metadata (`MarkupEmit`, `MarkupType::this` / `value`), the public Rust
# paths of types and the accessor functions of property definitions
# (`metadata::property_accessors`). Applications do not enable it and pay nothing for it.
compiler-metadata = ["markup-functions"]
# The performance counters (`diagnostics::perf_counters`): property changes raised and listened
# to, virtual calls by member, styles evaluated and matched, resource lookups, bindings and text
# layouts created. For measuring only: without the feature the counting sites are no code and
# no type has a field for them.
perf-counters = []
# A word beside the pointer of every weak reference to an object (`WeakRef`) that marks it as
# one (`type_system::WEAK_REFERENCE_TAG`), for a reader of the memory of the process: the
# allocation trace of the tests of the ControlCatalog finds the blocks that point at an object
# that should have been freed, and tells the weak references from the one that keeps it alive
# by the mark. For measuring only: a weak reference is one word larger with it.
tagged-weak-references = []

[dependencies]
bitflags.workspace = true
paste.workspace = true
rust_decimal.workspace = true
time.workspace = true

[build-dependencies]
# The source scanner and the export of the type model: the standard library and `syn`, nothing of the
# framework.
ferroui-build-scan = { workspace = true }
