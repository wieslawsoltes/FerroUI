[package]
name = "ferroui-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Unit tests live in `tests/` as a module tree of the library (`mod tests;`),
# not as integration test targets.
autotests = false

[lib]
path = "lib.rs"

[features]
# Exposes the render test doubles in `rendering::testing` to other crates.
testing = []
# Records, when a type registers its properties, which accessor function returns each
# property definition (`metadata::property_accessors`). Only the emitter of Rust source of
# the markup compiler reads it; applications do not enable it and pay nothing for it.
compiler-metadata = []

[dependencies]
bitflags.workspace = true
paste.workspace = true
rust_decimal.workspace = true
time.workspace = true
