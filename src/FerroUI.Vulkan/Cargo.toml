[package]
name = "ferroui-vulkan"
description = "The Vulkan platform contracts of FerroUI: the instance, the device, the graphics context, the swap chain render target of a surface and the import of external objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ash.workspace = true
# The 3D scenes of the Skia backend on Ganesh Vulkan (feature `scene3d`, #608 D9).
ferroui-render3d = { workspace = true, features = ["spirv"], optional = true }

[features]
# The Vulkan executor of 3D scenes (`scene3d`, #608 D9), which `ferroui-skia/media3d` turns on.
scene3d = ["dep:ferroui-render3d"]

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "rendering"
