[package]
name = "ferroui-protranslate-core"
description = "Framework-independent translation, culture and globalization services for FerroUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
icu_locale = "2.1"
icu_decimal = { version = "2.1", features = ["alloc"] }
icu_calendar = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_datetime = { version = "2.4", default-features = false, features = ["compiled_data"] }
fixed_decimal = { version = "0.7", features = ["ryu"] }
writeable = "0.6"

time = { workspace = true }

[package.metadata.release]
group = "core"
