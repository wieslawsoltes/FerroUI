[package]
name = "ferroui-opengl"
description = "The OpenGL platform contracts of FerroUI: contexts, surfaces and the entry points the framework itself uses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# The build script exports the type model of the crate (`build.rs`); Cargo hands the path of the file
# to the build scripts of the crates that depend on this one (`DEP_FERROUI_OPENGL_XAML_XAMLMETA`;
# docs/porting/xaml.md, 9.5.13 and 9.6.3): the documents of an application name the OpenGL control.
build = "build.rs"
links = "ferroui_opengl_xaml"

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
# The OpenGL control is a control: the upstream project references the controls project.
ferroui-controls.workspace = true
paste.workspace = true

[build-dependencies]
# The source scanner and the export of the type model: the standard library and `syn`, nothing of the
# framework.
ferroui-build-scan = { workspace = true }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "rendering"
