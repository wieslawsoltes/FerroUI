[package]
name = "ferroui-dialogs"
description = "The managed dialogs of FerroUI: the managed file chooser, the managed storage provider and the about dialog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
# The build script compiles the markup of the crate and exports its type model with it; Cargo hands
# the path of the file to the build scripts of the crates that depend on this one
# (`DEP_FERROUI_DIALOGS_XAML_XAMLMETA`; docs/porting/xaml.md, 9.5.13 and 9.6.3): the themes, whose
# documents name the types of the dialogs.
links = "ferroui_dialogs_xaml"

# Unit tests live next to the code (`tests/` modules of the library), not as
# integration test targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[dependencies]
# The compiled markup of the crate calls the typed functions of the declared members, which exist
# with this feature.
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
# The runtime library of compiled markup. The crate does not link the run-time XAML loader.
ferroui-markup-xaml = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The mounted volumes of the file system (the drive list of the .NET base library); the browser
# has no mounted volumes.
sysinfo = { workspace = true }

[build-dependencies]
# The build script compiles the document of the about dialog against the type models (`build.rs`):
# the compiler, which reads the types from the scan of the sources of this crate and from the models
# the crates it is built on export. It links no crate for its types.
ferroui-build = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "controls"
