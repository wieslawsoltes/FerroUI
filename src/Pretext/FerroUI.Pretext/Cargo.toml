[package]
name = "ferroui-pretext"
description = "Reusable text preparation, Unicode wrapping and rich inline layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# The differential oracle of the tests (1.3 MB) stays out of the package.
exclude = ["fixtures/"]
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[package.metadata.release]
group = "rendering"

[dependencies]
ferroui-pretext-contracts.workspace = true
unicode-segmentation = "1.12"
unicode-general-category = "1"
icu_segmenter.workspace = true
icu_locale_core.workspace = true
icu_properties.workspace = true

[dev-dependencies]
serde_json = "1"
