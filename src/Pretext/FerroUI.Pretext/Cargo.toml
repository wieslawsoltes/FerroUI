[package]
name = "ferroui-pretext"
description = "Reusable text preparation, Unicode wrapping and rich inline layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[package.metadata.release]
group = "rendering"

[dependencies]
ferroui-pretext-contracts.workspace = true
unicode-segmentation = "1.12"
unicode-general-category = "1"
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_locale_core = "=2.3.0"
icu_properties = "=2.3.0"

[dev-dependencies]
serde_json = "1"
