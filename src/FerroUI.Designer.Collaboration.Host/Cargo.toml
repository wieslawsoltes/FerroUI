[package]
name = "ferroui-designer-collaboration-host"
description = "Durable authenticated designer rooms, reconnecting clients and an MCP collaboration service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "ferroui-collaboration-server"
path = "main.rs"
required-features = ["server"]

[features]
default = []
client = ["dep:ureq", "dep:url"]
server = ["dep:ferroui-mcp", "dep:url"]

[dependencies]
ferroui-designer-collaboration = { version = "=0.4.0", path = "../FerroUI.Designer.Collaboration" }
ferroui-designer-core = { version = "=0.4.0", path = "../FerroUI.Designer.Core" }
ferroui-mcp = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom.workspace = true
ureq = { version = "2.12.1", default-features = false, features = ["tls"], optional = true }
url = { version = "2", optional = true }

[package.metadata.release]
group = "tools"
