# The configuration of the C header of the ABI (`include/ferroui.h`), generated by cbindgen from
# the sources of this crate. Write it again after a change of the ABI with
# `FERROUI_CAPI_WRITE_HEADER=1 cargo test -p ferroui-capi --lib header`; the same test without the
# variable fails when the header is out of date (docs/c-abi.md, section 7).

language = "C"
header = """/* The C ABI of FerroUI (docs/c-abi.md).
 *
 * Generated by cbindgen from the sources of src/FerroUI.CApi: do not edit. Write it again with
 * FERROUI_CAPI_WRITE_HEADER=1 cargo test -p ferroui-capi --lib header
 */"""
include_guard = "FERROUI_H"
cpp_compat = true
no_includes = true
sys_includes = ["stdbool.h", "stdint.h"]
documentation = true
documentation_style = "c99"
line_length = 100
tab_width = 4
style = "type"
usize_is_size_t = true

[export]
item_types = ["constants", "typedefs", "structs", "functions"]

[fn]
args = "auto"
