[package]
name = "ferroui-metal"
description = "The Metal platform contracts of FerroUI: the device, the surface of a top-level and the import of external objects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[features]
# Offscreen platform surface for common renderer tests and benchmarks.
offscreen = ["dep:objc2", "dep:objc2-metal"]

[dependencies]
ferroui-base.workspace = true

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "rendering"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.3", optional = true }
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["std", "MTLAllocation", "MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLTexture", "MTLResource", "MTLPixelFormat", "MTLTypes", "MTLEvent"] }
