[package]
name = "ferroui-designer-preview"
description = "Headless FerroUI designer preview and source edit service for IDEs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "ferroui-designer-preview"
path = "main.rs"

[dependencies]
base64 = "0.22"
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-designer = { workspace = true, features = ["mcp"] }
ferroui-designer-core.workspace = true
ferroui-designer-language.workspace = true
ferroui-designer-rsx.workspace = true
ferroui-designer-tools.workspace = true
ferroui-harfbuzz.workspace = true
ferroui-headless.workspace = true
ferroui-inspect.workspace = true
ferroui-mcp.workspace = true
ferroui-themes-winui.workspace = true
ferroui-vello.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.release]
group = "tools"
