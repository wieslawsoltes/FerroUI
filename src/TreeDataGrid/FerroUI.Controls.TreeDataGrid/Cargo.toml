[package]
name = "ferroui-controls-treedatagrid"
description = "The TreeDataGrid control of FerroUI: hierarchical and tabular data in one virtualizing view, with sorting, selection, editing, drag and drop and its control themes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
# The build script compiles the theme documents of the crate and exports its type model with them;
# Cargo hands the path of the file to the build scripts of the crates that depend on this one
# (docs/porting/xaml.md, 9.5.13 and 9.6.3): an application whose documents name the types of the
# library and include its styles.
links = "ferroui_controls_treedatagrid_xaml"

# Unit tests live next to the code (`tests/` modules of the library), not as
# integration test targets.
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[features]
# The theme documents are also embedded as assets of the assembly, next to their compiled markup,
# for an application that loads its own markup at run time and includes the styles of the library
# (as the colour picker's feature of the same name).
document-assets = []

[dependencies]
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup-xaml = { workspace = true }
ferroui-treedatagrid-core = { workspace = true }

[build-dependencies]
ferroui-build = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime", "testing", "emitter"] }
ferroui-themes-fluent = { workspace = true }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "controls"
