[package]
name = "ferroui-controls-keytips"
description = "WinUI access keys for FerroUI: Key Tips, scopes and invoking a control by its key."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
links = "ferroui_controls_keytips_xaml"
autotests = false
autobenches = false
autoexamples = false

[lib]
path = "lib.rs"

[dependencies]
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls.workspace = true
ferroui-system.workspace = true

[build-dependencies]
ferroui-build-scan.workspace = true

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
ferroui-markup-xaml-loader = { workspace = true, features = ["runtime"] }

# The group of the crate in the table of the README (docs/release.md).
[package.metadata.release]
group = "controls"
