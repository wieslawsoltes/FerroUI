[package]
name = "ferroui-media-browser"
description = "Page-owned WebGL frame storage and direct texture presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
[lib]
path = "lib.rs"
[dependencies]
ferroui-base.workspace = true
ferroui-media.workspace = true
ferroui-opengl.workspace = true
ferroui-browser.workspace = true
wasm-bindgen.workspace = true
ferroui-media-controls = {workspace=true,optional=true}
ferroui-media-qr = { workspace = true, default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
[features]
controls = ["dep:ferroui-media-controls"]
qr = ["dep:ferroui-media-qr", "dep:serde_json"]
[package.metadata.release]
group = "platforms"
