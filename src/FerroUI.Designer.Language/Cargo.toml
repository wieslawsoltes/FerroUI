[package]
name = "ferroui-designer-language"
description = "XAML language services and stdio language server for FerroUI visual designers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# The designer crates are published from 0.5 (owner decision D6 of #345).
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "ferroui-xaml-lsp"
path = "main.rs"

[dependencies]
ferroui-designer-core = { workspace = true }
ferroui-designer-project = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.release]
group = "tools"
