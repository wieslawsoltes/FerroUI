[package]
name = "ferroui-designer-language"
description = "XAML language services and stdio language server for FerroUI visual designers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# The designer crates are published from 0.5 (owner decision D6 of #345).
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "ferroui-xaml-lsp"
path = "main.rs"

[[bin]]
name = "ferroui-qml-lsp"
path = "qml_main.rs"
required-features = ["qml"]

[features]
qml = ["dep:ferroui-qml", "dep:ferroui-qml-controls", "dep:ferroui-qml-compiler", "dep:url"]

[dependencies]
ferroui-qml = { workspace = true, optional = true }
ferroui-qml-controls = { workspace = true, optional = true }
ferroui-qml-compiler = { workspace = true, optional = true, features = ["javascript"] }
url = { version = "2", optional = true }
ferroui-designer-core = { workspace = true }
ferroui-designer-project = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.release]
group = "tools"
