[package]
name = "ferroui-designer-language"
description = "XAML language services and stdio language server for FerroUI visual designers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "ferroui-xaml-lsp"
path = "main.rs"

[dependencies]
ferroui-build-scan = { workspace = true }
ferroui-designer-core = { workspace = true }
ferroui-designer-project = { workspace = true }
ferroui-designer-tools = { workspace = true }
ferroui-markup-syntax.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }

[package.metadata.release]
group = "tools"
