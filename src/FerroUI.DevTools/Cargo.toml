[package]
name = "ferroui-devtools"
description = "Opt-in Chrome DevTools Protocol target for FerroUI applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "lib.rs"

[dependencies]
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-inspect.workspace = true
serde_json = "1"
base64 = "0.22"

[package.metadata.release]
group = "controls"

[features]
default = ["server"]
server = ["dep:tungstenite"]
browser = ["dep:wasm-bindgen", "dep:js-sys"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.28", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
