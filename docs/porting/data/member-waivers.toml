# Types and members that are intentionally not ported, and name aliases. Read by scripts/port-status/port_status.py.
# A waiver only applies to an item the scanner did not find; waived items are listed in the
# tracking pages with the reason and are excluded from the percentages.
#
# [[waive]]
#   project = upstream project name; omit to match in every project
#   type    = glob on the upstream full type name (`Avalonia.Point`, `Avalonia.Media.*`); omit for any type
#   member  = glob on the member name or on its signature text; omit to waive the whole type
#   reason  = shown in the tracking pages

[[waive]]
project = "Avalonia.Base"
member = "*Matrix4x4*"
reason = "System.Numerics interop, not applicable"

[[waive]]
project = "Avalonia.Base"
type = "Avalonia.Vector*"
member = "*Vector2*"
reason = "System.Numerics interop, not applicable"

[[waive]]
project = "Avalonia.Base"
type = "Avalonia.Vector3D"
member = "*Vector3 *"
reason = "System.Numerics interop, not applicable"

[[waive]]
member = "GetHashCode"
reason = "Rust: `Hash` is derived where the type can be hashed; float-based value types are not `Eq`/`Hash`"

[[waive]]
project = "Avalonia.Base"
type = "Avalonia.Collections.IAvaloniaList*"
member = "new *"
reason = "re-declaration of a member of IAvaloniaReadOnlyList<T>/IList<T>: the Rust trait inherits `count`/`get` from IFerroReadOnlyList and declares `set`"

[[waive]]
project = "Avalonia.Base"
type = "Avalonia.Utilities.WeakEvents"
member = "AvaloniaPropertyChanged"
reason = "ported as `WeakEvents::ferro_property_changed` (rule 2 of the porting guide; the scanner does not rename members)"

[[waive]]
project = "Avalonia.Base"
type = "Avalonia.Layout.BringIntoViewRequest"
member = "BringIntoViewRequest(*"
reason = "the abstract class is the trait `BringIntoViewRequest`; an implementation stores its own target and answers `target()`"

# Aliases: Rust functions that implement an upstream member under a name the default rule
# (`DoIt` -> `do_it` / `do_it_*`) cannot derive.
#
# [[alias]]
#   project = upstream project name; omit to match in every project
#   type    = glob on the upstream full type name
#   member  = upstream member name
#   rust    = list of Rust fn names on the mapped type; each one stands for one overload

[[alias]]
project = "Avalonia.Base"
type = "Avalonia.Media.Color"
member = "ToHsl"
