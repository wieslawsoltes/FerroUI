# Rendering/Composition (triage of 2026-10-08; the reasons read again against the render thread on
# 2026-10-09). The UI-thread objects are ported as one `CompositionVisual` with a kind per upstream
# class. The server compositor is rendered by the thread of its compositor (a render loop of the UI
# thread), by the thread of the render loop under the compositor lock (the render-thread mode,
# render-thread.md R5), or by that thread alone (a compositor confined to its render thread,
# browser-render-worker.md B2.4). What the two sides share is what is `Send`: the queue of batches,
# the readback indices, the handle of a batch and the jobs; an object of the server side is named by
# its id or bound to the lock (`LockBound`) where upstream holds the object itself. Several members
