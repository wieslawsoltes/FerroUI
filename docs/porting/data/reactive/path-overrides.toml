# Exceptions to the default upstream-file -> Rust-file rule for the Rx.NET reference. The format is that of
# docs/porting/data/path-overrides.toml, with one more table, `[[dir]]`; read by
# `scripts/port-status/port_status.py --reference reactive`.
#
# Default rule (no entry needed):
#   Rx.NET/Source/src/System.Reactive/Subjects/BehaviorSubject.cs -> src/FerroUI.Reactive/subjects/behavior_subject.rs
#   an upstream file the module documentation of a Rust file cites (`//! ... (`Internal/Sink.cs`)`) -> that file
#   (references.toml, `doc_citations`)
#
# [[dir]]
#   project  = upstream project name; omit to match in every project
#   upstream = an upstream directory below the project
#   rust     = the Rust directory of its files, below the crate ("" for the crate root)

# ---------------------------------------------------------------- System.Reactive

[[dir]]
project = "System.Reactive"
upstream = "Linq/Observable"
rust = "linq"

[[map]]
project = "System.Reactive"
upstream = ["Linq/Observable.Aggregates.cs", "Linq/Observable.Async.cs", "Linq/Observable.Awaiter.cs", "Linq/Observable.Binding.cs",
            "Linq/Observable.Blocking.cs", "Linq/Observable.Concurrency.cs", "Linq/Observable.Conversions.cs", "Linq/Observable.Creation.cs",
            "Linq/Observable.Events.cs", "Linq/Observable.Imperative.cs", "Linq/Observable.Joins.cs", "Linq/Observable.Multiple.CombineLatest.cs",
            "Linq/Observable.Multiple.Zip.cs", "Linq/Observable.Multiple.cs", "Linq/Observable.Single.cs",
            "Linq/Observable.StandardSequenceOperators.cs", "Linq/Observable.Time.cs", "Linq/Observable_.cs", "Linq/ObservableEx.cs"]
kind = "merged"
rust = ["linq/creation.rs", "linq/observable_ext.rs"]
types = { Observable = ["Observable", "ObservableExt", "ConnectableObservableExt"], ObservableEx = ["Observable", "ObservableExt", "ConnectableObservableExt"] }
reason = "the partial static class Observable (and the experimental ObservableEx): its static methods are associated functions of `Observable`, its extension methods are methods of `ObservableExt` (and of `ConnectableObservableExt` for the connectable sequences), written by the `*_methods!` macro of each operator module"

[[map]]
project = "System.Reactive"
upstream = ["Observable.Extensions.cs"]
kind = "merged"
rust = ["linq/subscribe.rs", "linq/observable_ext.rs"]
types = { ObservableExtensions = ["ObservableExt"] }
reason = "the Subscribe overloads of ObservableExtensions are methods of `ObservableExt` (`subscribe_methods!`)"

[[map]]
