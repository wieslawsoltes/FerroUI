# Types and members of Rx.NET that are intentionally not ported, and name aliases. The format is that of
# docs/porting/data/member-waivers.toml; read by `scripts/port-status/port_status.py --reference reactive`.
# The waivers are those of docs/porting/reactive.md, section 5 ("Out of scope"). The asynchronous forms (Task,
# async/await: phase 4) are not waived: until they are ported they are missing.
#
# A waiver applies to an item the scanner did not find. Overloads are found by name for this reference
# (references.toml, `overloads = "name"`), so a waiver that names a method overload (by name or by a glob on its
# signature) waives it even when another overload of the name exists.
#
# The files of the platforms the net8.0 target does not compile (Windows Forms, WPF, WinRT) and the internal files of
# the waived parts are in path-overrides.toml.

