# Only CLR-specific mechanisms are waived. Rust-equivalent operations use aliases.
[[waive]]
type = "Microsoft.Extensions.DependencyInjection.FromKeyedServicesAttribute"
reason = "keyed(T,key) and inherited(T) macro parameters write Dependency metadata and lookup code instead of CLR attributes"

[[waive]]
type = "Microsoft.Extensions.DependencyInjection.ServiceKeyAttribute"
reason = "key() macro parameter injects the current service key without a CLR attribute"

[[alias]]
type = "Microsoft.Extensions.DependencyInjection.KeyedService"
member = "AnyKey"
rust = ["ANY"]
reason = "ServiceKey::ANY"

[[alias]]
type = "Microsoft.Extensions.DependencyInjection.AsyncServiceScope"
member = ".ctor"
rust = ["new"]
reason = "AsyncServiceScope::new wraps an arbitrary IServiceScope"

[[alias]]
type = "Microsoft.Extensions.DependencyInjection.ServiceCollection"
member = "Count"
rust = ["len"]
reason = "Rust collection naming"

[[alias]]
type = "Microsoft.Extensions.DependencyInjection.ServiceCollection"
member = "this[]"
rust = ["index", "index_mut"]
reason = "Index/IndexMut implementations"

[[alias]]
type = "Microsoft.Extensions.DependencyInjection.ServiceCollection"
member = "GetEnumerator"
rust = ["iter"]
reason = "Rust iterator (also IntoIterator for &ServiceCollection)"

