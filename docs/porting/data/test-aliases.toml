# Upstream tests that the port has under another name (`[[alias]]`), and upstream tests that are not ported
# for a stated reason (`[[waive]]`). Read by scripts/port-status/test_gaps.py; the format is described at its
# top. One section per upstream test project; every entry names its project and applies to that project only,
# and only to a test that is not present by name. A waived test is listed with its reason in the output of the
# project and is not counted as missing.
#
# The rule of the port is upstream's test names. An alias is for a name that cannot be kept: one upstream theory
# that became several tests, two upstream files with a test of the same name that share one Rust file, or a
# member that the port names differently because it is a different member. A waiver is for a test that cannot be
# expressed or whose subject the port does not have by decision. A test whose subject is not ported yet, or
# which needs a crate other than the one its upstream file belongs to, is NOT waived: it stays in the count of
# missing tests.

