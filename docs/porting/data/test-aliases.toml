# Upstream tests that the port has under another name, and upstream tests that are deliberately not ported.
# Read by scripts/port-status/test_gaps.py (the format is described at its top). An entry applies only to a test
# that was not found by name; a waived test is listed with its reason and is not counted as missing.
#
# The rule of the port is upstream's test names. An alias is for a name that cannot be kept: one upstream theory
# that became several tests, two upstream files with a test of the same name that share one Rust file, or a
# member that the port names differently because it is a different member. A test whose subject is not ported
# yet, or which needs a crate other than the one its upstream file belongs to, is NOT waived: it stays in the
# count of missing tests.

# --- Aliases --------------------------------------------------------------------------------------------------

