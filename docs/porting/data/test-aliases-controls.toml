# Upstream tests of the controls (and of the smaller test projects) that the port has under another name
# (`[[alias]]`) or does not have for a stated reason (`[[waive]]`). Read by
# scripts/port-status/test_gaps_controls.py; the format is described at the top of the script.
#
# A waiver is for a test that cannot be expressed or whose subject the port does not have. A test that is
# only not ported yet is not waived: it stays in the list of missing tests.

# --- Avalonia.Controls.UnitTests ------------------------------------------------------------------------------

[[alias]]
project = "Avalonia.Controls.UnitTests"
file = "GridLengthTests.cs"
test = "ToString_AllCulture_Should_Pass"
rust = "to_string_should_pass"
reason = "the test sets every culture as the current one and formats; the port has no current culture and formats invariantly, so the three rows are formatted once"

[[waive]]
project = "Avalonia.Controls.UnitTests"
file = "NavigationPageTests.cs"
tests = [
    "InsertPage_NullPage_ThrowsArgumentNullException",
    "InsertPage_NullBefore_ThrowsArgumentNullException",
    "RemovePage_NullPage_ThrowsArgumentNullException",
    "ReplaceAsync_NullPage_Throws",
]
reason = "the argument is a `Ref<Page>`, which cannot be null: the check of the argument has no counterpart"

[[waive]]
project = "Avalonia.Controls.UnitTests"
file = "ConnectedAnimationTests.cs"
tests = [
    "GetForTopLevel_NullTopLevel_ThrowsArgumentNullException",
    "PrepareToAnimate_NullKey_ThrowsArgumentNullException",
    "PrepareToAnimate_NullSource_ThrowsArgumentNullException",
]
reason = "the arguments are references (`&TopLevel`, `&str`, `&Visual`), which cannot be null: the checks of the arguments have no counterpart"

[[waive]]
project = "Avalonia.Controls.UnitTests"
file = "PanelTests.cs"
test = "Adding_Null_Child_Should_Throw"
reason = "the children of a panel are `Ref<Control>`, which cannot be null"

[[waive]]
project = "Avalonia.Controls.UnitTests"
file = "Utils/SafeEnumerableHashSetTests.cs"
reason = "`SafeEnumerableHashSet` is not ported: its one user, the listener set of `Classes`, is a `HandlerList` in the port (docs/porting/data/path-overrides.toml, `Utilities/SafeEnumerableHashSet.cs`), and the tests observe the inner set of the class"

[[waive]]
project = "Avalonia.Controls.UnitTests"
file = "ItemsSourceViewTests.cs"
test = "Cannot_Create_ItemsSourceView_With_Collection_That_Implements_INCC_But_Not_List"
reason = "an items source of the port is an `Rc<dyn IItemsList>`: a collection that notifies but is not a list cannot be handed to `ItemsSourceView::get_or_create`"

[[waive]]
project = "Avalonia.Controls.UnitTests"
file = "Selection/InternalSelectionModelTests.cs"
test = "Does_Not_Accept_Fixed_Size_Items"
reason = "`WritableSelectedItems` is an `Rc<FerroList<..>>`, which is never of a fixed size: an array cannot be assigned"

[[waive]]
project = "Avalonia.Controls.UnitTests"
file = "Platform/ScreensTests.cs"
test = "Should_Raise_Event_When_Screen_Changed_From_Another_Thread"
reason = "the screens of the port are reference counted on the UI thread (`Rc`, not `Send`): a change cannot be pushed from another thread, a platform posts it to the dispatcher itself"
