# Member waivers and aliases of the Xaml.Behaviors reference (scripts/port-status/references.toml, `behaviors`).
# See scripts/port-status/README.md, "Files you edit", and docs/porting/behaviors.md, section 3.

# ---------------------------------------------------------------------------------------------------------------
# Waived projects (docs/porting/behaviors.md, section 3; DEVIATIONS.md, section Behaviors)
# ---------------------------------------------------------------------------------------------------------------

[[waive]]
project = "Xaml.Behaviors.Interactions.Scripting"
type = "*"
reason = "Interactions.Scripting runs C# source with Roslyn scripting; there is no C# run time in a Rust application"

[[waive]]
project = "Xaml.Behaviors.Interactions.DragAndDrop.DataGrid"
type = "*"
reason = "Interactions.DragAndDrop.DataGrid reorders the rows of a DataGrid; FerroUI has no DataGrid (only the TreeDataGrid)"

[[waive]]
project = "Xaml.Behaviors.SourceGenerators"
type = "*"
reason = "SourceGenerators is compile-time C# tooling (a Roslyn incremental generator); typed actions and triggers are written directly in Rust"

# ---------------------------------------------------------------------------------------------------------------
# Generic classes: `new T? AssociatedObject` of the generic bases is the typed accessor `associated_object_as::<T>()`
# of the non-generic `<Name>OfT` classes (path-overrides.toml maps the types).
# ---------------------------------------------------------------------------------------------------------------

[[alias]]
project = "Xaml.Behaviors.Interactivity"
type = "Avalonia.Xaml.Interactivity.Behavior<T>"
member = "AssociatedObject"
rust = ["associated_object_as"]
reason = "FerroUI classes are not generic: the associated object as `T` is `associated_object_as::<T>()`"

[[alias]]
project = "Xaml.Behaviors.Interactivity"
type = "Avalonia.Xaml.Interactivity.Trigger<T>"
member = "AssociatedObject"
rust = ["associated_object_as"]
reason = "FerroUI classes are not generic: the associated object as `T` is `associated_object_as::<T>()`"

[[alias]]
project = "Xaml.Behaviors.Interactivity"
type = "Avalonia.Xaml.Interactivity.StyledElementBehavior<T>"
member = "AssociatedObject"
rust = ["associated_object_as"]
reason = "FerroUI classes are not generic: the associated object as `T` is `associated_object_as::<T>()`"

[[alias]]
project = "Xaml.Behaviors.Interactivity"
type = "Avalonia.Xaml.Interactivity.StyledElementTrigger<T>"
member = "AssociatedObject"
rust = ["associated_object_as"]
reason = "FerroUI classes are not generic: the associated object as `T` is `associated_object_as::<T>()`"

