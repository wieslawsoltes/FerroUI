# Test aliases and waivers of the Xaml.Behaviors reference (scripts/port-status/references.toml, `behaviors`).
# See the top of scripts/port-status/test_gaps.py. The tests that are not ported state their reason in the Rust test
# files (`// Not ported: <Name> - <reason>`), which test_gaps.py reads.

# The names that contain the name of the reference's framework drop it (the port does not name the framework).

[[alias]]
project = "Xaml.Behaviors.Interactions.UnitTests"
file = "Core/ChangePropertyActionTests.cs"
test = "ExecuteReversibly_Does_Not_Apply_To_Direct_Avalonia_Property"
