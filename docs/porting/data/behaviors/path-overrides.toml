# Path overrides of the Xaml.Behaviors reference (scripts/port-status/references.toml, `behaviors`).
# See scripts/port-status/README.md, "Files you edit".
#
# The generic classes of the reference that sit beside a non-generic class of the same name (`Behavior<T>` beside
# `Behavior`) are the classes `<Name>OfT` of the port, in the file of the reference's `<Name>OfT.cs`: FerroUI classes
# are not generic, the class stores the expected type of its associated object and checks it on attach
# (docs/porting/behaviors.md, section 3). Without the rename the scanner would take the non-generic class.

[[map]]
project = "Xaml.Behaviors.Interactivity"
upstream = ["AvaloniaObject/BehaviorOfT.cs"]
kind = "renamed"
rust = ["ferro_object/behavior_of_t.rs"]
types = { Behavior = "BehaviorOfT" }
reason = "`Behavior<T>` is the non-generic class `BehaviorOfT`, which checks the type of the associated object on attach"

[[map]]
project = "Xaml.Behaviors.Interactivity"
upstream = ["AvaloniaObject/TriggerOfT.cs"]
kind = "renamed"
rust = ["ferro_object/trigger_of_t.rs"]
types = { Trigger = "TriggerOfT" }
reason = "`Trigger<T>` is the non-generic class `TriggerOfT`, which checks the type of the associated object on attach"

[[map]]
project = "Xaml.Behaviors.Interactivity"
upstream = ["StyledElement/StyledElementBehaviorOfT.cs"]
kind = "renamed"
rust = ["styled_element/styled_element_behavior_of_t.rs"]
types = { StyledElementBehavior = "StyledElementBehaviorOfT" }
reason = "`StyledElementBehavior<T>` is the non-generic class `StyledElementBehaviorOfT`, which checks the type of the associated object on attach"

[[map]]
project = "Xaml.Behaviors.Interactivity"
upstream = ["StyledElement/StyledElementTriggerOfT.cs"]
kind = "renamed"
rust = ["styled_element/styled_element_trigger_of_t.rs"]
types = { StyledElementTrigger = "StyledElementTriggerOfT" }
reason = "`StyledElementTrigger<T>` is the non-generic class `StyledElementTriggerOfT`, which checks the type of the associated object on attach"

[[map]]
project = "Xaml.Behaviors.Interactions.Custom"
upstream = ["Core/RoutedEventTriggerBaseOfT.cs"]
kind = "renamed"
rust = ["core/routed_event_trigger_base_of_t.rs"]
types = { RoutedEventTriggerBase = "RoutedEventTriggerBaseOfT" }
reason = "`RoutedEventTriggerBase<T>` is the non-generic class `RoutedEventTriggerBaseOfT`, whose handler takes the routed event arguments as `&dyn IRoutedEventArgs`"

# The abstract class `BaseTreeViewDropHandler` is a trait; its overrides of `DropHandlerBase` are the blanket
# implementation `impl<H: BaseTreeViewDropHandler> DropHandlerBase for H` of the same file, whose members count for it.
[[map]]
project = "Xaml.Behaviors.Interactions.DragAndDrop"
upstream = ["Behaviors/BaseTreeViewDropHandler.cs"]
kind = "renamed"
rust = ["behaviors/base_tree_view_drop_handler.rs"]
types = { BaseTreeViewDropHandler = ["BaseTreeViewDropHandler", "H"] }
reason = "the abstract class is a trait; its overrides are the blanket implementation of `DropHandlerBase` for every type that implements it"

# A polyfill of the compiler (`init` accessors on .NET Standard 2.0) in the waived source generator.
[[map]]
project = "Xaml.Behaviors.SourceGenerators"
upstream = ["IsExternalInit.cs"]
kind = "not-applicable"
reason = "a polyfill of the C# compiler for `init` accessors on .NET Standard 2.0 in the waived source generator"

