# section 5). Only names whose Rust form differs from the mechanical one (snake_case of the
# upstream name, the same type name) are listed; a control member that keeps its name is not. Each
# pull request that replaces a type or a trait adds its rows.
#
#   upstream    the upstream name: namespace and type, or type.member
#   rust        the Rust path that replaces it
#   kind        type | trait | member | mechanism
#   phase       the phase of #423 that made the change
#   pull        the pull request
#   deprecated  the old Rust path, while it remains (optional)
#   behaviour   same | test | deviation: how the behaviour is kept
#   notes       optional

