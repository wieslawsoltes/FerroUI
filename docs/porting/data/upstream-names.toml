notes = "Step T3 (decisions O1, O2). The timer properties and functions take Duration: TextBox, TextPresenter and RichEditBox CaretBlinkInterval, ScrollBar HideDelay and ShowDelay, AutoCompleteBox MinimumPopulateDelay, the durations of DirectConnectedAnimationConfiguration and ConnectedAnimationService, DebounceAction Delay, ThrottleAction Interval, DelayAction Duration, DelayedLoadBehavior Delay, DelayedLoadTrigger Delay, DelayedShowControlAction Delay, InactivityTrigger Timeout, VisualDebugBehavior Duration, SelectionIndicatorAnimation default_duration and try_start, DeferredContentScheduling.Delay, the timeline and settings of the deferred content control, DelayedUniformTabPanel ExpansionDelay. The markup name stays System.TimeSpan; a negative span is a markup error and a conversion error of a binding. Deviation: the infinite wait of DelayAction is Duration::MAX, not minus one millisecond (DEVIATIONS.md, Behaviors)."
