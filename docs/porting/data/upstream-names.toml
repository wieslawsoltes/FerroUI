# C4: `Task`, `TaskCompletionSource` and `SynchronizationContext` become futures on the executor of
# `ferroui_system::task` (docs/idiomatic-rust-async.md); the old types remain one release as
# deprecated wrappers.

[[name]]
upstream = "System.Threading.Tasks.TaskCompletionSource"
rust = "ferroui_system::task::oneshot"
kind = "type"
phase = "C4"
pull = 508
deprecated = "ferroui_x11::selections::selection_helper::TaskCompletionSource"
behaviour = "deviation"
notes = "Step A3. `oneshot::channel()` gives a Sender (SetResult and TrySetResult are send, which gives the value back when the receiver is gone; SetCanceled is dropping the sender) and a Receiver (the task: a future of Result<T, Canceled>, try_recv, blocking_recv, recv_timeout, shared() for several waiters). A dropped sender cancels its receiver, where a dropped TaskCompletionSource leaves its task pending (F6; DEVIATIONS rows of the X11, remote protocol, iOS, Android and WinUI code). Also deprecated: ferroui_x11::selections::selection_helper::TaskCompletionFuture, ferroui_ios::completion::{Completion, CompletionFuture}. ferroui_system::threading::tasks::TaskCompletionSource keeps its behaviour until the steps that replace its uses (section 4)."

[[name]]
upstream = "System.Threading.CancellationTokenSource"
rust = "ferroui_system::threading::CancellationToken"
kind = "type"
phase = "C4"
deprecated = "ferroui_system::threading::CancellationTokenSource"
behaviour = "same"
notes = "Step A4b. A token that can be canceled is CancellationToken::new(); Token is a clone of it, Cancel is cancel(), IsCancellationRequested is is_cancelled(), CreateLinkedTokenSource is child_token() of the outer token. CancellationToken.CanBeCanceled is can_be_cancelled(); CancellationToken.None and the default token stay none(). The callbacks run once, in the order of registration, on the cancelling thread (the order is a DEVIATIONS row). Also deprecated: CancellationToken::is_cancellation_requested, CancellationToken::can_be_canceled, ferroui_freedesktop::signal_watch::{CancellationFlag, Cancelled} (the token, cancelled() and signal_watch::run_until_cancelled), ferroui_protranslate_studio::AiCancellationToken, CancellationDisposable::with_source (with_token)."

[[name]]
upstream = "System.Threading.CancellationTokenRegistration"
rust = "ferroui_system::threading::CancellationGuard"
kind = "type"
phase = "C4"
deprecated = "ferroui_system::threading::CancellationTokenRegistration"
behaviour = "test"
notes = "Step A4b. CancellationToken::register and register_local give the guard: #[must_use], Send, dropping it removes the callback (Dispose), detach() keeps it for the life of the token, which is what dropping a CancellationTokenRegistration did. The old forms are the deprecated register_handle and register_local_handle (and LocalCancellationTokenRegistration); register_guarded and register_local_guarded are deprecated aliases of register and register_local. Tested in src/FerroUI.System/tests/cancellation_tests.rs."

[[name]]
upstream = "System.OperationCanceledException"
rust = "ferroui_system::task::Canceled"
kind = "type"
phase = "C4"
deprecated = "ferroui_base::threading::OperationCanceledError"
behaviour = "same"
notes = "Step A4b. The dispatcher operations (wait, wait_with_timeout, result, the future), the synchronous invokes, DispatcherTask, AutoCompletePopulation, HeadlessUnitTestTask and the TaskHandle of the behaviors give Canceled (re-exported as ferroui_base::threading::Canceled); OperationCanceledError converts to and from it. Its message is the one of Canceled."

[[name]]
upstream = "System.Threading.Tasks.TaskCanceledException"
rust = "ferroui_system::task::Canceled"
kind = "type"
phase = "C4"
behaviour = "same"
notes = "Step A4b. A cancellation that names no task (threading::tasks::canceled(), the cancellation of RunAsync, the work of the tests) is Canceled; TaskCanceledError::is_cancellation recognizes both, and a Canceled cancels a Task as a TaskCanceledError does. TaskCanceledError stays, not deprecated, as the outcome of a canceled Task that names it (TaskCanceledException.Task), until Task moves to the executor (A7)."

[[name]]
upstream = "System.Threading.SynchronizationContext"
rust = "ferroui_system::task::Schedule"
kind = "type"
phase = "C4"
deprecated = "ferroui_system::threading::SynchronizationContext"
behaviour = "test"
notes = "Step A5. Post is Schedule::schedule (Send work) and Schedule::schedule_local (work of the thread of the schedule); Send and OperationStarted/OperationCompleted have no counterpart (blocking on the dispatcher is Dispatcher::invoke). A dispatcher is the schedule of its thread (task::set_thread_schedule) from its start to its shutdown, and its task_schedule(priority) is the context of a priority. A task spawned where a schedule is current continues by the rule of await: inline when completed in that schedule, queued on it otherwise (F3). threading::context_schedule adapts a context. The Rx forms of a context take a schedule: SynchronizationContextScheduler::with_schedule, ContextDisposable::with_schedule, observe_on_schedule, subscribe_on_schedule, notify_on_schedule, BindingSchedulers::use_schedule; their context forms are deprecated. Tested in src/FerroUI.Base/threading/dispatcher_schedule_tests.rs and src/FerroUI.System/tests/executor_tests.rs."

[[name]]
upstream = "System.Threading.SynchronizationContext.Current"
rust = "ferroui_system::task::current_schedule"
kind = "member"
phase = "C4"
deprecated = "ferroui_system::threading::current_synchronization_context"
behaviour = "same"
notes = "Step A5. The schedule of the running work: in a dispatcher job the dispatcher at the priority of the job, None outside of such work (a thread without a dispatcher, or the code of a dispatcher thread outside of a job unless Dispatcher::set_current_priority set one). is_current_schedule compares by Schedule::identity. FromEvent, the awaiter of AsyncSubject, ConfigureAwait(true) of ScheduleAsync and the dock services capture it."

[[name]]
upstream = "System.Threading.SynchronizationContext.SetSynchronizationContext"
rust = "ferroui_system::task::set_current_schedule"
kind = "member"
phase = "C4"
deprecated = "ferroui_system::threading::set_synchronization_context"
behaviour = "same"
notes = "Step A5. Gives the previous schedule, which the caller restores; a dispatcher sets it around each job. The schedule that the wakes from other threads go to is task::set_thread_schedule; the deprecated set_synchronization_context sets both to an adapter of the context."

[[name]]
upstream = "Avalonia.Threading.AvaloniaSynchronizationContext"
rust = "ferroui_base::threading::Dispatcher::current_priority"
kind = "type"
phase = "C4"
deprecated = "ferroui_base::threading::FerroSynchronizationContext"
behaviour = "same"
notes = "Step A5. The context of the dispatcher kept one role, the priority of the running job: Dispatcher::current_priority (None outside of a job) and Dispatcher::set_current_priority (InstallIfNeeded, which Application does at Normal; the previous priority is given back, in the place of RestoreContext, also deprecated). Post is Dispatcher::post or post_local at that priority; the context of a priority as a schedule is Dispatcher::task_schedule(priority). FerroScheduler::install_on_ui_thread is deprecated: the dispatcher installs itself."

