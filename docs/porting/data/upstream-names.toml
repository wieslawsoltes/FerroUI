behaviour = "deviation"
notes = "Step A6. The Task that an asynchronous member returns is the JoinHandle of a task of the dispatcher (re-exported by ferroui_base::threading with JoinError and AbortHandle): a future of Result<T, JoinError>, is_finished (IsCompleted), abort (the outcome is JoinError::Canceled), one owner (shared() for several observers, T: Clone); dropping it detaches the task. Deviation: an exception of the task (a panic) is JoinError::Panicked, a value of the handle, where await raises it again; the code that awaits a task and must fail with it matches Panicked and calls resume_unwind. The members that returned DispatcherTask return JoinHandle: NavigationPage, INavigation and PageNavigationExtensions (PushAsync, PopAsync, PopToRootAsync, PopToPageAsync, ReplaceAsync, PushModalAsync, PopModalAsync, PopAllModalsAsync), Window.ShowDialog, TopLevel.RequestPlatformInhibition, IPageTransition.Start, ICompositionGlContext.DisposeAsync and ICompositionGlTexture.DisposeAsync; the navigation members and the dialogs keep their DispatcherTask form as deprecated ..._task methods. The Task of the behaviors is TaskHandle over a shared JoinHandle. Also deprecated: DispatcherTaskScheduler and Dispatcher::to_task_scheduler, to_task_scheduler_with_priority (Dispatcher::spawn_local, start_local, spawn_with_priority and their _with_priority forms). Tested in src/FerroUI.Base/threading/dispatcher_tests.rs and the tests of each member."

