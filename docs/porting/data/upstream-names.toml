# C4: `Task`, `TaskCompletionSource` and `SynchronizationContext` become futures on the executor of
# `ferroui_system::task` (docs/idiomatic-rust-async.md), and the workspace has one cancellation type,
# `CancellationToken`; the old types remain one release as deprecated wrappers and are removed in the
# release after 0.5. The steps and their pull requests: A1 the executor core (#500), A2 the
# dispatcher on it (#503), A3 the one-shot channel (#508), A4a and A4b the cancellation type and its
# uses (#510, #516), A5 the schedule of the thread (#523), A6 the asynchronous members (#530), A7 the
# Task forms of the reactive libraries (#533). A8 (`use_future` of `ferroui-view` on the dispatcher)
# changes no upstream name: the declarative API is FerroUI's own (docs/declarative-ui.md).

[[name]]
upstream = "System.Threading.Tasks.Task (an async method that runs on the current thread)"
rust = "ferroui_system::task::spawn_local"
kind = "mechanism"
phase = "C4"
pull = 500
deprecated = "ferroui_system::threading::tasks::spawn_local"
behaviour = "test"
notes = "Steps A1 and A5. The executor core: one task table and poll loop per thread (ferroui_system::task, named after std::task). spawn_local polls the future at once and gives a JoinHandle; spawn_local_on gives the task a Schedule (where its polls run), with FirstPoll::Now or Scheduled. A panic faults the task (JoinError::Panicked; F2). Where a schedule is current (a dispatcher job) a wake follows the rule of await: inline in the same schedule, queued on it otherwise (A5, F3). Tested in src/FerroUI.System/tests/executor_tests.rs and the ordering tests (G9, G19, G20)."

[[name]]
upstream = "System.Threading.Tasks.Task.Wait (a thread without a dispatcher)"
rust = "ferroui_system::task::block_on"
kind = "member"
phase = "C4"
pull = 500
deprecated = "ferroui_system::threading::tasks::block_on"
behaviour = "same"
notes = "Step A1. Runs a future to its end on the calling thread, with the tasks it spawns and the wakes from other threads (task::run_pending, deprecated as threading::tasks::run_pending_wakes); it raises the panic of its future again. A dispatcher thread does not block: waiting for a JoinHandle there is awaiting it in a task of the dispatcher."

[[name]]
upstream = "System.Threading.Tasks.TaskScheduler (TaskScheduler.FromCurrentSynchronizationContext of a dispatcher)"
rust = "ferroui_base::threading::Dispatcher::start_local"
kind = "type"
phase = "C4"
pull = 503
deprecated = "ferroui_base::threading::DispatcherTaskScheduler"
behaviour = "same"
notes = "Steps A2 and A6. The dispatcher is a Schedule per priority of ferroui_system::task (Dispatcher::task_schedule(priority): each poll is a job at that priority; a queued poll that runs inside its task's poll schedules it again after that poll, F1). to_task_scheduler().start_local(future) is Dispatcher::start_local(future) (the first poll inside the call), spawn_local is Dispatcher::spawn_local (the first poll in a job), spawn is Dispatcher::spawn; to_task_scheduler_with_priority(p) is the _with_priority forms at p. Also deprecated: Dispatcher::to_task_scheduler, to_task_scheduler_with_priority, FerroSynchronizationContext::to_task_scheduler. The order is unchanged (G1 to G17)."

[[name]]
upstream = "System.Threading.Tasks.TaskCompletionSource"
